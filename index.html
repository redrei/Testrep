{name:'Transit Renewal Act',cost:24,diff:7,bloc:'Technocrats',effects:{treasury:-80,popularity:6,stability:2},text:'Modernize urban rail and restore monumental stations.'},
{name:'Provincial Equality Act',cost:35,diff:9,bloc:'Provincials',effects:{treasury:-120,popularity:7,provinceLoyalty:5},text:'Guarantee per-capita investment outside Italia.'},
{name:'Veterans Settlement Act',cost:40,diff:9,bloc:'Imperialists',effects:{treasury:-100,favor:7,stability:3},text:'Housing and pensions for discharged legionaries.'},
{name:'Open Markets Charter',cost:32,diff:8,bloc:'Merchants',effects:{treasury:70,economy:5,popularity:-2},text:'Reduce tariffs and privatize selected state companies.'},
{name:'Universal Grain Guarantee',cost:44,diff:10,bloc:'Populists',effects:{treasury:-170,popularity:12,stability:4},text:'Price guarantees and emergency food reserves.'},

const story=[
{chapter:1,title:'The Empty Curule Chair',goal:'Pass two laws and reach 80 influence.',check:s=>s.billsPassed>=2&&s.influence>=80,reward:s=>{s.money+=350;s.favor+=5}},
{chapter:2,title:'Ledgers of the Subura',goal:'Reduce corruption below 45 and defeat three enemies.',check:s=>s.corruption<45&&s.enemiesDefeated>=3,reward:s=>{s.influence+=35;s.popularity+=8}},
{chapter:3,title:'The Provincial Compact',goal:'Raise average provincial loyalty to 55.',check:s=>avgProvince('loyalty')>=55,reward:s=>{s.provinceSupport+=20;s.influence+=45}},
{chapter:4,title:'The Election of Consuls',goal:'Win an election and reach the office of Consul.',check:s=>s.electionsWon>=1&&s.office>=3,reward:s=>{s.money+=900;s.favor+=10}},
{chapter:5,title:'The Northern Emergency',goal:'Raise military strength to 65 and stability to 55.',check:s=>s.world.military>=65&&s.world.stability>=55,reward:s=>{s.influence+=75;s.favor+=15}},
{chapter:6,title:'The Forty Houses',goal:'Recruit three companions and gain 300 combined faction approval.',check:s=>s.companions.length>=3&&Object.values(s.factions).reduce((a,b)=>a+b,0)>=300,reward:s=>{s.influence+=100}},
{chapter:7,title:'The Aeternum Engine',goal:'Research six technologies and explore ten provinces.',check:s=>s.research.length>=6&&s.visited.length>=10,reward:s=>{s.learning+=2;s.strategy+=2}},
{chapter:8,title:'The Fractured Eagle',goal:'Survive a civil crisis with stability above 60.',check:s=>s.flags.civilCrisis&&s.world.stability>=60,reward:s=>{s.influence+=160;s.popularity+=15}},
{chapter:9,title:'The Constitutional Convention',goal:'Pass the Constitutional Settlement.',check:s=>s.passed.includes('Constitutional Settlement'),reward:s=>{s.influence+=220}},
{chapter:10,title:'Rome Without End',goal:'Become Emperor or establish a lasting constitutional order.',check:s=>s.office>=7||s.flags.republicFounded,reward:s=>{s.flags.victory=true}}
];
const techs=[['Political Analytics',300,'rhetoric'],['Agricultural Automation',420,'economy'],['Legion Drone Doctrine',520,'military'],['Quantum Aqueducts',650,'stability'],['Medical Nanites',780,'health'],['Provincial Mesh Network',920,'loyalty'],['Fusion Grid',1150,'economy'],['Aeternum Archaeology',1500,'story']];
let selected='patrician',S=null,currentTab='Capital';
function fresh(){let p={};provinces.forEach((n,i)=>p[n]={loyalty:42+roll(17),economy:35+roll(25),unrest:roll(18),military:25+roll(25),governor:pick(['Aurelius','Valeria','Cassian','Octavia','Severus','Marcellus'])+' '+pick(['Varro','Crispus','Lupus','Falco','Naso','Drusus'])});return {version:2,name:'',origin:selected,day:1,year:2779,level:1,xp:0,xpNext:100,hp:100,maxHp:100,energy:10,maxEnergy:10,strength:4,endurance:4,charisma:4,rhetoric:4,strategy:4,learning:4,piety:5,influence:25,popularity:25,favor:15,money:650,provinceSupport:0,office:0,electionDay:30,electionsWon:0,billsPassed:0,enemiesDefeated:0,corruption:58,scandal:0,factions:{Traditionalists:35,Imperialists:30,Merchants:35,Populists:30,Technocrats:30,Provincials:25},world:{treasury:500,economy:50,stability:50,military:45},provinces:p,businesses:[],businessSlots:2,companions:[],inventory:['Ceremonial Gladius','Senatorial Toga'],research:[],visited:['Italia'],passed:[],storyIndex:0,sideQuests:[],flags:{},senators:makeSenators(),combat:null,log:[]}}
function makeSenators(){const first=['Lucius','Aelia','Gaius','Cassia','Titus','Flavia','Publius','Octavia','Decimus','Livia'];const last=['Cornelius','Claudius','Fabius','Valerius','Severus','Aemilius','Flavius','Julius'];return Array.from({length:36},(_,i)=>({name:pick(first)+' '+pick(last),faction:pick(Object.keys(factionData)),relation:roll(51)-11,power:10+roll(35),greed:roll(100),ambition:roll(100),secret:pick(['hidden debt','provincial patron','military contacts','media ownership','temple oath','family feud'])}))}
function initOrigins(){$('origins').innerHTML=Object.entries(origins).map(([k,o])=>`<button class="origin ${k===selected?'selected':''}" onclick="selectOrigin('${k}')"><b>${o.name}</b><div class="small">${o.desc}</div></button>`).join('');if(localStorage.getItem('imperiumV2'))$('continueBtn').classList.remove('hide')}

function render(){if(!S)return;renderHeader();renderTabs();renderView();renderSide();renderLog();checkStory();autoSave()}
function renderHeader(){$('pname').textContent=S.name;$('rank').textContent=`${offices[S.office].name} • Level ${S.level} • ${origins[S.origin].name}`;bar('hp',S.hp,S.maxHp);bar('en',S.energy,S.maxEnergy);bar('xp',S.xp,S.xpNext);$('stats').innerHTML=['strength','endurance','charisma','rhetoric','strategy','learning'].map(x=>`<div class="stat"><span>${cap(x)}</span><b>${S[x]}</b></div>`).join('');$('resources').innerHTML=statRows([['Denarii',S.money.toLocaleString()],['Influence',S.influence],['Popularity',S.popularity],['Imperial Favor',S.favor],['Piety',S.piety],['Corruption',S.corruption],['Day',S.day],['Year A.U.C.',S.year]]);$('factions').innerHTML=Object.entries(S.factions).map(([k,v])=>`<div class="stat"><span>${factionData[k].icon} ${k}</span><b class="${v>=65?'good-text':v<20?'bad-text':''}">${v}</b></div>`).join('')}

function renderTabs(){const ts=['Capital','Senate','Provinces','Campaign','Estate','Research','People'];$('tabs').innerHTML=ts.map(t=>`<button class="tab ${t===currentTab?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')}

function viewCapital(){return `<h2>Nova Roma</h2><p class="small">Marble towers, electric chariots, crowded forums and two thousand years of accumulated intrigue.</p><div class="actions">${[
['Address the Forum','speech()'],['Study in the Archives','train(\'learning\')'],['Train with Praetorians','train(\'strength\')'],['Host a Salon','salon()'],['Investigate Corruption','investigate()'],['Patrol the Subura','fight()'],['Visit the Palace','palace()'],['Temple Consultation','temple()']].map(x=>`<button class="btn" onclick="${x[1]}">${x[0]}</button>`).join('')}</div><h3 style="margin-top:14px">World Condition</h3>${statRows([['Treasury',S.world.treasury],['Economy',S.world.economy],['Stability',S.world.stability],['Military',S.world.military]])}`}
function viewSenate(){let available=bills.filter(b=>!S.passed.includes(b.name));return `<h2>Imperial Senate</h2><p class="small">Coalitions shift daily. A bill needs influence, faction support and a persuasive floor strategy.</p><div class="cards">${available.slice(0,6).map((b,i)=>`<div class="card"><b>${b.name}</b><div class="small">${b.text}</div><div class="small">Cost ${b.cost} influence • Difficulty ${b.diff} • ${b.bloc}</div><button class="btn primary" style="width:100%;margin-top:8px" onclick="propose('${jsq(b.name)}')">Propose Bill</button></div>`).join('')||'<p>All major statutes have been considered.</p>'}</div><h3 style="margin-top:14px">Senate Maneuvers</h3><div class="actions"><button class="btn" onclick="lobby()">Lobby a Faction</button><button class="btn" onclick="whipVotes()">Whip Votes</button><button class="btn" onclick="exposeRival()">Expose a Rival</button><button class="btn" onclick="committee()">Committee Work</button></div>`}
function viewProvinces(){return `<h2>Provinces of the Empire</h2><div class="small">Travel costs 2 energy. Investment costs denarii but permanently affects the living simulation.</div><div>${provinces.map(n=>{let p=S.provinces[n];return `<div class="province-row"><span><b>${n}</b><br><small>${p.governor}</small></span><span>L ${p.loyalty}</span><span>U ${p.unrest}</span><span>E ${p.economy}</span><span>M ${p.military}</span><button class="btn" onclick="province('${n}')">Open</button></div>`}).join('')}</div>`}
function viewCampaign(){let days=S.electionDay-S.day;return `<h2>Political Campaign</h2><div class="chapter"><b>Next Election</b><div class="small">${days>0?days+' days remaining':'Election is due now.'}</div></div>${statRows([['National polling',campaignScore()+'%'],['Campaign scandal',S.scandal],['Elections won',S.electionsWon],['Current office',offices[S.office].name]])}<div class="actions" style="margin-top:12px"><button class="btn" onclick="campaignAction('rally')">Hold Rally</button><button class="btn" onclick="campaignAction('ads')">Run Media Campaign</button><button class="btn" onclick="campaignAction('debate')">Public Debate</button><button class="btn" onclick="campaignAction('donors')">Court Donors</button></div>`}
function viewEstate(){return `<h2>Family Estate</h2><p class="small">Businesses generate daily income, but recessions, theft and regulation create risk.</p><div>${S.businesses.length?S.businesses.map((b,i)=>`<div class="card"><b>${b.name}</b><div class="small">Income ${b.income}/day • Risk ${b.risk}%</div><button class="btn" onclick="sellBusiness(${i})">Sell</button></div>`).join(''):'<p class="small">Your household owns no major businesses.</p>'}</div><h3>Acquire Enterprise (${S.businesses.length}/${S.businessSlots})</h3><div class="cards">${businesses.map(b=>`<div class="card"><b>${b.name}</b><div class="small">Cost ${b.cost} • ${b.income}/day</div><button class="btn good" onclick="buyBusiness('${jsq(b.name)}')">Purchase</button></div>`).join('')}</div>`}
function viewResearch(){return `<h2>Research & Reform</h2><p class="small">Commission scholars and engineers. Research costs money and several days of political attention.</p><div class="cards">${techs.map(t=>`<div class="card"><b>${t[0]}</b><div class="small">Cost ${t[1]} denarii</div><button class="btn purple" ${S.research.includes(t[0])?'disabled':''} onclick="research('${jsq(t[0])}')">${S.research.includes(t[0])?'Completed':'Commission'}</button></div>`).join('')}</div>`}
function viewPeople(){return `<h2>People of Power</h2><h3>Companions</h3><div class="cards">${companions.map(c=>{let have=S.companions.find(x=>x.name===c.name);return `<div class="card"><b>${c.name}</b><div class="small">${c.role}<br>+${c.bonus} ${c.stat}</div><button class="btn" ${have?'disabled':''} onclick="recruit('${jsq(c.name)}')">${have?'Recruited':'Approach'}</button></div>`}).join('')}</div><h3>Notable Senators</h3><div class="cards">${S.senators.slice().sort((a,b)=>b.power-a.power).slice(0,10).map((n,i)=>`<div class="card senator"><span><b>${n.name}</b><br><small>${n.faction} • Power ${n.power}</small></span><button class="btn" onclick="senatorMeeting('${jsq(n.name)}')">Meet</button></div>`).join('')}</div>`}
function renderSide(){let q=story[Math.min(S.storyIndex,story.length-1)];$('campaign').innerHTML=`<div class="chapter"><b>Chapter ${q.chapter}: ${q.title}</b><div class="small">${q.goal}</div></div>${S.sideQuests.map(x=>`<div class="quest"><b>${x.title}</b><div class="small">${x.text}<br>Reward: ${x.reward} denarii</div></div>`).join('')}`;$('office').innerHTML=statRows([['Current',offices[S.office].name],['Next requirement',S.office<7?offices[S.office+1].req+' influence':'Maximum office'],['Election',Math.max(0,S.electionDay-S.day)+' days']]);$('household').innerHTML=`<div class="small">Businesses: ${S.businesses.length}/${S.businessSlots}<br>Companions: ${S.companions.length}<br>Visited provinces: ${S.visited.length}/15<br>Laws passed: ${S.billsPassed}<br>Enemies defeated: ${S.enemiesDefeated}</div><div style="margin-top:8px">${S.inventory.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`}
function renderLog(){$('log').innerHTML=S.log.slice().reverse().map(x=>`<div class="log-entry">${x}</div>`).join('')}
function addLog(x){S.log.push(`<span class="small">Day ${S.day}</span> — ${x}`);if(S.log.length>150)S.log.shift()}
function spend(e=1){if(S.energy<e){toast('Not enough energy.');return false}S.energy-=e;return true}function gainXP(n){S.xp+=n;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=Math.floor(S.xpNext*1.32);S.maxHp+=10;S.maxEnergy++;S.hp=S.maxHp;S.energy=S.maxEnergy;S.influence+=8;addLog(`<span class="good-text">Level ${S.level} reached.</span>`);modal(`<h2>Level ${S.level}</h2><p>Choose an attribute to increase.</p><div class="choices">${['strength','endurance','charisma','rhetoric','strategy','learning'].map(x=>`<button class="choice" onclick="raise('${x}')">${cap(x)}</button>`).join('')}</div>`)}}
function raise(x){S[x]++;closeModal();render()}function check(stat,diff){let bonus=S.companions.filter(c=>c.stat===stat).reduce((a,c)=>a+c.bonus,0);return roll(12)+S[stat]+bonus>=diff}
function speech(){if(!spend(2))return;let ok=check('rhetoric',11);S.popularity+=ok?8:-2;S.influence+=ok?6:1;gainXP(ok?25:10);addLog(ok?'Your Forum speech becomes the day’s defining broadcast.':'Hecklers and a faulty sound system blunt your speech.');render()}
function train(stat){if(!spend(2))return;let cost=80;if(S.money<cost)return toast('You need 80 denarii.');S.money-=cost;if(Math.random()<.55)S[stat]++;gainXP(18);addLog(`You spend the afternoon training ${stat}.`);render()}
function salon(){if(!spend(2)||S.money<180)return toast('Requires 2 energy and 180 denarii.');S.money-=180;S.influence+=10;Object.keys(S.factions).forEach(k=>S.factions[k]+=roll(3));addLog('A carefully seated dinner produces several useful alliances.');render()}
function investigate(){if(!spend(2))return;let ok=check('learning',12);if(ok){S.corruption=clamp(S.corruption-5,0,100);S.influence+=7;gainXP(28);addLog('You obtain verified contracts linking officials to shell companies.')}else{S.scandal+=2;addLog('Your inquiry leaks before the evidence is secure.')}render()}
function fight(){if(!spend(2))return;startCombat(pick(['Subura Enforcer','Corporate Saboteur','Extremist Cell','Rogue Praetorian']),75+S.level*15,8+S.level*2)}
function palace(){if(!spend(2))return;let ok=check('charisma',13);S.favor+=ok?9:-2;S.influence+=ok?5:0;addLog(ok?'The Emperor grants a private audience and remembers your proposal.':'You remain outside the inner chamber while rivals pass freely.');render()}
function temple(){if(!spend(1)||S.money<60)return toast('Requires 1 energy and 60 denarii.');S.money-=60;S.piety+=5;S.hp=clamp(S.hp+20,0,S.maxHp);addLog('The augurs offer ambiguous comfort and excellent intelligence.');render()}
function propose(name){let b=bills.find(x=>x.name===name);if(!b||S.influence<b.cost)return toast('Insufficient influence.');if(!spend(2))return;S.influence-=b.cost;let support=S.factions[b.bloc]/12+S.rhetoric+S.charisma/2+roll(12);let passed=support>=b.diff+8;if(passed){S.passed.push(b.name);S.billsPassed++;S.factions[b.bloc]=clamp(S.factions[b.bloc]+10,0,100);applyEffects(b.effects);S.influence+=10;gainXP(45+b.diff*2);addLog(`<span class="good-text">${b.name} passes the Senate.</span>`)}else{S.factions[b.bloc]=clamp(S.factions[b.bloc]-3,0,100);S.popularity-=2;addLog(`<span class="bad-text">${b.name} fails after a bitter division.</span>`)}render()}
function applyEffects(e){Object.entries(e).forEach(([k,v])=>{if(k==='treasury'||k==='economy'||k==='stability'||k==='military')S.world[k]+=v;else if(k==='provinceLoyalty')provinces.forEach(n=>S.provinces[n].loyalty=clamp(S.provinces[n].loyalty+v,0,100));else S[k]=(S[k]||0)+v})}
function lobby(){if(!spend(1)||S.money<100)return toast('Requires 1 energy and 100 denarii.');let keys=Object.keys(S.factions);modal(`<h2>Lobby a Faction</h2><div class="choices">${keys.map(k=>`<button class="choice" onclick="doLobby('${k}')">${factionData[k].icon} ${k}<br><small>${factionData[k].ideal}</small></button>`).join('')}</div>`)}function doLobby(k){S.money-=100;S.factions[k]=clamp(S.factions[k]+7+roll(5),0,100);S.influence+=3;closeModal();addLog(`${k} leaders accept your assurances.`);render()}
function whipVotes(){if(!spend(2))return;let ok=check('strategy',13);S.influence+=ok?12:2;S.scandal+=ok?0:2;addLog(ok?'You map favors and absences with ruthless precision.':'Several promised votes evaporate overnight.');render()}
function exposeRival(){if(!spend(2))return;let n=pick(S.senators);let ok=check('learning',14);if(ok){n.power=Math.max(2,n.power-8);S.influence+=9;S.corruption-=2;addLog(`Evidence forces ${n.name} from a committee chair.`)}else{S.scandal+=5;S.influence-=3;addLog(`${n.name} turns your accusation into a scandal against you.`)}render()}
function committee(){if(!spend(1))return;S.influence+=4+roll(4);gainXP(15);addLog('Unglamorous committee work gives you mastery of the next agenda.');render()}
function province(n){let p=S.provinces[n];modal(`<h2>${n}</h2><p>${provinceFlavors[n]}</p>${statRows([['Governor',p.governor],['Loyalty',p.loyalty],['Unrest',p.unrest],['Economy',p.economy],['Military',p.military]])}<div class="choices"><button class="choice" onclick="travelProvince('${n}')">Travel and Meet Governor</button><button class="choice" onclick="investProvince('${n}','economy')">Invest 250 in Economy</button><button class="choice" onclick="investProvince('${n}','loyalty')">Fund Civic Program</button><button class="choice" onclick="investProvince('${n}','military')">Inspect Defenses</button><button class="choice" onclick="closeModal()">Close</button></div>`)}
function travelProvince(n){if(!spend(2)){closeModal();return}if(!S.visited.includes(n))S.visited.push(n);let p=S.provinces[n],ok=check('charisma',12+p.unrest/15);if(ok){p.loyalty+=6;S.provinceSupport+=4;S.influence+=5;addLog(`Your tour of ${n} produces cheering crowds and a governor’s endorsement.`)}else{p.unrest+=4;addLog(`Protests dominate your difficult visit to ${n}.`)}closeModal();render()}
function investProvince(n,type){if(S.money<250)return toast('You need 250 denarii.');S.money-=250;let p=S.provinces[n];if(type==='economy')p.economy+=7;if(type==='loyalty'){p.loyalty+=6;p.unrest-=3}if(type==='military')p.military+=7;closeModal();addLog(`Your household finances a ${type} initiative in ${n}.`);render()}
function campaignScore(){return clamp(Math.round((S.popularity*.45+S.influence*.12+avgFaction()*.25+S.provinceSupport*.15-S.scandal*.8)),1,95)}
function campaignAction(type){let costs={rally:[2,120],ads:[1,300],debate:[2,80],donors:[1,0]}[type];if(!spend(costs[0])||S.money<costs[1])return toast('Insufficient energy or money.');S.money-=costs[1];if(type==='rally'){S.popularity+=5+roll(5);S.provinceSupport+=2}if(type==='ads'){S.popularity+=4+roll(6);S.scandal+=Math.random()<.2?2:0}if(type==='debate'){let ok=check('rhetoric',14);S.popularity+=ok?9:-4;S.influence+=ok?6:0}if(type==='donors'){S.money+=150+roll(300);S.scandal+=roll(3)}addLog(`Your campaign conducts a ${type} operation.`);render()}
function buyBusiness(name){let b=businesses.find(x=>x.name===name);if(S.businesses.length>=S.businessSlots)return toast('No available business slot.');if(S.money<b.cost)return toast('Insufficient denarii.');S.money-=b.cost;S.businesses.push({...b});addLog(`Your household acquires ${b.name}.`);render()}
function sellBusiness(i){let b=S.businesses.splice(i,1)[0];S.money+=Math.floor(b.cost*.62);addLog(`${b.name} is sold to a rival consortium.`);render()}
function research(name){let t=techs.find(x=>x[0]===name);if(S.money<t[1])return toast('Insufficient denarii.');if(!spend(2))return;S.money-=t[1];S.research.push(name);if(t[2]==='economy')S.world.economy+=8;else if(t[2]==='military')S.world.military+=8;else if(t[2]==='stability')S.world.stability+=8;else if(t[2]==='health')S.maxHp+=25;else if(t[2]==='loyalty')provinces.forEach(n=>S.provinces[n].loyalty+=4);else if(t[2]==='story')S.flags.engineFound=true;else S[t[2]]++;gainXP(60);addLog(`${name} enters imperial service.`);render()}
function recruit(name){let c=companions.find(x=>x.name===name);if(!spend(1))return;let cost=150+S.companions.length*100;if(S.money<cost)return toast(`Recruitment requires ${cost} denarii.`);let ok=check('charisma',11+S.companions.length);if(ok){S.money-=cost;S.companions.push({...c});addLog(`${c.name} joins your household as ${c.role}.`)}else addLog(`${c.name} politely refuses your offer.`);render()}
function senatorMeeting(name){let n=S.senators.find(x=>x.name===name);if(!spend(1))return;modal(`<h2>${n.name}</h2><p>${n.faction} senator. Power ${n.power}. Relationship ${n.relation}.</p><div class="choices"><button class="choice" onclick="dealSenator('${jsq(name)}','favor')">Offer a Political Favor</button><button class="choice" onclick="dealSenator('${jsq(name)}','gift')">Send a 120 Denarii Gift</button><button class="choice" onclick="dealSenator('${jsq(name)}','threat')">Apply Pressure</button><button class="choice" onclick="closeModal()">Leave</button></div>`)}
function dealSenator(name,type){let n=S.senators.find(x=>x.name===name);if(type==='favor'){n.relation+=8;S.influence-=2}if(type==='gift'){if(S.money<120)return toast('Insufficient denarii.');S.money-=120;n.relation+=n.greed>50?12:5}if(type==='threat'){let ok=check('strategy',14);n.relation+=ok?-3:-12;S.influence+=ok?7:-3;S.scandal+=ok?1:4}closeModal();render()}
function startCombat(name,hp,dmg){S.combat={name,hp,maxHp:hp,dmg,guard:0};combatModal()}
function combatModal(){let c=S.combat;if(!c)return;modal(`<h2>Street Conflict</h2><div class="combat-grid"><div><div class="portrait">🦅</div><b>${esc(S.name)}</b><div>HP ${S.hp}/${S.maxHp}</div></div><div><div class="portrait">⚔️</div><b>${c.name}</b><div>HP ${c.hp}/${c.maxHp}</div></div></div><div class="choices" style="margin-top:12px"><button class="choice" onclick="combat('strike')">Gladius Strike</button><button class="choice" onclick="combat('speech')">Commanding Rebuke</button><button class="choice" onclick="combat('guard')">Guard</button><button class="choice" onclick="combat('drone')">Call Security Drone (75)</button></div>`)}
function combat(a){let c=S.combat,damage=0;if(a==='strike')damage=roll(8)+S.strength*2;if(a==='speech')damage=roll(6)+S.rhetoric*2;if(a==='guard')c.guard=8+S.endurance;if(a==='drone'){if(S.money<75)return toast('Need 75 denarii.');S.money-=75;damage=18+S.strategy*2}c.hp-=damage;if(c.hp<=0){S.enemiesDefeated++;S.money+=90+roll(110);S.influence+=4;gainXP(45);addLog(`<span class="good-text">${c.name} is defeated.</span>`);S.combat=null;closeModal();render();return}let hit=Math.max(1,c.dmg+roll(7)-c.guard-S.endurance);c.guard=0;S.hp-=hit;if(S.hp<=0){S.hp=Math.ceil(S.maxHp*.35);S.money=Math.max(0,S.money-150);S.scandal+=3;addLog('You awaken under guard in a private clinic.');S.combat=null;closeModal();endDay();return}combatModal()}
function endDay(){if(!S)return;let income=S.businesses.reduce((a,b)=>a+b.income,0);S.money+=income;S.day++;if(S.day%365===0)S.year++;S.energy=S.maxEnergy;S.hp=clamp(S.hp+15+S.endurance,0,S.maxHp);simulateWorld();if(S.day>=S.electionDay)runElection();if(S.day%7===0)weeklyEvent();if(S.day%10===0)generateSideQuests();checkOffice();addLog(`The day closes. Household income: ${income} denarii.`);render()}
function simulateWorld(){provinces.forEach(n=>{let p=S.provinces[n];p.economy=clamp(p.economy+roll(5)-3+Math.sign(S.world.economy-50),0,100);p.unrest=clamp(p.unrest+roll(5)-3+(p.loyalty<35?2:0),0,100);p.loyalty=clamp(p.loyalty+roll(3)-2-(p.unrest>60?2:0),0,100)});S.world.economy=clamp(S.world.economy+roll(5)-3,0,100);S.world.stability=clamp(S.world.stability+roll(5)-3-(avgProvince('unrest')>45?2:0),0,100);S.corruption=clamp(S.corruption+(Math.random()<.45?1:0)-(S.research.includes('Political Analytics')?1:0),0,100);S.senators.forEach(n=>{n.relation=clamp(n.relation+roll(3)-2,-50,100);if(Math.random()<.03)n.power=clamp(n.power+roll(7)-3,1,60)})}
function weeklyEvent(){let events=[
['A grain shortage strikes Aegyptus.',()=>{S.provinces.Aegyptus.unrest+=10;S.popularity-=3}],['A technology boom lifts provincial markets.',()=>{S.world.economy+=6;provinces.forEach(n=>S.provinces[n].economy+=2)}],['A Praetorian scandal reaches the news networks.',()=>{S.favor-=4;S.corruption+=3}],['Flooding damages the lower districts of Rome.',()=>{S.world.treasury-=80;S.popularity-=2}],['A successful frontier operation restores confidence.',()=>{S.world.military+=5;S.favor+=4}],['A constitutional protest fills the Forum.',()=>{S.world.stability-=5;S.popularity+=2}],['A foreign cyberattack disrupts the imperial grid.',()=>{S.world.stability-=6;S.money=Math.max(0,S.money-100)}],['An archaeological signal is detected beneath Vaticanus.',()=>{S.flags.engineRumor=true;S.learning+=1}]];let e=pick(events);e[1]();addLog(`<span class="gold">Imperial Event:</span> ${e[0]}`);if(S.world.stability<30&&!S.flags.civilCrisis){S.flags.civilCrisis=true;addLog('<span class="bad-text">The Empire enters a civil crisis.</span>')}}
function runElection(){let score=campaignScore(),win=roll(100)<=score;if(win){S.electionsWon++;S.influence+=40;S.popularity+=8;S.scandal=Math.max(0,S.scandal-4);addLog(`<span class="good-text">You win the election with ${score}% projected support.</span>`)}else{S.popularity-=5;S.influence-=8;addLog(`<span class="bad-text">You lose the election despite ${score}% projected support.</span>`)}S.electionDay=S.day+40+roll(20)}
function checkOffice(){if(S.office<7&&S.influence>=offices[S.office+1].req&&(S.office<3||S.electionsWon>=1)){S.office++;S.businessSlots++;S.maxEnergy++;S.favor+=8;addLog(`<span class="gold">You rise to the office of ${offices[S.office].name}.</span>`)}}
function checkStory(){if(!S||S.flags.victory)return;let q=story[S.storyIndex];if(q&&q.check(S)){q.reward(S);S.storyIndex++;addLog(`<span class="good-text">Chapter completed: ${q.title}.</span>`);if(S.storyIndex>=story.length){S.flags.victory=true;ending()}else toast('New story chapter unlocked')}}
function ending(){modal(`<h2>ROME WITHOUT END</h2><p>After ${S.day} days, ${esc(S.name)} has reshaped the Eternal Empire. Provinces, armies, markets and citizens now carry the consequences of every bargain.</p><p>Your final office: <b>${offices[S.office].name}</b>. Laws passed: ${S.billsPassed}. Elections won: ${S.electionsWon}.</p><button class="choice" onclick="closeModal()">Continue the Dynasty</button>`)}
function generateSideQuests(){const list=[['Bread and Bandwidth','Raise popularity by campaigning in the Forum.'],['A Governor’s Request','Visit and stabilize a province with high unrest.'],['The Missing Ledger','Investigate corruption in Nova Roma.'],['Industrial Patronage','Acquire or expand a business.'],['The Veteran’s Petition','Improve Imperialist faction support.'],['The Scholar’s Cipher','Complete a research project.']];S.sideQuests=Array.from({length:3},()=>{let q=pick(list);return{title:q[0],text:q[1],reward:120+roll(260)}})}
function avgProvince(k){return provinces.reduce((a,n)=>a+S.provinces[n][k],0)/provinces.length}function avgFaction(){return Object.values(S.factions).reduce((a,b)=>a+b,0)/6}
function showSystem(){modal(`<h2>System</h2><div class="choices"><button class="choice" onclick="saveGame();closeModal()">Save Game</button><button class="choice" onclick="loadGame()">Load Saved Game</button><button class="choice" onclick="exportSave()">Export Save Text</button><button class="choice" onclick="resetGame()">Start New Dynasty</button><button class="choice" onclick="closeModal()">Close</button></div>`)}
function saveGame(){localStorage.setItem('imperiumV2',JSON.stringify(S));toast('Game saved.')}function autoSave(){if(S)localStorage.setItem('imperiumV2',JSON.stringify(S))}function loadGame(){try{let x=JSON.parse(localStorage.getItem('imperiumV2'));if(!x)throw 0;S=x;$('creation').classList.remove('active');$('game').classList.add('active');closeModal();render();toast('Save loaded.')}catch(e){toast('No valid save found.')}}function resetGame(){if(confirm('Erase this dynasty and begin again?')){localStorage.removeItem('imperiumV2');location.reload()}}function exportSave(){let text=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal(`<h2>Export Save</h2><p class="small">Copy and store this text.</p><textarea style="width:100%;height:180px">${text}</textarea><button class="choice" onclick="closeModal()">Close</button>`)}
function modal(x){$('modalCard').innerHTML=x;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function toast(x){let t=$('toast');t.textContent=x;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}function jsq(x){return x.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
$('startBtn').addEventListener('click',start);$('continueBtn').addEventListener('click',loadGame);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});initOrigins();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).then(reg=>{if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready. Reopen the app to apply it.');});});}).catch(err=>console.warn('Service worker registration failed:',err)));}
</script>
<style>
.v253-banner{border:1px solid #8e714e;background:#1b2418;border-radius:10px;padding:9px 11px;margin-bottom:10px}.progress-ring{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:3px solid var(--gold);font-weight:bold}.risk-low{color:#9bd18f}.risk-med{color:#e0b867}.risk-high{color:#e99484}.mission{border-left:4px solid #416b8b}.achievement.locked{opacity:.5;filter:grayscale(1)}.decision{border-color:#a27d4e;background:#2a2116}.formation{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini-stat{text-align:center;background:#120d0a;border:1px solid var(--line);border-radius:9px;padding:8px}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 16px #e0b86755}}@media(max-width:520px){.mini-grid{grid-template-columns:1fr 1fr}.formation{grid-template-columns:1fr}.formation .btn{width:100%}}
</style>
<script>

let cx=w*.5,base=h*.78;x.fillStyle='#d4b58d';x.fillRect(cx-w*.14,base-84,w*.28,84);for(let i=0;i<7;i++){let px=cx-w*.125+i*w*.041;x.fillRect(px,base-115,8,115)}x.beginPath();x.moveTo(cx-w*.17,base-115);x.lineTo(cx,base-155);x.lineTo(cx+w*.17,base-115);x.closePath();x.fillStyle='#c99f6c';x.fill();x.strokeStyle='#6e4935';x.stroke();x.fillStyle='#9c3936';x.fillRect(cx-5,base-146,10,28);x.fillStyle='#d8b35f';x.beginPath();x.arc(cx,base-150,7,0,7);x.fill();
for(let i=0;i<9;i++){let yy=base+i*12;x.strokeStyle=`rgba(232,190,105,${.25-i*.02})`;x.beginPath();x.moveTo(cx-w*.48,yy);x.lineTo(cx+w*.48,yy);x.stroke()} }
function map(){let x=C.ctx,w=C.w,h=C.h;x.fillStyle='#152e31';x.fillRect(0,h*.52,w,h*.48);x.strokeStyle='#ccad6d';x.lineWidth=2;x.beginPath();for(let i=0;i<120;i++){let a=i/119*Math.PI*2,r=(Math.sin(i*1.7)*.09+.32)*Math.min(w,h),px=w*.5+Math.cos(a)*r*1.6,py=h*.58+Math.sin(a)*r*.65;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle='#655b3d';x.fill();x.stroke();let names=['Italia','Gallia','Britannia','Germania','Aegyptus','Syria','Africa','Scythia'];names.forEach((n,i)=>{let a=i/names.length*Math.PI*2-.5,px=w*.5+Math.cos(a)*w*.29,py=h*.58+Math.sin(a)*h*.2;x.fillStyle='#e8c56f';x.beginPath();x.arc(px,py,3+Math.sin(C.t*.004+i)*1.5,0,7);x.fill();x.font='10px Georgia';x.fillText(n,px+6,py+3)})}
function estate(){let x=C.ctx,w=C.w,h=C.h;x.fillStyle='#13171a';x.fillRect(0,h*.58,w,h*.42);x.fillStyle='#b9986b';x.fillRect(w*.25,h*.3,w*.5,h*.45);for(let i=0;i<8;i++)x.fillRect(w*.28+i*w*.06,h*.25,9,h*.5);x.fillStyle='#7f2929';x.fillRect(w*.46,h*.57,w*.08,h*.18);x.strokeStyle='#dfb960';for(let i=0;i<10;i++){x.beginPath();x.moveTo(0,h*.78+i*4);x.lineTo(w,h*.72+i*5);x.stroke()}}
function senate(){city();let x=C.ctx,w=C.w,h=C.h;x.fillStyle='#09090dbb';x.fillRect(0,h*.52,w,h*.48);for(let r=0;r<4;r++)for(let i=0;i<10+r*3;i++){let px=w*.5+(i-(9+r*3)/2)*(30-r*2),py=h*.61+r*24;x.fillStyle=(i+r)%5===0?'#9b4138':'#d2b690';x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillRect(px-7,py+6,14,13)}x.fillStyle='#d9b55f';x.fillRect(w*.46,h*.54,w*.08,7)}
function rain(){if(C.scene!=='Provinces'&&C.scene!=='Campaign')return;let x=C.ctx;x.strokeStyle='#b5d6e566';C.rain.forEach(r=>{r.y+=r.v;if(r.y>1){r.y=0;r.x=Math.random()}x.beginPath();x.moveTo(r.x*C.w,r.y*C.h);x.lineTo(r.x*C.w-5,r.y*C.h+12);x.stroke()})}
function particles(){let x=C.ctx;C.sparks=C.sparks.filter(p=>p.l>0);C.sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.025;x.globalAlpha=p.l;x.fillStyle='#efc86f';x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1}
function draw(){C.t=performance.now();sky();if(C.scene==='Provinces')map();else if(C.scene==='Senate'||C.scene==='People')senate();else if(C.scene==='Estate')estate();else city();rain();particles();C.raf=requestAnimationFrame(draw)}
window.setGraphicScene=function(n){C.scene=n;let d=SCENES[n]||SCENES.Capital;document.getElementById('sceneTitle').textContent=d[0];document.getElementById('sceneSub').textContent=d[1]};
window.drawPortrait=function(canvas,seed,faction){if(!canvas)return;let x=canvas.getContext('2d'),w=canvas.width,h=canvas.height;let hash=0;for(let c of seed)hash=(hash*31+c.charCodeAt(0))|0;let rnd=n=>Math.abs(Math.sin(hash+n)*10000)%1;x.clearRect(0,0,w,h);let bg=['#4d2930','#263e48','#4a4029','#24392d','#3e2e50'][Math.floor(rnd(1)*5)];x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle='#d8b188';x.beginPath();x.arc(w/2,h*.43,w*.23,0,7);x.fill();x.fillStyle=rnd(2)>.5?'#2b211c':'#d4c0a2';x.beginPath();x.arc(w/2,h*.29,w*.24,Math.PI,0);x.fill();x.fillStyle='#201714';x.fillRect(w*.39,h*.42,3,3);x.fillRect(w*.58,h*.42,3,3);x.strokeStyle='#7b4334';x.beginPath();x.moveTo(w*.43,h*.55);x.quadraticCurveTo(w*.5,h*(.59+rnd(3)*.05),w*.57,h*.55);x.stroke();x.fillStyle=faction==='Imperialists'?'#6f2224':faction==='Technocrats'?'#294f68':'#e8dfcf';x.beginPath();x.moveTo(w*.18,h);x.lineTo(w*.32,h*.67);x.lineTo(w*.68,h*.67);x.lineTo(w*.82,h);x.fill();x.strokeStyle='#e0b867';x.lineWidth=2;x.beginPath();x.arc(w/2,h*.2,w*.25,Math.PI*1.05,Math.PI*1.95);x.stroke()};
const oldTab=window.tab;window.tab=function(t){setGraphicScene(t);oldTab(t)};
const oldRenderView=window.renderView;window.renderView=function(){oldRenderView();enhanceGraphics()};
window.enhanceGraphics=function(){document.querySelectorAll('.senator').forEach((el,i)=>{if(el.querySelector('canvas'))return;let b=el.querySelector('b'),sm=el.querySelector('small');if(!b)return;let cv=document.createElement('canvas');cv.width=cv.height=96;cv.className='gfx-avatar';el.querySelector('span').prepend(cv);drawPortrait(cv,b.textContent,sm?sm.textContent:'')});document.querySelectorAll('.province-row').forEach(el=>{let m=(el.textContent.match(/L\s*(\d+)/)||[])[1]||50;el.style.setProperty('--loyalty',m+'%')});};
const oldStartCombat=window.startCombat;if(oldStartCombat)window.startCombat=function(){oldStartCombat.apply(this,arguments);setTimeout(()=>{let card=document.getElementById('modalCard');if(card&&!card.querySelector('.combat-canvas')){let cv=document.createElement('canvas');cv.width=700;cv.height=220;cv.className='combat-canvas';card.prepend(cv);animateCombat(cv)}},0)};
function animateCombat(cv){let x=cv.getContext('2d'),t=0;function f(){t+=.04;x.clearRect(0,0,cv.width,cv.height);let g=x.createLinearGradient(0,0,0,220);g.addColorStop(0,'#15223a');g.addColorStop(1,'#351a18');x.fillStyle=g;x.fillRect(0,0,700,220);x.strokeStyle='#87633e';for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,160+i*8);x.lineTo(700,160+i*8);x.stroke()}fighter(155,130,1,'#ddd2b9');fighter(545,130,-1,'#8f3936');let px=350+Math.sin(t*3)*150;x.fillStyle='#e8c15d';x.beginPath();x.arc(px,100+Math.sin(t*6)*12,5,0,7);x.fill();if(document.body.contains(cv))requestAnimationFrame(f)}function fighter(px,py,d,col){x.fillStyle=col;x.beginPath();x.arc(px,py-48,18,0,7);x.fill();x.fillRect(px-16,py-30,32,50);x.strokeStyle='#d8b45e';x.lineWidth=5;x.beginPath();x.moveTo(px+d*12,py-15);x.lineTo(px+d*60,py-45+Math.sin(t*4)*8);x.stroke();x.fillStyle='#6a2425';x.fillRect(px-24,py+18,18,40);x.fillRect(px+6,py+18,18,40)}f()}
const oldToast=window.toast;window.toast=function(msg){oldToast(msg);let e=document.createElement('div');e.className='fx-float';e.textContent=msg;e.style.left=(20+Math.random()*60)+'vw';e.style.top=(40+Math.random()*20)+'vh';e.style.color=/fail|not|lost|defeat/i.test(msg)?'#ef8c7b':'#edca78';document.body.appendChild(e);setTimeout(()=>e.remove(),950)};
addEventListener('DOMContentLoaded',init);if(document.readyState!=='loading')init();
})();
