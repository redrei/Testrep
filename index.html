<script id="v43-script">
(()=>{
'use strict';
const TABS=[
 ['Capital','🏛','Capital'],['Senate','🗳️','Senate'],['Imperial Council','👑','Council'],['Provinces','🗺️','Map'],['Campaign','📣','Campaign'],['War Room','⚔️','War'],['Diplomacy','🤝','Diplomacy'],['Estate','🏡','Estate'],['Research','⚙️','Research'],['People','👥','People'],['Chronicle','📜','Chronicle']
];
const PICON={Italia:'★',Gallia:'✦',Hispania:'☀',Britannia:'☁',Germania:'⚒',Dacia:'⛰',Graecia:'Ω',Aegyptus:'△',Syria:'✹',Arabia:'✧',Armenia:'⬟',Mesopotamia:'≈',Africa:'◆',Mauretania:'◈',Scythia:'❄'};
const PMETA={Italia:{c:[420,250],capital:'Nova Roma',color:'#8d7043'},Gallia:{c:[310,190],capital:'Lugdunum',color:'#526d51'},Hispania:{c:[190,265],capital:'Tarraco',color:'#796249'},Britannia:{c:[275,102],capital:'Londinium',color:'#4f6472'},Germania:{c:[410,135],capital:'Colonia',color:'#586552'},Dacia:{c:[535,185],capital:'Ulpia Traiana',color:'#725b49'},Graecia:{c:[515,280],capital:'Athenae',color:'#605b78'},Aegyptus:{c:[610,405],capital:'Alexandria',color:'#9a7f46'},Syria:{c:[700,310],capital:'Antiochia',color:'#74524c'},Arabia:{c:[735,405],capital:'Petra',color:'#766948'},Armenia:{c:[735,225],capital:'Artaxata',color:'#665275'},Mesopotamia:{c:[790,310],capital:'Ctesiphon',color:'#7a6849'},Africa:{c:[390,395],capital:'Carthago',color:'#7a5b42'},Mauretania:{c:[220,390],capital:'Caesarea',color:'#5c704f'},Scythia:{c:[650,105],capital:'Tanais',color:'#4c6670'}};
const PATHS={Britannia:'M235 65 L270 52 L303 72 L302 105 L282 135 L249 128 L231 99 Z',Hispania:'M118 235 L151 207 L218 207 L257 234 L246 291 L208 322 L145 310 L111 274 Z',Gallia:'M240 153 L293 128 L362 147 L387 189 L352 235 L294 242 L250 211 Z',Germania:'M360 103 L419 84 L477 112 L490 167 L452 199 L386 184 L365 145 Z',Italia:'M390 210 L425 201 L444 226 L439 262 L468 298 L455 325 L431 303 L420 271 L398 251 Z M461 324 L480 330 L469 347 L451 339 Z',Dacia:'M485 152 L540 141 L590 170 L579 215 L535 232 L493 202 Z',Graecia:'M477 239 L520 226 L555 249 L548 285 L574 308 L552 332 L519 301 L493 288 Z',Scythia:'M475 66 L573 42 L705 55 L776 91 L762 146 L675 154 L596 133 L514 142 Z',Armenia:'M681 182 L731 164 L774 193 L759 238 L710 249 L674 218 Z',Syria:'M664 260 L709 247 L745 270 L735 329 L704 354 L672 324 Z',Mesopotamia:'M747 250 L797 238 L830 275 L817 342 L777 371 L738 329 Z',Arabia:'M681 337 L735 324 L799 360 L785 433 L741 482 L688 451 L663 392 Z',Aegyptus:'M567 344 L630 337 L674 363 L659 432 L622 466 L571 431 Z',Africa:'M300 347 L382 330 L467 342 L541 370 L518 424 L432 445 L346 432 L292 397 Z',Mauretania:'M122 340 L210 327 L300 347 L292 397 L218 428 L139 411 L102 374 Z'};
const V43={selected:'Italia',compact:false,route:true};
function ensureState(){if(typeof S==='undefined'||!S)return;S.v41=S.v41||{mapVisits:0,cityInfluence:{},routes:[],intel:{},lastProvince:'Italia'};Object.keys(PMETA).forEach(n=>{if(S.v41.cityInfluence[n]==null)S.v41.cityInfluence[n]=0;if(!S.v41.intel[n])S.v41.intel[n]={surveyed:false,rumor:pick(['A governor is quietly building a private coalition.','Merchants complain about military requisitions.','Local councils seek greater representation.','A construction boom is hiding substantial debt.','Veterans are organizing around a charismatic tribune.'])}});if(S.v41.lastProvince&&PMETA[S.v41.lastProvince])V43.selected=S.v41.lastProvince;}
 function tabMarkup(){let hasCouncil=(typeof ensure4==='function');return TABS.filter(t=>hasCouncil||t[0]!=='Imperial Council').map(([key,ico,label])=>`<button class="v43-tab ${currentTab===key?'active':''}" onclick="tab('${key}')"><span class="ico">${ico}</span><span class="lbl">${label}</span>${currentTab===key?'<span class="dot"></span>':''}</button>`).join('')}
 function ring(label,val,color,ico){let c=2*Math.PI*20,off=c-c*val/100;return `<div class="v43-ring"><svg viewBox="0 0 54 54" aria-hidden="true"><circle class="bg" cx="27" cy="27" r="20"></circle><circle class="fg" cx="27" cy="27" r="20" style="stroke:${color};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${off.toFixed(2)}"></circle><text x="27" y="31" text-anchor="middle" font-size="13" fill="#f6ebcb">${ico}</text></svg><div class="meta"><span>${label}</span><b>${Math.round(val)}</b><i>${val>=70?'High':val>=40?'Stable':'Low'}</i></div></div>`}
 function strategicRead(p){return p.unrest>60?'Instability risk':p.loyalty<35?'Governor doubtful':p.economy>70?'Revenue opportunity':p.military>70?'Fortified stronghold':'Manageable conditions'}
 function mapSVG(){let labels=Object.entries(PMETA).map(([n,m])=>`<text class="label" x="${m.c[0]}" y="${m.c[1]-9}" text-anchor="middle">${n}</text><circle class="city-ring" cx="${m.c[0]}" cy="${m.c[1]}" r="3"></circle><circle class="city" data-city="${n}" cx="${m.c[0]}" cy="${m.c[1]}" r="3.8"></circle>${n==='Italia'?`<path class="capital-star" d="M${m.c[0]} ${m.c[1]-8} l2 4 4 .4 -3 2.7 1 4.4 -4-2.2 -4 2.2 1-4.4 -3-2.7 4-.4z"/>`:''}`).join('');
 let provinces=Object.entries(PATHS).map(([n,d])=>`<path class="province ${V43.selected===n?'active':''}" data-province="${n}" tabindex="0" aria-label="${n}" d="${d}" fill="${PMETA[n].color}"/>`).join('');
 let route=''; if(V43.route&&V43.selected!=='Italia'){let a=PMETA.Italia.c,b=PMETA[V43.selected].c,mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-35;route=`<path class="route" d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}"/>`}
 return `<svg class="v43-map ${V43.compact?'compact':''}" viewBox="70 25 790 470" role="img" aria-label="Graphical map of the Roman Empire"><defs><linearGradient id="v43Sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#143c58"/><stop offset="100%" stop-color="#071822"/></linearGradient></defs><rect class="sea" x="70" y="25" width="790" height="470" rx="18"/><path class="landmass" d="M82 35H850V190L818 181L778 155L742 162L710 155L675 168L629 156L590 166L548 146L502 151L476 194L451 202L425 190L394 196L367 188L344 205L315 196L285 210L255 197L225 203L197 195L167 210L133 200L95 215Z"/><path class="landmass" d="M80 315L125 322L183 312L248 321L308 326L370 317L433 326L499 330L558 338L622 329L684 335L743 323L811 339L850 355V495H70V341Z"/><path class="coast" d="M87 218Q170 188 244 207T385 195T502 181T631 163T760 170T844 195 M80 316Q166 304 250 318T420 320T595 329T760 317T850 343"/>${provinces}<text class="sea-label" x="438" y="358">MARE INTERNUM</text><text class="sea-label" x="160" y="168">ATLANTICUS</text><text class="sea-label" x="680" y="282">AEGAEUM</text><path class="road" d="M420 250 Q352 210 310 190 Q236 230 190 265 M420 250 Q468 239 515 280 Q607 285 700 310 M420 250 Q385 330 390 395 M515 280 Q575 207 650 105 M610 405 Q667 357 700 310"/>${route}<path class="front" d="M447 112 Q475 135 492 165"/><path class="front" d="M615 123 Q668 139 710 145"/>${labels}<g class="fleet" transform="translate(484 365)"><path d="M0 0l18 0-5 6H4z" fill="currentColor"/><path d="M9-14v14M9-13l8 7H9" stroke="currentColor" fill="none"/></g><g class="compass" transform="translate(812 72)"><circle cx="0" cy="0" r="22"/><path d="M0 -18 L4 0 L0 18 L-4 0 Z" fill="#d5b76a"/><path d="M-18 0 L0 -4 L18 0 L0 4 Z" fill="#d5b76a"/><text x="0" y="-28" text-anchor="middle">N</text></g></svg>`}
 function chipBar(){return `<div class="v43-map-strip">${Object.keys(PMETA).map(n=>`<button class="v43-pick ${V43.selected===n?'active':''}" data-pick="${n}"><i>${PICON[n]||'•'}</i><span>${n}</span></button>`).join('')}</div>`}
 function provincePanel(n){let p=S.provinces[n],m=PMETA[n],intel=S.v41.intel[n];return `<div class="v43-side-card"><div class="v43-province-top"><div style="display:flex;align-items:center;gap:10px"><div class="v43-herald">${PICON[n]||'•'}</div><div><h3 style="margin:0">${n}</h3><div class="small">${m.capital} • ${p.governor}</div></div></div><span class="v43-mini-badge">✦ influence ${S.v41.cityInfluence[n]}</span></div><div class="v43-rings">${ring('Loyalty',p.loyalty,'#6dd3c6','❤')}${ring('Unrest',p.unrest,'#e46c5d','⚠')}${ring('Economy',p.economy,'#e8c56f','¤')}${ring('Military',p.military,'#8db8ff','⚔')}</div><div class="v43-situation"><div class="tagline"><span>${provinceFlavors[n]}</span><span>${strategicRead(p)}</span>${intel.surveyed?'<span>Intel ready</span>':'<span>Intel missing</span>'}</div><div class="small">${intel.surveyed?intel.rumor:'Send agents or visit the province to unlock a full report.'}</div></div><div class="v43-actions"><button class="v43-act primary" data-mapact="travel"><span>🧭</span><b>Travel</b><small>Visit capital</small></button><button class="v43-act" data-mapact="civic"><span>🏛️</span><b>Civic</b><small>Boost loyalty</small></button><button class="v43-act" data-mapact="economy"><span>💰</span><b>Invest</b><small>Grow revenue</small></button><button class="v43-act" data-mapact="military"><span>🛡️</span><b>Fortify</b><small>Raise defense</small></button><button class="v43-act" data-mapact="survey"><span>🕵️</span><b>Intel</b><small>Survey province</small></button><button class="v43-act" data-mapact="rally"><span>📣</span><b>Rally</b><small>Address people</small></button></div><div class="v43-callout"><b>Strategic note:</b> ${p.unrest>60?'Commit attention here quickly before unrest cascades into wider instability.':p.loyalty<35?'This province may become politically unreliable unless you rebuild trust.':p.economy>70?'A strong tax base makes this an ideal target for economic expansion.':p.military>70?'Military capacity here can support frontier operations and command reshuffles.':'This region is stable enough for selective investment and political cultivation.'}</div></div>`}
 function provinceView(){ensureState();return `${hero4('Imperial Interface','Graphical Provincial Command','Select a territory on the map or the province strip, then issue orders from the visual control panel.')}<div class="v43-view"><div class="v43-map-card"><div class="v43-map-head"><div><b>Empire Atlas</b><div class="small">Live roads, fronts, capitals and travel route</div></div><div class="v43-toggle"><button class="${!V43.compact?'active':''}" data-tool="labels" title="Toggle labels">⌘</button><button class="${V43.route?'active':''}" data-tool="route" title="Toggle route">➜</button></div></div><div class="v43-map-wrap">${mapSVG()}</div><div class="v43-legend"><span><i style="background:#d4bd7a"></i>province</span><span><i style="background:#ef6658"></i>front</span><span><i style="background:#77efff"></i>route</span><span><i style="background:#ffe294"></i>capital</span></div>${chipBar()}</div>${provincePanel(V43.selected)}</div>`}
 function selectProvince(n){V43.selected=n;S.v41.lastProvince=n;render()}
 function spendMapEnergy(e){if(typeof spend==='function')return spend(e);return true}
 window.v43MapAction=function(action){ensureState();let n=V43.selected,p=S.provinces[n],intel=S.v41.intel[n];if(action==='travel'){travelProvince(n);S.v41.mapVisits++;S.v41.cityInfluence[n]+=3;toast(`Travel route plotted to ${PMETA[n].capital}.`);return}
 if(action==='survey'){if(!spendMapEnergy(1))return;intel.surveyed=true;S.influence+=2;S.v41.cityInfluence[n]+=1;addLog(`Agents complete a political survey of ${n}.`)}
 else if(action==='rally'){if(!spendMapEnergy(2))return;let ok=check('rhetoric',10+Math.round(p.unrest/15));p.loyalty+=ok?5:-1;p.unrest+=ok?-3:2;S.popularity+=ok?3:-1;S.v41.cityInfluence[n]+=ok?4:0;addLog(`${ok?'A packed':'A difficult'} address in ${PMETA[n].capital}.`)}
 else if(action==='civic'){investProvince(n,'loyalty');return}
 else if(action==='economy'){investProvince(n,'economy');return}
 else if(action==='military'){investProvince(n,'military');return}
 ['loyalty','unrest','economy','military'].forEach(k=>p[k]=clamp(p[k],0,100));render()}
 function bindProvinceUI(){document.querySelectorAll('[data-province]').forEach(el=>{el.addEventListener('click',()=>selectProvince(el.dataset.province));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectProvince(el.dataset.province)}})});document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();selectProvince(el.dataset.city)}));document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>selectProvince(el.dataset.pick)));document.querySelectorAll('[data-mapact]').forEach(el=>el.addEventListener('click',()=>v43MapAction(el.dataset.mapact)));document.querySelectorAll('[data-tool]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.tool==='labels')V43.compact=!V43.compact;else if(el.dataset.tool==='route')V43.route=!V43.route;render()}));enhanceActionButtons()}
 function enhanceActionButtons(){const map=[['Address','📣'],['Study','📚'],['Train','⚔️'],['Host','🍷'],['Investigate','🕵️'],['Patrol','🛡️'],['Visit','👑'],['Temple','🏺'],['Lobby','🤝'],['Whip','🗳️'],['Expose','🗡️'],['Committee','📜'],['Campaign','📣'],['Debate','🎤'],['Fundraise','💰'],['Travel','🧭'],['Invest','💰'],['Fund','🏛️'],['Inspect','🛡️'],['Summit','🤝'],['Trade','⚖️'],['Intelligence','🕵️'],['Recon','👁️'],['Supply','📦'],['Operation','⚔️'],['Commerce','⚖️'],['Defense','🛡️'],['Science','⚙️'],['Private','👂'],['Enact','📜'],['Build','🤝'],['Rotate','🔄'],['Fortify','🧱'],['Grand','⚔️']];document.querySelectorAll('#view .actions .btn, #view .choices .choice, #view .cards .btn, #view .card .btn').forEach(btn=>{if(btn.classList.contains('v43-icon-btn'))return;let txt=(btn.textContent||'').trim();let hit=map.find(([k])=>txt.startsWith(k)||txt.includes(k));if(hit){btn.dataset.emoji=hit[1];btn.classList.add('v43-icon-btn')}})}
 const prevTabs=window.renderTabs;window.renderTabs=function(){if(typeof S!=='undefined'&&S)ensureState();$('tabs').classList.add('v43-dock');$('tabs').innerHTML=tabMarkup()};
 const prevView=window.renderView;window.renderView=function(){if(currentTab==='Provinces'){$('view').innerHTML=provinceView();requestAnimationFrame(bindProvinceUI)}else{prevView();requestAnimationFrame(enhanceActionButtons)}};
 function bootV43(){document.title='Imperium Aeternum IV — Graphical Command';let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.3 — Visual Menus & Clearer Atlas';if(typeof S!=='undefined'&&S)requestAnimationFrame(enhanceActionButtons)}
 addEventListener('DOMContentLoaded',bootV43);if(document.readyState!=='loading')setTimeout(bootV43,0);
})();
</script>

function ring(label,val,color,ico){let c=2*Math.PI*20,off=c-c*val/100;return `<div class="v44-ring"><svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="20"></circle><circle class="fg" cx="29" cy="29" r="20" style="stroke:${color};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${off.toFixed(2)}"></circle><text x="29" y="34" text-anchor="middle" font-size="13" fill="#f6ebcb">${ico}</text></svg><div class="meta"><span>${label}</span><b>${Math.round(val)}</b><i>${val>=70?'High':val>=40?'Stable':'Low'}</i></div></div>`}
function strategicRead(p){return p.unrest>60?'Instability risk':p.loyalty<35?'Governor doubtful':p.economy>70?'Revenue opportunity':p.military>70?'Fortified stronghold':'Manageable conditions'}
function provincePanel(n){let p=S.provinces[n],m=PMETA[n],intel=S.v41.intel[n];return `<div class="v44-side-panel"><div class="v44-province-top"><div style="display:flex;align-items:center;gap:10px"><div class="v44-herald">${PICON[n]||'•'}</div><div class="v44-title-block"><h3>${n}</h3><div class="small">${m.capital} • ${p.governor}</div></div></div><span class="v44-mini">✦ influence ${S.v41.cityInfluence[n]}</span></div><div class="v44-rings">${ring('Loyalty',p.loyalty,'#6dd3c6','❤')}${ring('Unrest',p.unrest,'#e46c5d','⚠')}${ring('Economy',p.economy,'#e8c56f','¤')}${ring('Military',p.military,'#8db8ff','⚔')}</div><div class="v44-situation"><div class="tags"><span>${provinceFlavors[n]}</span><span>${strategicRead(p)}</span>${intel.surveyed?'<span>Intel ready</span>':'<span>Intel missing</span>'}</div><div class="small">${intel.surveyed?intel.rumor:'Send agents or travel to unlock a full provincial report.'}</div></div><div class="v44-actions"><button class="v44-act primary" data-mapact="travel"><span>🧭</span><b>Travel</b><small>Visit capital</small></button><button class="v44-act" data-mapact="civic"><span>🏛️</span><b>Civic</b><small>Boost loyalty</small></button><button class="v44-act" data-mapact="economy"><span>💰</span><b>Invest</b><small>Grow revenue</small></button><button class="v44-act" data-mapact="military"><span>🛡️</span><b>Fortify</b><small>Raise defense</small></button><button class="v44-act" data-mapact="survey"><span>🕵️</span><b>Intel</b><small>Survey province</small></button><button class="v44-act" data-mapact="rally"><span>📣</span><b>Rally</b><small>Address people</small></button></div><div class="v44-callout"><b>Strategic note:</b> ${p.unrest>60?'Commit attention here quickly before unrest cascades into wider instability.':p.loyalty<35?'This province may become politically unreliable unless you rebuild trust.':p.economy>70?'A strong tax base makes this an ideal target for economic expansion.':p.military>70?'Military capacity here can support frontier operations and command reshuffles.':'This region is stable enough for selective investment and political cultivation.'}</div></div>`}
function provinceStrip(){return `<div class="v44-province-bar">${Object.keys(PMETA).map(n=>`<button class="v44-province-btn ${V44.selected===n?'active':''}" data-pick="${n}"><i>${PICON[n]||'•'}</i><span>${n}</span></button>`).join('')}</div>`}
function renderProvinceView(){ensureMapState();return `${hero4('Imperial Cartographic Office','True Strategic Atlas','A cleaner, geographically recognisable map of the Imperium with province-first commands and visual status panels.')}<div class="v44-map-layout"><div class="v44-map-panel"><div class="v44-map-head"><div><b>Roman Empire Atlas</b><div class="small">Mediterranean basin, frontier roads, fleets and active fronts</div></div><div class="v44-map-tools"><button class="${!V44.compact?'active':''}" data-tool="labels" title="Toggle labels">⌘</button><button class="${V44.route?'active':''}" data-tool="route" title="Toggle route">➜</button></div></div><div class="v44-map-wrap">${renderMapSVG()}</div><div class="v44-legend"><span><i style="background:#d4bd7a"></i>province</span><span><i style="background:#ef6658"></i>front</span><span><i style="background:#79ebff"></i>route</span><span><i style="background:#ffe89e"></i>capital</span></div>${provinceStrip()}</div>${provincePanel(V44.selected)}</div>`}
function bindProvinceView(){document.querySelectorAll('[data-province]').forEach(el=>{el.addEventListener('click',()=>selectProvince(el.dataset.province));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectProvince(el.dataset.province)}})});document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();selectProvince(el.dataset.city)}));document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>selectProvince(el.dataset.pick)));document.querySelectorAll('[data-mapact]').forEach(el=>el.addEventListener('click',()=>mapAction(el.dataset.mapact)));document.querySelectorAll('[data-tool]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.tool==='labels')V44.compact=!V44.compact;else if(el.dataset.tool==='route')V44.route=!V44.route;render()}))}
function selectProvince(n){V44.selected=n;S.v41.lastProvince=n;render()}
function mapAction(action){ensureMapState();let n=V44.selected,p=S.provinces[n],intel=S.v41.intel[n];if(action==='travel'){travelProvince(n);S.v41.mapVisits++;S.v41.cityInfluence[n]+=3;toast(`Travel route plotted to ${PMETA[n].capital}.`);return}if(action==='survey'){if(!spend(1))return;intel.surveyed=true;S.influence+=2;S.v41.cityInfluence[n]+=1;addLog(`Agents complete a political survey of ${n}.`)}else if(action==='rally'){if(!spend(2))return;let ok=check('rhetoric',10+Math.round(p.unrest/15));p.loyalty+=ok?5:-1;p.unrest+=ok?-3:2;S.popularity+=ok?3:-1;S.v41.cityInfluence[n]+=ok?4:0;addLog(`${ok?'A packed':'A difficult'} address in ${PMETA[n].capital}.`)}else if(action==='civic'){investProvince(n,'loyalty');return}else if(action==='economy'){investProvince(n,'economy');return}else if(action==='military'){investProvince(n,'military');return}['loyalty','unrest','economy','military'].forEach(k=>p[k]=clamp(p[k],0,100));render()}
function supportState(i,total,yes){return i<yes?'support':(i<total?'oppose':'neutral')}
function senateGraphical(){let a=S.v4.agenda,total=28,yes=Math.max(0,Math.min(total,Math.round((a.support/Math.max(1,a.support+a.opposition))*total)));let supportPct=Math.round(a.support/Math.max(1,a.support+a.opposition)*100);let rows=[10,10,8];let seatHTML='';let idx=0;rows.forEach((count,row)=>{let cls='r'+(row+1);let seats='';for(let i=0;i<count;i++,idx++){seats+=`<button type="button" class="v44-seat ${supportState(idx,total,yes)}" data-senate-seat="${idx}" aria-label="Inspect senator ${idx+1}"></button>`}seatHTML+=`<div class="v44-ring-seats ${cls}">${seats}</div>`});return `${hero4('Curia Live','Interactive Senate Chamber','Vote pressure and chamber blocs are shown visually so you can read the chamber at a glance.')}<div class="v44-scene"><div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Current motion</div><h3>${a.title}</h3><p>${a.text}</p></div></div><div class="v44-senate-wrap"><div class="v44-chamber"><div class="v44-vote-overlay"><div class="v44-score"><span>Projected support</span><b>${supportPct}%</b></div><div class="v44-score"><span>Time remaining</span><b>${a.days}d</b></div><div class="v44-score"><span>Political capital</span><b>${S.v4.politicalCapital}</b></div></div>${seatHTML}<div class="v44-floor"></div><div class="v44-rostrum">ROSTRUM</div></div></div><div class="v44-legend-row"><span class="v44-pill"><i style="background:#5ca77b"></i>support</span><span class="v44-pill"><i style="background:#a14f47"></i>oppose</span><span class="v44-pill"><i style="background:#7a6947"></i>undecided</span></div></div><div class="v44-panel pad"><div class="v44-bill-card"><h3 style="margin-top:0">Vote Control</h3><div class="v44-bill-meta"><div><span>Support</span><b>${a.support}</b></div><div><span>Opposition</span><b>${a.opposition}</b></div><div><span>Leverage</span><b>${S.v4.politicalCapital}</b></div></div><div class="v44-action-grid" style="padding:0"><button class="v44-tile" onclick="v4Lobby('support')"><span>🤝</span><b>Build Coalition</b><small>win support</small></button><button class="v44-tile" onclick="v4Lobby('oppose')"><span>🪤</span><b>Disrupt Rivals</b><small>split opposition</small></button><button class="v44-tile" onclick="v4ForceVote()"><span>🗳️</span><b>Force Vote</b><small>call the chamber</small></button><button class="v44-tile" onclick="committee()"><span>📜</span><b>Committee</b><small>prepare text</small></button></div><div style="margin-top:12px">${(S.v3?.houses||[]).slice(0,5).map(h=>`<div class="stat"><span>House ${h.name}</span><b>${h.loyalty}</b></div>`).join('')}</div></div></div></div>`}
function warGraphical(){let fronts=S.v3.fronts;return `${hero4('Strategic Command','Visual War Theatre','Fronts are now placed on a cleaner operational board with at-a-glance logistics and command actions.')}<div class="v44-scene"><div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Operational board</div><h3>The Living Fronts</h3><p>Supply routes, pressure points and command nodes give a clearer read of the strategic picture.</p></div></div><div class="v44-war-wrap"><div class="v44-war-map"><div class="v44-route-line" style="left:14%;top:63%;width:25%;transform:rotate(-10deg)"></div><div class="v44-route-line" style="left:47%;top:56%;width:28%;transform:rotate(6deg)"></div><div class="v44-front-line" style="left:45%;top:27%;width:${22+fronts[0].enemy/6}%;transform:rotate(9deg)"></div><div class="v44-front-line" style="left:63%;top:24%;width:${18+fronts[1].enemy/7}%;transform:rotate(-7deg)"></div><button class="v44-front-node" data-front-node="0" style="left:42%;top:34%" aria-label="Inspect northern front"></button><button class="v44-front-node" data-front-node="0" style="left:58%;top:41%" aria-label="Inspect northern supply node"></button><button class="v44-front-node" data-front-node="1" style="left:73%;top:31%" aria-label="Inspect eastern front"></button><button class="v44-front-node" data-front-node="1" style="left:82%;top:28%" aria-label="Inspect eastern supply node"></button><div style="position:absolute;left:13%;bottom:18%;color:#e9d9b4;font-size:12px">Nova Roma</div><div style="position:absolute;left:44%;top:16%;color:#e9d9b4;font-size:12px">Northern Frontier</div><div style="position:absolute;left:75%;top:13%;color:#e9d9b4;font-size:12px">Eastern Frontier</div></div><div class="v44-war-grid">${fronts.map((f,i)=>`<div class="v44-front-card"><h4>${f.name}</h4><div class="small">Commander ${f.commander} • ${f.status}</div><div class="v44-bars"><div class="line"><span>Readiness</span><div class="track"><span class="fill cyan" style="width:${f.roman}%"></span></div><b>${f.roman}</b></div><div class="line"><span>Enemy</span><div class="track"><span class="fill red" style="width:${f.enemy}%"></span></div><b>${f.enemy}</b></div><div class="line"><span>Supply</span><div class="track"><span class="fill gold" style="width:${f.supply}%"></span></div><b>${f.supply}</b></div></div><div class="v44-action-grid" style="grid-template-columns:repeat(3,1fr);padding:0"><button class="v44-tile" onclick="v4Front(${i},'rotate')"><span>🔄</span><b>Rotate</b><small>new commander</small></button><button class="v44-tile" onclick="v4Front(${i},'fortify')"><span>🧱</span><b>Fortify</b><small>improve line</small></button><button class="v44-tile" onclick="v4Front(${i},'offensive')"><span>⚔️</span><b>Offensive</b><small>press attack</small></button></div></div>`).join('')}</div></div></div><div class="v44-panel pad"><h3 style="margin-top:0">Campaign Actions</h3><div class="v44-action-grid" style="padding:0"><button class="v44-tile" onclick="v3Operation(0,'recon')"><span>👁️</span><b>Recon</b><small>north intel</small></button><button class="v44-tile" onclick="v3Operation(0,'supply')"><span>📦</span><b>Resupply</b><small>north line</small></button><button class="v44-tile" onclick="v3Operation(1,'recon')"><span>🛰️</span><b>Eastern Intel</b><small>scan east</small></button><button class="v44-tile" onclick="v3Operation(1,'supply')"><span>🚚</span><b>Supply East</b><small>secure route</small></button></div><div class="v44-callout"><b>Strategic note:</b> Higher supply and morale improve your chances when you launch a grand offensive. Rotate commanders when readiness stalls.</div></div></div>`}
function capitalGraphical(){return `${hero4('Nova Roma','Imperial Capital','Core daily actions are now arranged as a visual command deck rather than a long text list.')}<div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Daily command</div><h3>Capital Districts</h3><p>Choose a district action to shape influence, skill growth, security and palace standing.</p></div></div><div class="v44-action-grid"><button class="v44-tile" onclick="speech()"><span>📣</span><b>Forum</b><small>address the crowd</small></button><button class="v44-tile" onclick="train('learning')"><span>📚</span><b>Archives</b><small>study policy</small></button><button class="v44-tile" onclick="train('strength')"><span>⚔️</span><b>Praetorium</b><small>train arms</small></button><button class="v44-tile" onclick="salon()"><span>🍷</span><b>Salon</b><small>network with elites</small></button><button class="v44-tile" onclick="investigate()"><span>🕵️</span><b>Inquiry</b><small>hunt corruption</small></button><button class="v44-tile" onclick="fight()"><span>🛡️</span><b>Subura</b><small>street patrol</small></button><button class="v44-tile" onclick="palace()"><span>👑</span><b>Palace</b><small>seek favor</small></button><button class="v44-tile" onclick="temple()"><span>🏺</span><b>Temple</b><small>consult the rites</small></button></div><div class="v44-legend-row"><span class="v44-pill"><i style="background:#f0cd78"></i>${origins[S.origin].name}</span><span class="v44-pill"><i style="background:#79ebff"></i>level ${S.level}</span><span class="v44-pill"><i style="background:#67c18c"></i>office ${offices[S.office].name}</span></div></div>`}
const oldTabs=window.renderTabs;window.renderTabs=function(){if(typeof S!=='undefined'&&S)ensureMapState();let tabs=$('tabs');tabs.className='tabs v43-dock v44-dock';tabs.innerHTML=tabMarkup()};
const oldHeader=window.renderHeader;window.renderHeader=function(){oldHeader();let wrap=document.getElementById('hud44');if(!wrap){wrap=document.createElement('div');wrap.id='hud44';let target=document.getElementById('game');target.insertBefore(wrap,target.children[2]||target.firstChild)}wrap.innerHTML=(typeof S!=='undefined'&&S)?uiHud():''};
const oldView=window.renderView;window.renderView=function(){if(currentTab==='Provinces'){$('view').innerHTML=renderProvinceView();requestAnimationFrame(bindProvinceView)}else if(currentTab==='Senate'){$('view').innerHTML=senateGraphical();requestAnimationFrame(()=>{iconizeButtons();bindV441Objects()})}else if(currentTab==='War Room'){$('view').innerHTML=warGraphical();requestAnimationFrame(()=>{iconizeButtons();bindV441Objects()})}else if(currentTab==='Capital'){$('view').innerHTML=capitalGraphical();requestAnimationFrame(iconizeButtons)}else{oldView();requestAnimationFrame(iconizeButtons)}};
const oldRender=window.render;window.render=function(){oldRender();requestAnimationFrame(iconizeButtons)};
function boot44(){document.title='Imperium Aeternum IV — Graphical Command 4.4';let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.4 — Aligned UI & Proper Imperial Atlas';if(typeof S!=='undefined'&&S)requestAnimationFrame(iconizeButtons)}
addEventListener('DOMContentLoaded',boot44);if(document.readyState!=='loading')setTimeout(boot44,0);
})();
</script>


<style id="v441-style">

.v44-seat{min-height:0;padding:0;cursor:pointer}.v44-seat:hover,.v44-seat:focus{outline:2px solid #f1d487;transform:translateY(-2px)}

.v441-object{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}.v441-object-art{position:relative;min-height:190px;border:1px solid #76603f;border-radius:18px;background:radial-gradient(circle at 50% 35%,#59402b,#17110e 72%);overflow:hidden;display:grid;place-items:center}.v441-object-art .big{font-size:72px;filter:drop-shadow(0 12px 12px #0007)}.v441-object-art:before,.v441-object-art:after{content:'';position:absolute;border:1px solid #d3ad6266;border-radius:50%}.v441-object-art:before{width:140px;height:140px}.v441-object-art:after{width:100px;height:100px}.v441-object h2{margin-top:0}.v441-object-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.v441-object-grid div{padding:9px;border:1px solid #4d4032;border-radius:12px;background:#15100d}.v441-object-grid b{display:block;color:#f0cd78;font-size:16px}.v441-object-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.v441-object-actions button{display:flex;align-items:center;justify-content:center;gap:7px}
.v41-hotspot{min-width:76px}.v41-hotspot:after{content:'›';margin-left:5px;color:#f1ce79}.v441-inspect-tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;padding:5px 9px;border-radius:999px;background:#071019c9;border:1px solid #5f7887;color:#dbe9e8;font-size:10px;pointer-events:none}
@media(max-width:650px){.v441-object{grid-template-columns:1fr}.v441-object-art{min-height:130px}.v441-object-art .big{font-size:56px}}
</style>
<script id="v441-script">
(()=>{
'use strict';
const OBJECTS={
 FORUM:{icon:'📣',title:'Forum Maximus',type:'Public district',desc:'The political heart of Nova Roma. Crowds, media feeds and faction organizers react to every address.',stats:()=>[['Popularity',S.popularity],['Rhetoric',S.rhetoric],['Influence',S.influence]],actions:[['📣 Address Crowd','speech()'],['👥 Campaign Rally',"campaignAction('rally')"]]},
 ARCHIVES:{icon:'📚',title:'Imperial Archives',type:'Research facility',desc:'Two millennia of laws, censuses and classified state records are stored beneath the capital.',stats:()=>[['Learning',S.learning],['Research',S.research.length],['Energy',S.energy]],actions:[['📚 Study Records',"train('learning')"],['🕵️ Investigate','investigate()']]},
 PALACE:{icon:'👑',title:'Palatine Palace',type:'Imperial residence',desc:'The Emperor’s household, ministers and Praetorian gatekeepers control access to the highest offices.',stats:()=>[['Imperial favor',S.favor],['Office',offices[S.office].name],['Scandal',S.scandal]],actions:[['👑 Request Audience','palace()'],['🍷 Host Salon','salon()']]},
 SUBURA:{icon:'🛡️',title:'The Subura',type:'Urban district',desc:'Dense streets, criminal networks and populist clubs make this district dangerous and politically valuable.',stats:()=>[['Strength',S.strength],['Corruption',S.corruption],['Enemies defeated',S.enemiesDefeated]],actions:[['🛡️ Patrol Streets','fight()'],['🕵️ Investigate','investigate()']]},
 ROSTRUM:{icon:'🗳️',title:'Senate Rostrum',type:'Legislative object',desc:'The speaking platform from which senators make motions, challenge rivals and demand votes.',stats:()=>[['Political capital',S.v4?.politicalCapital||0],['Influence',S.influence],['Bills passed',S.billsPassed]],actions:[['🤝 Build Coalition',"v4Lobby('support')"],['🗳️ Force Vote','v4ForceVote()']]},
 GALLERY:{icon:'👥',title:'Voting Gallery',type:'Senate chamber',desc:'Clerks and faction whips track every senator’s likely vote from the gallery above the chamber.',stats:()=>[['Senators',S.senators.length],['Faction support',Math.round(Object.values(S.factions).reduce((a,b)=>a+b,0)/6)],['Influence',S.influence]],actions:[['🗳️ Whip Votes','whipVotes()'],['🗡️ Expose Rival','exposeRival()']]},
 CLERKS:{icon:'📜',title:'Senate Clerks',type:'Administrative office',desc:'The clerks control amendments, committee schedules and the exact language of legislation.',stats:()=>[['Learning',S.learning],['Rhetoric',S.rhetoric],['Energy',S.energy]],actions:[['📜 Committee Work','committee()'],['📚 Study Law',"train('learning')"]]},
 COMMAND:{icon:'⚔️',title:'Central Command Table',type:'Military command object',desc:'A live operational table combines drone reconnaissance, logistics and orders from every active front.',stats:()=>[['Military',S.world.military],['Strategy',S.strategy],['Active fronts',S.v3?.fronts?.length||0]],actions:[['⚔️ Northern Offensive',"v4Front(0,'offensive')"],['🛰️ Recon North',"v3Operation(0,'recon')"]]},
 'FRONT I':{icon:'🛡️',title:'Northern Frontier',type:'Military front',desc:'The fortified northern line protects the industrial provinces and the approaches to Italia.',stats:()=>frontStats(0),actions:[['🧱 Fortify',"v4Front(0,'fortify')"],['👁️ Recon',"v3Operation(0,'recon')"]]},
 'FRONT II':{icon:'⚔️',title:'Eastern Frontier',type:'Military front',desc:'The eastern theatre spans Armenia, Syria and Mesopotamia, where supply routes are long and exposed.',stats:()=>frontStats(1),actions:[['🧱 Fortify',"v4Front(1,'fortify')"],['📦 Supply',"v3Operation(1,'supply')"]]},
 LAB:{icon:'⚙️',title:'Quantum Engineering Laboratory',type:'Research facility',desc:'Engineers combine Roman infrastructure doctrine with quantum materials and autonomous construction.',stats:()=>[['Learning',S.learning],['Technologies',S.research.length],['Economy',S.world.economy]],actions:[['⚙️ Research Aqueducts',"research('Quantum Aqueducts')"],['📚 Train Learning',"train('learning')"]]},
 MEDIA:{icon:'📡',title:'Imperial Media Center',type:'Campaign facility',desc:'Broadcast studios and analytics teams shape provincial opinion and election momentum.',stats:()=>[['Popularity',S.popularity],['Charisma',S.charisma],['Election day',S.electionDay]],actions:[['📡 Buy Ads',"campaignAction('ads')"],['🎤 Debate',"campaignAction('debate')"]]},
 ACCOUNTS:{icon:'💰',title:'Household Accounts',type:'Estate object',desc:'Your estate’s ledgers reveal income, debts, patronage obligations and opportunities for political spending.',stats:()=>[['Denarii',S.money],['Businesses',S.businesses.length],['Corruption',S.corruption]],actions:[['🍷 Host Salon','salon()'],['💰 Estate Screen',"tab('Estate')"]]},
 GARDENS:{icon:'🏺',title:'Estate Gardens',type:'Private district',desc:'A discreet place for rituals, private negotiations and meetings away from Senate surveillance.',stats:()=>[['Piety',S.piety],['Favor',S.favor],['Companions',S.companions.length]],actions:[['🏺 Consult Rites','temple()'],['🍷 Private Salon','salon()']]}
};
function frontStats(i){let f=S.v3?.fronts?.[i]||{};return [['Readiness',f.roman||0],['Enemy pressure',f.enemy||0],['Supply',f.supply||0],['Commander',f.commander||'Unassigned']]}
function statHtml(stats){return `<div class="v441-object-grid">${stats.map(([k,v])=>`<div><span class="small">${k}</span><b>${v}</b></div>`).join('')}</div>`}
function actionHtml(actions){return `<div class="v441-object-actions">${actions.map(([label,code])=>`<button class="btn" data-object-action="${encodeURIComponent(code)}">${label}</button>`).join('')}</div>`}
function showObject(key){let o=OBJECTS[key];if(!o)return;modal(`<div class="v441-object"><div class="v441-object-art"><span class="big">${o.icon}</span></div><div><div class="v4-kicker">${o.type}</div><h2>${o.title}</h2><p>${o.desc}</p>${statHtml(o.stats())}${actionHtml(o.actions)}<button class="btn" style="width:100%;margin-top:9px" onclick="closeModal()">Close inspection</button></div></div>`);document.querySelectorAll('[data-object-action]').forEach(b=>b.addEventListener('click',()=>{let code=decodeURIComponent(b.dataset.objectAction);closeModal();try{Function(code)()}catch(e){console.error(e);toast('That action is currently unavailable.')}}))}
function showSenator(i){let s=S.senators[i%S.senators.length];if(!s)return;modal(`<div class="v441-object"><div class="v441-object-art"><span class="big">👤</span></div><div><div class="v4-kicker">${s.faction} senator</div><h2>${s.name}</h2><p>Political power, personal loyalty and private interests determine how this senator behaves in the chamber.</p>${statHtml([['Relationship',s.relation],['Power',s.power],['Ambition',s.ambition],['Known interest',s.secret]])}<div class="v441-object-actions"><button class="btn" onclick="closeModal();lobby()">🤝 Lobby</button><button class="btn" onclick="closeModal();exposeRival()">🕵️ Investigate</button></div><button class="btn" style="width:100%;margin-top:9px" onclick="closeModal()">Return to chamber</button></div></div>`)}
function showFront(i){let f=S.v3?.fronts?.[i];if(!f)return;modal(`<div class="v441-object"><div class="v441-object-art"><span class="big">⚔️</span></div><div><div class="v4-kicker">Active military front</div><h2>${f.name}</h2><p>${f.status}. Commanded by ${f.commander}.</p>${statHtml(frontStats(i))}<div class="v441-object-actions"><button class="btn" onclick="closeModal();v4Front(${i},'fortify')">🧱 Fortify</button><button class="btn" onclick="closeModal();v4Front(${i},'offensive')">⚔️ Offensive</button><button class="btn" onclick="closeModal();v3Operation(${i},'recon')">👁️ Recon</button><button class="btn" onclick="closeModal();v3Operation(${i},'supply')">📦 Supply</button></div></div></div>`)}
window.bindV441Objects=function(){document.querySelectorAll('[data-senate-seat]').forEach(el=>el.addEventListener('click',()=>showSenator(Number(el.dataset.senateSeat))));document.querySelectorAll('[data-front-node]').forEach(el=>el.addEventListener('click',()=>showFront(Number(el.dataset.frontNode))))}
function bindHotspots(){document.querySelectorAll('.v41-hotspot').forEach(el=>{if(el.dataset.v441)return;el.dataset.v441='1';el.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();showObject(el.textContent.replace('›','').trim())},true)});let stage=document.getElementById('artStage');if(stage&&!stage.querySelector('.v441-inspect-tip')){let d=document.createElement('div');d.className='v441-inspect-tip';d.textContent='Click a marker to inspect the object';stage.appendChild(d)}}
const observer=new MutationObserver(()=>{bindHotspots();if(typeof bindV441Objects==='function')bindV441Objects()});observer.observe(document.documentElement,{childList:true,subtree:true});
const oldRender=window.render;window.render=function(){oldRender();requestAnimationFrame(()=>{bindHotspots();bindV441Objects()})};
function boot(){let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.4.1 — Interaction Repair';bindHotspots();bindV441Objects()}
addEventListener('DOMContentLoaded',boot);if(document.readyState!=='loading')setTimeout(boot,0);
})();
</script>
</body></html>
