<script id="v43-script">
(()=>{
'use strict';
const TABS=[
 ['Capital','🏛','Capital'],['Senate','🗳️','Senate'],['Imperial Council','👑','Council'],['Provinces','🗺️','Map'],['Campaign','📣','Campaign'],['War Room','⚔️','War'],['Diplomacy','🤝','Diplomacy'],['Estate','🏡','Estate'],['Research','⚙️','Research'],['People','👥','People'],['Chronicle','📜','Chronicle']
];
const PICON={Italia:'★',Gallia:'✦',Hispania:'☀',Britannia:'☁',Germania:'⚒',Dacia:'⛰',Graecia:'Ω',Aegyptus:'△',Syria:'✹',Arabia:'✧',Armenia:'⬟',Mesopotamia:'≈',Africa:'◆',Mauretania:'◈',Scythia:'❄'};
const PMETA={Italia:{c:[420,250],capital:'Nova Roma',color:'#8d7043'},Gallia:{c:[310,190],capital:'Lugdunum',color:'#526d51'},Hispania:{c:[190,265],capital:'Tarraco',color:'#796249'},Britannia:{c:[275,102],capital:'Londinium',color:'#4f6472'},Germania:{c:[410,135],capital:'Colonia',color:'#586552'},Dacia:{c:[535,185],capital:'Ulpia Traiana',color:'#725b49'},Graecia:{c:[515,280],capital:'Athenae',color:'#605b78'},Aegyptus:{c:[610,405],capital:'Alexandria',color:'#9a7f46'},Syria:{c:[700,310],capital:'Antiochia',color:'#74524c'},Arabia:{c:[735,405],capital:'Petra',color:'#766948'},Armenia:{c:[735,225],capital:'Artaxata',color:'#665275'},Mesopotamia:{c:[790,310],capital:'Ctesiphon',color:'#7a6849'},Africa:{c:[390,395],capital:'Carthago',color:'#7a5b42'},Mauretania:{c:[220,390],capital:'Caesarea',color:'#5c704f'},Scythia:{c:[650,105],capital:'Tanais',color:'#4c6670'}};
const PATHS={Britannia:'M235 65 L270 52 L303 72 L302 105 L282 135 L249 128 L231 99 Z',Hispania:'M118 235 L151 207 L218 207 L257 234 L246 291 L208 322 L145 310 L111 274 Z',Gallia:'M240 153 L293 128 L362 147 L387 189 L352 235 L294 242 L250 211 Z',Germania:'M360 103 L419 84 L477 112 L490 167 L452 199 L386 184 L365 145 Z',Italia:'M390 210 L425 201 L444 226 L439 262 L468 298 L455 325 L431 303 L420 271 L398 251 Z M461 324 L480 330 L469 347 L451 339 Z',Dacia:'M485 152 L540 141 L590 170 L579 215 L535 232 L493 202 Z',Graecia:'M477 239 L520 226 L555 249 L548 285 L574 308 L552 332 L519 301 L493 288 Z',Scythia:'M475 66 L573 42 L705 55 L776 91 L762 146 L675 154 L596 133 L514 142 Z',Armenia:'M681 182 L731 164 L774 193 L759 238 L710 249 L674 218 Z',Syria:'M664 260 L709 247 L745 270 L735 329 L704 354 L672 324 Z',Mesopotamia:'M747 250 L797 238 L830 275 L817 342 L777 371 L738 329 Z',Arabia:'M681 337 L735 324 L799 360 L785 433 L741 482 L688 451 L663 392 Z',Aegyptus:'M567 344 L630 337 L674 363 L659 432 L622 466 L571 431 Z',Africa:'M300 347 L382 330 L467 342 L541 370 L518 424 L432 445 L346 432 L292 397 Z',Mauretania:'M122 340 L210 327 L300 347 L292 397 L218 428 L139 411 L102 374 Z'};
const V43={selected:'Italia',compact:false,route:true};
function ensureState(){if(typeof S==='undefined'||!S)return;S.v41=S.v41||{mapVisits:0,cityInfluence:{},routes:[],intel:{},lastProvince:'Italia'};Object.keys(PMETA).forEach(n=>{if(S.v41.cityInfluence[n]==null)S.v41.cityInfluence[n]=0;if(!S.v41.intel[n])S.v41.intel[n]={surveyed:false,rumor:pick(['A governor is quietly building a private coalition.','Merchants complain about military requisitions.','Local councils seek greater representation.','A construction boom is hiding substantial debt.','Veterans are organizing around a charismatic tribune.'])}});if(S.v41.lastProvince&&PMETA[S.v41.lastProvince])V43.selected=S.v41.lastProvince;}
 function tabMarkup(){let hasCouncil=(typeof ensure4==='function');return TABS.filter(t=>hasCouncil||t[0]!=='Imperial Council').map(([key,ico,label])=>`<button class="v43-tab ${currentTab===key?'active':''}" onclick="tab('${key}')"><span class="ico">${ico}</span><span class="lbl">${label}</span>${currentTab===key?'<span class="dot"></span>':''}</button>`).join('')}
 function ring(label,val,color,ico){let c=2*Math.PI*20,off=c-c*val/100;return `<div class="v43-ring"><svg viewBox="0 0 54 54" aria-hidden="true"><circle class="bg" cx="27" cy="27" r="20"></circle><circle class="fg" cx="27" cy="27" r="20" style="stroke:${color};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${off.toFixed(2)}"></circle><text x="27" y="31" text-anchor="middle" font-size="13" fill="#f6ebcb">${ico}</text></svg><div class="meta"><span>${label}</span><b>${Math.round(val)}</b><i>${val>=70?'High':val>=40?'Stable':'Low'}</i></div></div>`}
 function strategicRead(p){return p.unrest>60?'Instability risk':p.loyalty<35?'Governor doubtful':p.economy>70?'Revenue opportunity':p.military>70?'Fortified stronghold':'Manageable conditions'}
 function mapSVG(){let labels=Object.entries(PMETA).map(([n,m])=>`<text class="label" x="${m.c[0]}" y="${m.c[1]-9}" text-anchor="middle">${n}</text><circle class="city-ring" cx="${m.c[0]}" cy="${m.c[1]}" r="3"></circle><circle class="city" data-city="${n}" cx="${m.c[0]}" cy="${m.c[1]}" r="3.8"></circle>${n==='Italia'?`<path class="capital-star" d="M${m.c[0]} ${m.c[1]-8} l2 4 4 .4 -3 2.7 1 4.4 -4-2.2 -4 2.2 1-4.4 -3-2.7 4-.4z"/>`:''}`).join('');
 let provinces=Object.entries(PATHS).map(([n,d])=>`<path class="province ${V43.selected===n?'active':''}" data-province="${n}" tabindex="0" aria-label="${n}" d="${d}" fill="${PMETA[n].color}"/>`).join('');
 let route=''; if(V43.route&&V43.selected!=='Italia'){let a=PMETA.Italia.c,b=PMETA[V43.selected].c,mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-35;route=`<path class="route" d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}"/>`}
 return `<svg class="v43-map ${V43.compact?'compact':''}" viewBox="70 25 790 470" role="img" aria-label="Graphical map of the Roman Empire"><defs><linearGradient id="v43Sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#143c58"/><stop offset="100%" stop-color="#071822"/></linearGradient></defs><rect class="sea" x="70" y="25" width="790" height="470" rx="18"/><path class="landmass" d="M82 35H850V190L818 181L778 155L742 162L710 155L675 168L629 156L590 166L548 146L502 151L476 194L451 202L425 190L394 196L367 188L344 205L315 196L285 210L255 197L225 203L197 195L167 210L133 200L95 215Z"/><path class="landmass" d="M80 315L125 322L183 312L248 321L308 326L370 317L433 326L499 330L558 338L622 329L684 335L743 323L811 339L850 355V495H70V341Z"/><path class="coast" d="M87 218Q170 188 244 207T385 195T502 181T631 163T760 170T844 195 M80 316Q166 304 250 318T420 320T595 329T760 317T850 343"/>${provinces}<text class="sea-label" x="438" y="358">MARE INTERNUM</text><text class="sea-label" x="160" y="168">ATLANTICUS</text><text class="sea-label" x="680" y="282">AEGAEUM</text><path class="road" d="M420 250 Q352 210 310 190 Q236 230 190 265 M420 250 Q468 239 515 280 Q607 285 700 310 M420 250 Q385 330 390 395 M515 280 Q575 207 650 105 M610 405 Q667 357 700 310"/>${route}<path class="front" d="M447 112 Q475 135 492 165"/><path class="front" d="M615 123 Q668 139 710 145"/>${labels}<g class="fleet" transform="translate(484 365)"><path d="M0 0l18 0-5 6H4z" fill="currentColor"/><path d="M9-14v14M9-13l8 7H9" stroke="currentColor" fill="none"/></g><g class="compass" transform="translate(812 72)"><circle cx="0" cy="0" r="22"/><path d="M0 -18 L4 0 L0 18 L-4 0 Z" fill="#d5b76a"/><path d="M-18 0 L0 -4 L18 0 L0 4 Z" fill="#d5b76a"/><text x="0" y="-28" text-anchor="middle">N</text></g></svg>`}
 function chipBar(){return `<div class="v43-map-strip">${Object.keys(PMETA).map(n=>`<button class="v43-pick ${V43.selected===n?'active':''}" data-pick="${n}"><i>${PICON[n]||'•'}</i><span>${n}</span></button>`).join('')}</div>`}
 function provincePanel(n){let p=S.provinces[n],m=PMETA[n],intel=S.v41.intel[n];return `<div class="v43-side-card"><div class="v43-province-top"><div style="display:flex;align-items:center;gap:10px"><div class="v43-herald">${PICON[n]||'•'}</div><div><h3 style="margin:0">${n}</h3><div class="small">${m.capital} • ${p.governor}</div></div></div><span class="v43-mini-badge">✦ influence ${S.v41.cityInfluence[n]}</span></div><div class="v43-rings">${ring('Loyalty',p.loyalty,'#6dd3c6','❤')}${ring('Unrest',p.unrest,'#e46c5d','⚠')}${ring('Economy',p.economy,'#e8c56f','¤')}${ring('Military',p.military,'#8db8ff','⚔')}</div><div class="v43-situation"><div class="tagline"><span>${provinceFlavors[n]}</span><span>${strategicRead(p)}</span>${intel.surveyed?'<span>Intel ready</span>':'<span>Intel missing</span>'}</div><div class="small">${intel.surveyed?intel.rumor:'Send agents or visit the province to unlock a full report.'}</div></div><div class="v43-actions"><button class="v43-act primary" data-mapact="travel"><span>🧭</span><b>Travel</b><small>Visit capital</small></button><button class="v43-act" data-mapact="civic"><span>🏛️</span><b>Civic</b><small>Boost loyalty</small></button><button class="v43-act" data-mapact="economy"><span>💰</span><b>Invest</b><small>Grow revenue</small></button><button class="v43-act" data-mapact="military"><span>🛡️</span><b>Fortify</b><small>Raise defense</small></button><button class="v43-act" data-mapact="survey"><span>🕵️</span><b>Intel</b><small>Survey province</small></button><button class="v43-act" data-mapact="rally"><span>📣</span><b>Rally</b><small>Address people</small></button></div><div class="v43-callout"><b>Strategic note:</b> ${p.unrest>60?'Commit attention here quickly before unrest cascades into wider instability.':p.loyalty<35?'This province may become politically unreliable unless you rebuild trust.':p.economy>70?'A strong tax base makes this an ideal target for economic expansion.':p.military>70?'Military capacity here can support frontier operations and command reshuffles.':'This region is stable enough for selective investment and political cultivation.'}</div></div>`}
 function provinceView(){ensureState();return `${hero4('Imperial Interface','Graphical Provincial Command','Select a territory on the map or the province strip, then issue orders from the visual control panel.')}<div class="v43-view"><div class="v43-map-card"><div class="v43-map-head"><div><b>Empire Atlas</b><div class="small">Live roads, fronts, capitals and travel route</div></div><div class="v43-toggle"><button class="${!V43.compact?'active':''}" data-tool="labels" title="Toggle labels">⌘</button><button class="${V43.route?'active':''}" data-tool="route" title="Toggle route">➜</button></div></div><div class="v43-map-wrap">${mapSVG()}</div><div class="v43-legend"><span><i style="background:#d4bd7a"></i>province</span><span><i style="background:#ef6658"></i>front</span><span><i style="background:#77efff"></i>route</span><span><i style="background:#ffe294"></i>capital</span></div>${chipBar()}</div>${provincePanel(V43.selected)}</div>`}
 function selectProvince(n){V43.selected=n;S.v41.lastProvince=n;render()}
 function spendMapEnergy(e){if(typeof spend==='function')return spend(e);return true}
 window.v43MapAction=function(action){ensureState();let n=V43.selected,p=S.provinces[n],intel=S.v41.intel[n];if(action==='travel'){travelProvince(n);S.v41.mapVisits++;S.v41.cityInfluence[n]+=3;toast(`Travel route plotted to ${PMETA[n].capital}.`);return}
 if(action==='survey'){if(!spendMapEnergy(1))return;intel.surveyed=true;S.influence+=2;S.v41.cityInfluence[n]+=1;addLog(`Agents complete a political survey of ${n}.`)}
 else if(action==='rally'){if(!spendMapEnergy(2))return;let ok=check('rhetoric',10+Math.round(p.unrest/15));p.loyalty+=ok?5:-1;p.unrest+=ok?-3:2;S.popularity+=ok?3:-1;S.v41.cityInfluence[n]+=ok?4:0;addLog(`${ok?'A packed':'A difficult'} address in ${PMETA[n].capital}.`)}
 else if(action==='civic'){investProvince(n,'loyalty');return}
 else if(action==='economy'){investProvince(n,'economy');return}
 else if(action==='military'){investProvince(n,'military');return}
 ['loyalty','unrest','economy','military'].forEach(k=>p[k]=clamp(p[k],0,100));render()}
 function bindProvinceUI(){document.querySelectorAll('[data-province]').forEach(el=>{el.addEventListener('click',()=>selectProvince(el.dataset.province));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectProvince(el.dataset.province)}})});document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();selectProvince(el.dataset.city)}));document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>selectProvince(el.dataset.pick)));document.querySelectorAll('[data-mapact]').forEach(el=>el.addEventListener('click',()=>v43MapAction(el.dataset.mapact)));document.querySelectorAll('[data-tool]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.tool==='labels')V43.compact=!V43.compact;else if(el.dataset.tool==='route')V43.route=!V43.route;render()}));enhanceActionButtons()}
 function enhanceActionButtons(){const map=[['Address','📣'],['Study','📚'],['Train','⚔️'],['Host','🍷'],['Investigate','🕵️'],['Patrol','🛡️'],['Visit','👑'],['Temple','🏺'],['Lobby','🤝'],['Whip','🗳️'],['Expose','🗡️'],['Committee','📜'],['Campaign','📣'],['Debate','🎤'],['Fundraise','💰'],['Travel','🧭'],['Invest','💰'],['Fund','🏛️'],['Inspect','🛡️'],['Summit','🤝'],['Trade','⚖️'],['Intelligence','🕵️'],['Recon','👁️'],['Supply','📦'],['Operation','⚔️'],['Commerce','⚖️'],['Defense','🛡️'],['Science','⚙️'],['Private','👂'],['Enact','📜'],['Build','🤝'],['Rotate','🔄'],['Fortify','🧱'],['Grand','⚔️']];document.querySelectorAll('#view .actions .btn, #view .choices .choice, #view .cards .btn, #view .card .btn').forEach(btn=>{if(btn.classList.contains('v43-icon-btn'))return;let txt=(btn.textContent||'').trim();let hit=map.find(([k])=>txt.startsWith(k)||txt.includes(k));if(hit){btn.dataset.emoji=hit[1];btn.classList.add('v43-icon-btn')}})}
 const prevTabs=window.renderTabs;window.renderTabs=function(){if(typeof S!=='undefined'&&S)ensureState();$('tabs').classList.add('v43-dock');$('tabs').innerHTML=tabMarkup()};
 const prevView=window.renderView;window.renderView=function(){if(currentTab==='Provinces'){$('view').innerHTML=provinceView();requestAnimationFrame(bindProvinceUI)}else{prevView();requestAnimationFrame(enhanceActionButtons)}};
 function bootV43(){document.title='Imperium Aeternum IV — Graphical Command';let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.3 — Visual Menus & Clearer Atlas';if(typeof S!=='undefined'&&S)requestAnimationFrame(enhanceActionButtons)}
 addEventListener('DOMContentLoaded',bootV43);if(document.readyState!=='loading')setTimeout(bootV43,0);
})();
</script>

function ring(label,val,color,ico){let c=2*Math.PI*20,off=c-c*val/100;return `<div class="v44-ring"><svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="20"></circle><circle class="fg" cx="29" cy="29" r="20" style="stroke:${color};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${off.toFixed(2)}"></circle><text x="29" y="34" text-anchor="middle" font-size="13" fill="#f6ebcb">${ico}</text></svg><div class="meta"><span>${label}</span><b>${Math.round(val)}</b><i>${val>=70?'High':val>=40?'Stable':'Low'}</i></div></div>`}
function strategicRead(p){return p.unrest>60?'Instability risk':p.loyalty<35?'Governor doubtful':p.economy>70?'Revenue opportunity':p.military>70?'Fortified stronghold':'Manageable conditions'}
function provincePanel(n){let p=S.provinces[n],m=PMETA[n],intel=S.v41.intel[n];return `<div class="v44-side-panel"><div class="v44-province-top"><div style="display:flex;align-items:center;gap:10px"><div class="v44-herald">${PICON[n]||'•'}</div><div class="v44-title-block"><h3>${n}</h3><div class="small">${m.capital} • ${p.governor}</div></div></div><span class="v44-mini">✦ influence ${S.v41.cityInfluence[n]}</span></div><div class="v44-rings">${ring('Loyalty',p.loyalty,'#6dd3c6','❤')}${ring('Unrest',p.unrest,'#e46c5d','⚠')}${ring('Economy',p.economy,'#e8c56f','¤')}${ring('Military',p.military,'#8db8ff','⚔')}</div><div class="v44-situation"><div class="tags"><span>${provinceFlavors[n]}</span><span>${strategicRead(p)}</span>${intel.surveyed?'<span>Intel ready</span>':'<span>Intel missing</span>'}</div><div class="small">${intel.surveyed?intel.rumor:'Send agents or travel to unlock a full provincial report.'}</div></div><div class="v44-actions"><button class="v44-act primary" data-mapact="travel"><span>🧭</span><b>Travel</b><small>Visit capital</small></button><button class="v44-act" data-mapact="civic"><span>🏛️</span><b>Civic</b><small>Boost loyalty</small></button><button class="v44-act" data-mapact="economy"><span>💰</span><b>Invest</b><small>Grow revenue</small></button><button class="v44-act" data-mapact="military"><span>🛡️</span><b>Fortify</b><small>Raise defense</small></button><button class="v44-act" data-mapact="survey"><span>🕵️</span><b>Intel</b><small>Survey province</small></button><button class="v44-act" data-mapact="rally"><span>📣</span><b>Rally</b><small>Address people</small></button></div><div class="v44-callout"><b>Strategic note:</b> ${p.unrest>60?'Commit attention here quickly before unrest cascades into wider instability.':p.loyalty<35?'This province may become politically unreliable unless you rebuild trust.':p.economy>70?'A strong tax base makes this an ideal target for economic expansion.':p.military>70?'Military capacity here can support frontier operations and command reshuffles.':'This region is stable enough for selective investment and political cultivation.'}</div></div>`}
function provinceStrip(){return `<div class="v44-province-bar">${Object.keys(PMETA).map(n=>`<button class="v44-province-btn ${V44.selected===n?'active':''}" data-pick="${n}"><i>${PICON[n]||'•'}</i><span>${n}</span></button>`).join('')}</div>`}
function renderProvinceView(){ensureMapState();return `${v44Hero('Imperial Cartographic Office','True Strategic Atlas','A cleaner, geographically recognisable map of the Imperium with province-first commands and visual status panels.')}<div class="v44-map-layout"><div class="v44-map-panel"><div class="v44-map-head"><div><b>Roman Empire Atlas</b><div class="small">Mediterranean basin, frontier roads, fleets and active fronts</div></div><div class="v44-map-tools"><button class="${!V44.compact?'active':''}" data-tool="labels" title="Toggle labels">⌘</button><button class="${V44.route?'active':''}" data-tool="route" title="Toggle route">➜</button></div></div><div class="v44-map-wrap">${renderMapSVG()}</div><div class="v44-legend"><span><i style="background:#d4bd7a"></i>province</span><span><i style="background:#ef6658"></i>front</span><span><i style="background:#79ebff"></i>route</span><span><i style="background:#ffe89e"></i>capital</span></div>${provinceStrip()}</div>${provincePanel(V44.selected)}</div>`}
function bindProvinceView(){document.querySelectorAll('[data-province]').forEach(el=>{el.addEventListener('click',()=>selectProvince(el.dataset.province));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectProvince(el.dataset.province)}})});document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();selectProvince(el.dataset.city)}));document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>selectProvince(el.dataset.pick)));document.querySelectorAll('[data-mapact]').forEach(el=>el.addEventListener('click',()=>mapAction(el.dataset.mapact)));document.querySelectorAll('[data-tool]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.tool==='labels')V44.compact=!V44.compact;else if(el.dataset.tool==='route')V44.route=!V44.route;render()}))}
function selectProvince(n){V44.selected=n;S.v41.lastProvince=n;render()}
function mapAction(action){ensureMapState();let n=V44.selected,p=S.provinces[n],intel=S.v41.intel[n];if(action==='travel'){travelProvince(n);S.v41.mapVisits++;S.v41.cityInfluence[n]+=3;toast(`Travel route plotted to ${PMETA[n].capital}.`);return}if(action==='survey'){if(!spend(1))return;intel.surveyed=true;S.influence+=2;S.v41.cityInfluence[n]+=1;addLog(`Agents complete a political survey of ${n}.`)}else if(action==='rally'){if(!spend(2))return;let ok=check('rhetoric',10+Math.round(p.unrest/15));p.loyalty+=ok?5:-1;p.unrest+=ok?-3:2;S.popularity+=ok?3:-1;S.v41.cityInfluence[n]+=ok?4:0;addLog(`${ok?'A packed':'A difficult'} address in ${PMETA[n].capital}.`)}else if(action==='civic'){investProvince(n,'loyalty');return}else if(action==='economy'){investProvince(n,'economy');return}else if(action==='military'){investProvince(n,'military');return}['loyalty','unrest','economy','military'].forEach(k=>p[k]=clamp(p[k],0,100));render()}
function supportState(i,total,yes){return i<yes?'support':(i<total?'oppose':'neutral')}
function senateGraphical(){let a=S.v4.agenda,total=28,yes=Math.max(0,Math.min(total,Math.round((a.support/Math.max(1,a.support+a.opposition))*total)));let supportPct=Math.round(a.support/Math.max(1,a.support+a.opposition)*100);let rows=[10,10,8];let seatHTML='';let idx=0;rows.forEach((count,row)=>{let cls='r'+(row+1);let seats='';for(let i=0;i<count;i++,idx++){seats+=`<button type="button" class="v44-seat ${supportState(idx,total,yes)}" data-senate-seat="${idx}" aria-label="Inspect senator ${idx+1}"></button>`}seatHTML+=`<div class="v44-ring-seats ${cls}">${seats}</div>`});return `${v44Hero('Curia Live','Interactive Senate Chamber','Vote pressure and chamber blocs are shown visually so you can read the chamber at a glance.')}<div class="v44-scene"><div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Current motion</div><h3>${a.title}</h3><p>${a.text}</p></div></div><div class="v44-senate-wrap"><div class="v44-chamber"><div class="v44-vote-overlay"><div class="v44-score"><span>Projected support</span><b>${supportPct}%</b></div><div class="v44-score"><span>Time remaining</span><b>${a.days}d</b></div><div class="v44-score"><span>Political capital</span><b>${S.v4.politicalCapital}</b></div></div>${seatHTML}<div class="v44-floor"></div><div class="v44-rostrum">ROSTRUM</div></div></div><div class="v44-legend-row"><span class="v44-pill"><i style="background:#5ca77b"></i>support</span><span class="v44-pill"><i style="background:#a14f47"></i>oppose</span><span class="v44-pill"><i style="background:#7a6947"></i>undecided</span></div></div><div class="v44-panel pad"><div class="v44-bill-card"><h3 style="margin-top:0">Vote Control</h3><div class="v44-bill-meta"><div><span>Support</span><b>${a.support}</b></div><div><span>Opposition</span><b>${a.opposition}</b></div><div><span>Leverage</span><b>${S.v4.politicalCapital}</b></div></div><div class="v44-action-grid" style="padding:0"><button class="v44-tile" onclick="v4Lobby('support')"><span>🤝</span><b>Build Coalition</b><small>win support</small></button><button class="v44-tile" onclick="v4Lobby('oppose')"><span>🪤</span><b>Disrupt Rivals</b><small>split opposition</small></button><button class="v44-tile" onclick="v4ForceVote()"><span>🗳️</span><b>Force Vote</b><small>call the chamber</small></button><button class="v44-tile" onclick="committee()"><span>📜</span><b>Committee</b><small>prepare text</small></button></div><div style="margin-top:12px">${(S.v3?.houses||[]).slice(0,5).map(h=>`<div class="stat"><span>House ${h.name}</span><b>${h.loyalty}</b></div>`).join('')}</div></div></div></div>`}
function warGraphical(){let fronts=S.v3.fronts;return `${v44Hero('Strategic Command','Visual War Theatre','Fronts are now placed on a cleaner operational board with at-a-glance logistics and command actions.')}<div class="v44-scene"><div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Operational board</div><h3>The Living Fronts</h3><p>Supply routes, pressure points and command nodes give a clearer read of the strategic picture.</p></div></div><div class="v44-war-wrap"><div class="v44-war-map"><div class="v44-route-line" style="left:14%;top:63%;width:25%;transform:rotate(-10deg)"></div><div class="v44-route-line" style="left:47%;top:56%;width:28%;transform:rotate(6deg)"></div><div class="v44-front-line" style="left:45%;top:27%;width:${22+fronts[0].enemy/6}%;transform:rotate(9deg)"></div><div class="v44-front-line" style="left:63%;top:24%;width:${18+fronts[1].enemy/7}%;transform:rotate(-7deg)"></div><button class="v44-front-node" data-front-node="0" style="left:42%;top:34%" aria-label="Inspect northern front"></button><button class="v44-front-node" data-front-node="0" style="left:58%;top:41%" aria-label="Inspect northern supply node"></button><button class="v44-front-node" data-front-node="1" style="left:73%;top:31%" aria-label="Inspect eastern front"></button><button class="v44-front-node" data-front-node="1" style="left:82%;top:28%" aria-label="Inspect eastern supply node"></button><div style="position:absolute;left:13%;bottom:18%;color:#e9d9b4;font-size:12px">Nova Roma</div><div style="position:absolute;left:44%;top:16%;color:#e9d9b4;font-size:12px">Northern Frontier</div><div style="position:absolute;left:75%;top:13%;color:#e9d9b4;font-size:12px">Eastern Frontier</div></div><div class="v44-war-grid">${fronts.map((f,i)=>`<div class="v44-front-card"><h4>${f.name}</h4><div class="small">Commander ${f.commander} • ${f.status}</div><div class="v44-bars"><div class="line"><span>Readiness</span><div class="track"><span class="fill cyan" style="width:${f.roman}%"></span></div><b>${f.roman}</b></div><div class="line"><span>Enemy</span><div class="track"><span class="fill red" style="width:${f.enemy}%"></span></div><b>${f.enemy}</b></div><div class="line"><span>Supply</span><div class="track"><span class="fill gold" style="width:${f.supply}%"></span></div><b>${f.supply}</b></div></div><div class="v44-action-grid" style="grid-template-columns:repeat(3,1fr);padding:0"><button class="v44-tile" onclick="v4Front(${i},'rotate')"><span>🔄</span><b>Rotate</b><small>new commander</small></button><button class="v44-tile" onclick="v4Front(${i},'fortify')"><span>🧱</span><b>Fortify</b><small>improve line</small></button><button class="v44-tile" onclick="v4Front(${i},'offensive')"><span>⚔️</span><b>Offensive</b><small>press attack</small></button></div></div>`).join('')}</div></div></div><div class="v44-panel pad"><h3 style="margin-top:0">Campaign Actions</h3><div class="v44-action-grid" style="padding:0"><button class="v44-tile" onclick="v3Operation(0,'recon')"><span>👁️</span><b>Recon</b><small>north intel</small></button><button class="v44-tile" onclick="v3Operation(0,'supply')"><span>📦</span><b>Resupply</b><small>north line</small></button><button class="v44-tile" onclick="v3Operation(1,'recon')"><span>🛰️</span><b>Eastern Intel</b><small>scan east</small></button><button class="v44-tile" onclick="v3Operation(1,'supply')"><span>🚚</span><b>Supply East</b><small>secure route</small></button></div><div class="v44-callout"><b>Strategic note:</b> Higher supply and morale improve your chances when you launch a grand offensive. Rotate commanders when readiness stalls.</div></div></div>`}
function capitalGraphical(){return `${v44Hero('Nova Roma','Imperial Capital','Core daily actions are now arranged as a visual command deck rather than a long text list.')}<div class="v44-panel"><div class="v44-head"><div><div class="eyebrow">Daily command</div><h3>Capital Districts</h3><p>Choose a district action to shape influence, skill growth, security and palace standing.</p></div></div><div class="v44-action-grid"><button class="v44-tile" onclick="speech()"><span>📣</span><b>Forum</b><small>address the crowd</small></button><button class="v44-tile" onclick="train('learning')"><span>📚</span><b>Archives</b><small>study policy</small></button><button class="v44-tile" onclick="train('strength')"><span>⚔️</span><b>Praetorium</b><small>train arms</small></button><button class="v44-tile" onclick="salon()"><span>🍷</span><b>Salon</b><small>network with elites</small></button><button class="v44-tile" onclick="investigate()"><span>🕵️</span><b>Inquiry</b><small>hunt corruption</small></button><button class="v44-tile" onclick="fight()"><span>🛡️</span><b>Subura</b><small>street patrol</small></button><button class="v44-tile" onclick="palace()"><span>👑</span><b>Palace</b><small>seek favor</small></button><button class="v44-tile" onclick="temple()"><span>🏺</span><b>Temple</b><small>consult the rites</small></button></div><div class="v44-legend-row"><span class="v44-pill"><i style="background:#f0cd78"></i>${origins[S.origin].name}</span><span class="v44-pill"><i style="background:#79ebff"></i>level ${S.level}</span><span class="v44-pill"><i style="background:#67c18c"></i>office ${offices[S.office].name}</span></div></div>`}
const oldTabs=window.renderTabs;window.renderTabs=function(){if(typeof S!=='undefined'&&S)ensureMapState();let tabs=$('tabs');tabs.className='tabs v43-dock v44-dock';tabs.innerHTML=tabMarkup()};
const oldHeader=window.renderHeader;window.renderHeader=function(){oldHeader();let wrap=document.getElementById('hud44');if(!wrap){wrap=document.createElement('div');wrap.id='hud44';let target=document.getElementById('game');target.insertBefore(wrap,target.children[2]||target.firstChild)}wrap.innerHTML=(typeof S!=='undefined'&&S)?uiHud():''};
const oldView=window.renderView;window.renderView=function(){if(currentTab==='Provinces'){$('view').innerHTML=renderProvinceView();requestAnimationFrame(bindProvinceView)}else if(currentTab==='Senate'){$('view').innerHTML=senateGraphical();requestAnimationFrame(()=>{iconizeButtons();bindV441Objects()})}else if(currentTab==='War Room'){$('view').innerHTML=warGraphical();requestAnimationFrame(()=>{iconizeButtons();bindV441Objects()})}else if(currentTab==='Capital'){$('view').innerHTML=capitalGraphical();requestAnimationFrame(iconizeButtons)}else{oldView();requestAnimationFrame(iconizeButtons)}};
const oldRender=window.render;window.render=function(){oldRender();requestAnimationFrame(iconizeButtons)};
function boot44(){document.title='Imperium Aeternum IV — Graphical Command 4.4';let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.4 — Aligned UI & Proper Imperial Atlas';if(typeof S!=='undefined'&&S)requestAnimationFrame(iconizeButtons)}
addEventListener('DOMContentLoaded',boot44);if(document.readyState!=='loading')setTimeout(boot44,0);
})();
</script>


<style id="v441-style">

.v44-seat{min-height:0;padding:0;cursor:pointer}.v44-seat:hover,.v44-seat:focus{outline:2px solid #f1d487;transform:translateY(-2px)}
.v44-front-node{min-height:0;padding:0;border:2px solid #5c4823;cursor:pointer}.v44-front-node:hover,.v44-front-node:focus{outline:2px solid #fff0a8;transform:scale(1.18)}
.v441-object{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}.v441-object-art{position:relative;min-height:190px;border:1px solid #76603f;border-radius:18px;background:radial-gradient(circle at 50% 35%,#59402b,#17110e 72%);overflow:hidden;display:grid;place-items:center}.v441-object-art .big{font-size:72px;filter:drop-shadow(0 12px 12px #0007)}.v441-object-art:before,.v441-object-art:after{content:'';position:absolute;border:1px solid #d3ad6266;border-radius:50%}.v441-object-art:before{width:140px;height:140px}.v441-object-art:after{width:100px;height:100px}.v441-object h2{margin-top:0}.v441-object-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.v441-object-grid div{padding:9px;border:1px solid #4d4032;border-radius:12px;background:#15100d}.v441-object-grid b{display:block;color:#f0cd78;font-size:16px}.v441-object-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.v441-object-actions button{display:flex;align-items:center;justify-content:center;gap:7px}
.v41-hotspot{min-width:76px}.v41-hotspot:after{content:'›';margin-left:5px;color:#f1ce79}.v441-inspect-tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;padding:5px 9px;border-radius:999px;background:#071019c9;border:1px solid #5f7887;color:#dbe9e8;font-size:10px;pointer-events:none}
@media(max-width:650px){.v441-object{grid-template-columns:1fr}.v441-object-art{min-height:130px}.v441-object-art .big{font-size:56px}}
</style>
<script id="v441-script">
(()=>{
'use strict';
const OBJECTS={
 FORUM:{icon:'📣',title:'Forum Maximus',type:'Public district',desc:'The political heart of Nova Roma. Crowds, media feeds and faction organizers react to every address.',stats:()=>[['Popularity',S.popularity],['Rhetoric',S.rhetoric],['Influence',S.influence]],actions:[['📣 Address Crowd','speech()'],['👥 Campaign Rally',"campaignAction('rally')"]]},
 ARCHIVES:{icon:'📚',title:'Imperial Archives',type:'Research facility',desc:'Two millennia of laws, censuses and classified state records are stored beneath the capital.',stats:()=>[['Learning',S.learning],['Research',S.research.length],['Energy',S.energy]],actions:[['📚 Study Records',"train('learning')"],['🕵️ Investigate','investigate()']]},
 PALACE:{icon:'👑',title:'Palatine Palace',type:'Imperial residence',desc:'The Emperor’s household, ministers and Praetorian gatekeepers control access to the highest offices.',stats:()=>[['Imperial favor',S.favor],['Office',offices[S.office].name],['Scandal',S.scandal]],actions:[['👑 Request Audience','palace()'],['🍷 Host Salon','salon()']]},
 SUBURA:{icon:'🛡️',title:'The Subura',type:'Urban district',desc:'Dense streets, criminal networks and populist clubs make this district dangerous and politically valuable.',stats:()=>[['Strength',S.strength],['Corruption',S.corruption],['Enemies defeated',S.enemiesDefeated]],actions:[['🛡️ Patrol Streets','fight()'],['🕵️ Investigate','investigate()']]},
 ROSTRUM:{icon:'🗳️',title:'Senate Rostrum',type:'Legislative object',desc:'The speaking platform from which senators make motions, challenge rivals and demand votes.',stats:()=>[['Political capital',S.v4?.politicalCapital||0],['Influence',S.influence],['Bills passed',S.billsPassed]],actions:[['🤝 Build Coalition',"v4Lobby('support')"],['🗳️ Force Vote','v4ForceVote()']]},
 GALLERY:{icon:'👥',title:'Voting Gallery',type:'Senate chamber',desc:'Clerks and faction whips track every senator’s likely vote from the gallery above the chamber.',stats:()=>[['Senators',S.senators.length],['Faction support',Math.round(Object.values(S.factions).reduce((a,b)=>a+b,0)/6)],['Influence',S.influence]],actions:[['🗳️ Whip Votes','whipVotes()'],['🗡️ Expose Rival','exposeRival()']]},
 CLERKS:{icon:'📜',title:'Senate Clerks',type:'Administrative office',desc:'The clerks control amendments, committee schedules and the exact language of legislation.',stats:()=>[['Learning',S.learning],['Rhetoric',S.rhetoric],['Energy',S.energy]],actions:[['📜 Committee Work','committee()'],['📚 Study Law',"train('learning')"]]},
 COMMAND:{icon:'⚔️',title:'Central Command Table',type:'Military command object',desc:'A live operational table combines drone reconnaissance, logistics and orders from every active front.',stats:()=>[['Military',S.world.military],['Strategy',S.strategy],['Active fronts',S.v3?.fronts?.length||0]],actions:[['⚔️ Northern Offensive',"v4Front(0,'offensive')"],['🛰️ Recon North',"v3Operation(0,'recon')"]]},
 'FRONT I':{icon:'🛡️',title:'Northern Frontier',type:'Military front',desc:'The fortified northern line protects the industrial provinces and the approaches to Italia.',stats:()=>frontStats(0),actions:[['🧱 Fortify',"v4Front(0,'fortify')"],['👁️ Recon',"v3Operation(0,'recon')"]]},
 'FRONT II':{icon:'⚔️',title:'Eastern Frontier',type:'Military front',desc:'The eastern theatre spans Armenia, Syria and Mesopotamia, where supply routes are long and exposed.',stats:()=>frontStats(1),actions:[['🧱 Fortify',"v4Front(1,'fortify')"],['📦 Supply',"v3Operation(1,'supply')"]]},
 LAB:{icon:'⚙️',title:'Quantum Engineering Laboratory',type:'Research facility',desc:'Engineers combine Roman infrastructure doctrine with quantum materials and autonomous construction.',stats:()=>[['Learning',S.learning],['Technologies',S.research.length],['Economy',S.world.economy]],actions:[['⚙️ Research Aqueducts',"research('Quantum Aqueducts')"],['📚 Train Learning',"train('learning')"]]},
 MEDIA:{icon:'📡',title:'Imperial Media Center',type:'Campaign facility',desc:'Broadcast studios and analytics teams shape provincial opinion and election momentum.',stats:()=>[['Popularity',S.popularity],['Charisma',S.charisma],['Election day',S.electionDay]],actions:[['📡 Buy Ads',"campaignAction('ads')"],['🎤 Debate',"campaignAction('debate')"]]},
 ACCOUNTS:{icon:'💰',title:'Household Accounts',type:'Estate object',desc:'Your estate’s ledgers reveal income, debts, patronage obligations and opportunities for political spending.',stats:()=>[['Denarii',S.money],['Businesses',S.businesses.length],['Corruption',S.corruption]],actions:[['🍷 Host Salon','salon()'],['💰 Estate Screen',"tab('Estate')"]]},
 GARDENS:{icon:'🏺',title:'Estate Gardens',type:'Private district',desc:'A discreet place for rituals, private negotiations and meetings away from Senate surveillance.',stats:()=>[['Piety',S.piety],['Favor',S.favor],['Companions',S.companions.length]],actions:[['🏺 Consult Rites','temple()'],['🍷 Private Salon','salon()']]}
};
function frontStats(i){let f=S.v3?.fronts?.[i]||{};return [['Readiness',f.roman||0],['Enemy pressure',f.enemy||0],['Supply',f.supply||0],['Commander',f.commander||'Unassigned']]}
function statHtml(stats){return `<div class="v441-object-grid">${stats.map(([k,v])=>`<div><span class="small">${k}</span><b>${v}</b></div>`).join('')}</div>`}
function actionHtml(actions){return `<div class="v441-object-actions">${actions.map(([label,code])=>`<button class="btn" data-object-action="${encodeURIComponent(code)}">${label}</button>`).join('')}</div>`}
function showObject(key){let o=OBJECTS[key];if(!o)return;modal(`<div class="v441-object"><div class="v441-object-art"><span class="big">${o.icon}</span></div><div><div class="v4-kicker">${o.type}</div><h2>${o.title}</h2><p>${o.desc}</p>${statHtml(o.stats())}${actionHtml(o.actions)}<button class="btn" style="width:100%;margin-top:9px" onclick="closeModal()">Close inspection</button></div></div>`);document.querySelectorAll('[data-object-action]').forEach(b=>b.addEventListener('click',()=>{let code=decodeURIComponent(b.dataset.objectAction);closeModal();try{Function(code)()}catch(e){console.error(e);toast('That action is currently unavailable.')}}))}

<script id="v442-script">
(()=>{
'use strict';
let switching=false;
function hasGame(){return typeof S!=='undefined'&&!!S}
function initializeGraphicalState(){
 if(!hasGame())return;
 S.v41=S.v41||{mapVisits:0,cityInfluence:{},routes:[],intel:{},lastProvince:'Italia'};
 const names=typeof provinces!=='undefined'?provinces:Object.keys(S.provinces||{});
 names.forEach(n=>{
  if(S.v41.cityInfluence[n]==null)S.v41.cityInfluence[n]=0;
  if(!S.v41.intel[n])S.v41.intel[n]={surveyed:false,rumor:'No verified political report has been filed.'};
 });
}
function safeRender(){
 if(!hasGame())return;
 initializeGraphicalState();
 try{render()}catch(err){
  console.error('Graphical screen render failed:',err);
  const view=document.getElementById('view');
  if(view)view.innerHTML=`<div class="v442-error"><b>This screen encountered a rendering error.</b><div class="small">${String(err&&err.message||err)}</div><button class="btn" type="button" data-v442-home>Return to Capital</button></div>`;
 }
}
window.tab=function(name){
 if(!hasGame()||switching)return;
 switching=true;
 currentTab=name;
 try{
  if(typeof window.setGraphicScene==='function')window.setGraphicScene(name);
  safeRender();
  requestAnimationFrame(()=>{
   if(typeof window.setGraphicScene==='function')window.setGraphicScene(name);
   const canvas=document.getElementById('worldCanvas');
   if(canvas){canvas.style.display='block';canvas.style.visibility='visible';canvas.style.opacity='1'}
  });
 }finally{switching=false}
};
function runNamed(name,args=[]){
 const fn=window[name];
 if(typeof fn!=='function'){toast(`${name} is unavailable on this save.`);return}
 try{fn(...args)}catch(err){console.error(name,err);toast('That action could not be completed.')}
}
function bindDirectControls(root=document){
 root.querySelectorAll('.v43-tab').forEach(btn=>{
  if(btn.dataset.v442Bound)return;btn.dataset.v442Bound='1';
  const label=btn.querySelector('.lbl')?.textContent?.trim();
  const match={Capital:'Capital',Senate:'Senate',Council:'Imperial Council',Map:'Provinces',Campaign:'Campaign',War:'War Room',Diplomacy:'Diplomacy',Estate:'Estate',Research:'Research',People:'People',Chronicle:'Chronicle'}[label];
  if(match)btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();window.tab(match)},true);
 });
 root.querySelectorAll('[data-v442-home]').forEach(btn=>btn.addEventListener('click',()=>window.tab('Capital')));
}
const actionMap={
 Forum:()=>runNamed('speech'),Archives:()=>runNamed('train',['learning']),Praetorium:()=>runNamed('train',['strength']),Salon:()=>runNamed('salon'),Inquiry:()=>runNamed('investigate'),Subura:()=>runNamed('fight'),Palace:()=>runNamed('palace'),Temple:()=>runNamed('temple'),
 'Build Coalition':()=>runNamed('v4Lobby',['support']),'Disrupt Rivals':()=>runNamed('v4Lobby',['oppose']),'Force Vote':()=>runNamed('v4ForceVote'),Committee:()=>runNamed('committee'),
 Rotate:(b)=>runNamed('v4Front',[Math.max(0,Array.from(document.querySelectorAll('.v44-front-card')).indexOf(b.closest('.v44-front-card'))),'rotate']),Fortify:(b)=>runNamed('v4Front',[Math.max(0,Array.from(document.querySelectorAll('.v44-front-card')).indexOf(b.closest('.v44-front-card'))),'fortify']),Offensive:(b)=>runNamed('v4Front',[Math.max(0,Array.from(document.querySelectorAll('.v44-front-card')).indexOf(b.closest('.v44-front-card'))),'offensive'])
};
function bindTiles(root=document){
 root.querySelectorAll('.v44-tile').forEach(btn=>{
  if(btn.dataset.v442Tile)return;btn.dataset.v442Tile='1';
  const label=btn.querySelector('b')?.textContent?.trim();
  if(actionMap[label])btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();actionMap[label](btn)},true);
 });
}
const observer=new MutationObserver(()=>{bindDirectControls();bindTiles()});
observer.observe(document.documentElement,{subtree:true,childList:true});
const originalRender=window.render;
window.render=function(){initializeGraphicalState();try{return originalRender()}finally{requestAnimationFrame(()=>{bindDirectControls();bindTiles()})}};
function boot(){initializeGraphicalState();bindDirectControls();bindTiles();let sub=document.querySelector('.subtitle');if(sub)sub.textContent='Graphical Command • Version 4.4.3 — Renderer & Research Feed Repair'}
addEventListener('DOMContentLoaded',boot);if(document.readyState!=='loading')setTimeout(boot,0);
})();
</script>

<script id="v45-rpg-stability">
(()=>{
'use strict';
const V45_TABS=[
 ['Capital','🏛','Capital'],['Character','👤','Character'],['Senate','🗳️','Senate'],['Imperial Council','👑','Council'],['Provinces','🗺️','Map'],['Campaign','📣','Campaign'],['War Room','⚔️','War'],['Military','🛡','Military'],['Diplomacy','🤝','Diplomacy'],['Missions','✦','Missions'],['Estate','🏡','Estate'],['Research','⚙️','Research'],['People','👥','People'],['Legacy','🏅','Legacy'],['Journal','📖','Journal'],['Chronicle','📜','Chronicle']
];
const V45_ITEMS=[
 {id:'laurel',name:'Campaign Laurel',slot:'Head',cost:260,stat:'charisma',bonus:1,desc:'A recognizable public image for rallies and elections.'},
 {id:'cuirass',name:'Officer Cuirass',slot:'Body',cost:420,stat:'endurance',bonus:1,desc:'Armor fitted for public danger and frontier reviews.'},
 {id:'codex',name:'Annotated Law Codex',slot:'Hand',cost:360,stat:'rhetoric',bonus:1,desc:'Prepared arguments and precedents for Senate maneuvers.'},
 {id:'seal',name:'Household Signet',slot:'Ring',cost:520,stat:'influence',bonus:8,desc:'An old contract seal that opens private doors.'},
 {id:'lens',name:'Augur Lens',slot:'Relic',cost:680,stat:'learning',bonus:1,desc:'A ritual data lens used by temple archivists.'}
];
const V45_TRAITS=[
 {id:'orator',name:'Forum Orator',desc:'Win three public actions. Speeches and rallies gain extra impact.',test:s=>(s.v45?.counts?.speech||0)+(s.v45?.counts?.rally||0)>=3},
 {id:'administrator',name:'Provincial Administrator',desc:'Resolve four province orders. Investments reduce more unrest.',test:s=>(s.v45?.counts?.provinceOrder||0)>=4},
 {id:'duelist',name:'Subura Veteran',desc:'Defeat five enemies. Combat starts with a guard reserve.',test:s=>s.enemiesDefeated>=5},
 {id:'scholar',name:'Imperial Scholar',desc:'Complete four research projects. Study becomes more reliable.',test:s=>s.research.length>=4},
 {id:'magnate',name:'Estate Magnate',desc:'Own three businesses. Daily income grants influence.',test:s=>s.businesses.length>=3}
];
function own(o,k,d){if(o[k]==null)o[k]=d;return o[k]}
function clampAll(){
 if(!S)return;
 ['money','influence','popularity','favor','piety','corruption','scandal','provinceSupport'].forEach(k=>{S[k]=Math.max(0,Math.round(Number(S[k])||0))});
 ['hp','maxHp','energy','maxEnergy','xp','xpNext','level','office','day','year','businessSlots','billsPassed','electionsWon','enemiesDefeated'].forEach(k=>{S[k]=Math.max(k==='office'?0:1,Math.round(Number(S[k])||0))});
 S.office=Math.min(S.office,offices.length-1);S.hp=Math.min(S.hp,S.maxHp);S.energy=Math.min(S.energy,S.maxEnergy);
 Object.keys(S.world||{}).forEach(k=>S.world[k]=clamp(Math.round(Number(S.world[k])||0),0,1000));
 Object.values(S.factions||{}).forEach(()=>{});Object.keys(S.factions||{}).forEach(k=>S.factions[k]=clamp(Math.round(Number(S.factions[k])||0),0,100));
 Object.values(S.provinces||{}).forEach(p=>['loyalty','economy','unrest','military'].forEach(k=>p[k]=clamp(Math.round(Number(p[k])||0),0,100)));
 if(S.v3?.fronts)S.v3.fronts.forEach(f=>['roman','enemy','supply','morale'].forEach(k=>f[k]=clamp(Math.round(Number(f[k])||0),0,100)));
}
function ensureRpg(){
 if(!S)return;
 S.version='5.0.3';
 S.world=S.world||{treasury:500,economy:50,stability:50,military:45};
 S.factions=S.factions||{Traditionalists:35,Imperialists:30,Merchants:35,Populists:30,Technocrats:30,Provincials:25};
 S.provinces=S.provinces||{};provinces.forEach(n=>{S.provinces[n]=S.provinces[n]||{loyalty:45,economy:45,unrest:12,military:35,governor:'Acting Prefect'}});
 ['businesses','companions','inventory','research','visited','passed','sideQuests','senators','log'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 if(!S.senators.length&&typeof makeSenators==='function')S.senators=makeSenators();
 S.flags=S.flags||{};S.v41=S.v41||{mapVisits:0,cityInfluence:{},routes:[],intel:{},lastProvince:'Italia'};
 provinces.forEach(n=>{own(S.v41.cityInfluence,n,0);if(!S.v41.intel[n])S.v41.intel[n]={surveyed:false,rumor:'No verified political report has been filed.'}});
 S.v45=S.v45||{equipment:{Head:null,Body:null,Hand:null,Ring:null,Relic:null},owned:[],traits:[],journal:[],counts:{},lastRecovery:0};
 ['Head','Body','Hand','Ring','Relic'].forEach(k=>own(S.v45.equipment,k,null));
 own(S.v45,'owned',[]);own(S.v45,'traits',[]);own(S.v45,'journal',[]);own(S.v45,'counts',{});
 if(S.v3?.fronts)S.v3.fronts.forEach((f,i)=>{own(f,'supply',50);own(f,'morale',50);own(f,'veterans',0);own(f,'commander',['Aelia Varro','Marcus Drusus','Titus Solon','Livia Corvinus'][i%4])});
 V45_TRAITS.forEach(t=>{if(!S.v45.traits.includes(t.id)&&t.test(S)){S.v45.traits.push(t.id);journal(`Trait unlocked: ${t.name}`);toast(`Trait unlocked: ${t.name}`)}});
 clampAll();
}
function journal(text){if(!S?.v45)return;S.v45.journal.unshift({day:S.day,year:S.year,text});S.v45.journal=S.v45.journal.slice(0,50)}
function count(k,n=1){ensureRpg();S.v45.counts[k]=(S.v45.counts[k]||0)+n}
function hasTrait(id){return !!S?.v45?.traits?.includes(id)}
function itemById(id){return V45_ITEMS.find(i=>i.id===id)}
function equippedBonus(stat){if(!S?.v45)return 0;return Object.values(S.v45.equipment).reduce((a,id)=>{let it=itemById(id);return a+(it&&it.stat===stat?it.bonus:0)},0)}
function canPay(energy=0,money=0,influence=0){ensureRpg();if(S.energy<energy){toast(`Need ${energy} energy.`);return false}if(S.money<money){toast(`Need ${money} denarii.`);return false}if(S.influence<influence){toast(`Need ${influence} influence.`);return false}return true}
function spendExact(energy=0,money=0,influence=0){if(!canPay(energy,money,influence))return false;S.energy-=energy;S.money-=money;S.influence-=influence;return true}
function renderTabs45(){ensureRpg();let hasCouncil=typeof window.ensure4==='function'||!!S.v4;let html=V45_TABS.filter(t=>hasCouncil||t[0]!=='Imperial Council').map(([key,ico,label])=>`<button type="button" class="v43-tab ${currentTab===key?'active':''}" data-tab="${key}" onclick="tab('${key}')"><span class="ico">${ico}</span><span class="lbl">${label}</span>${currentTab===key?'<span class="dot"></span>':''}</button>`).join('');let tabs=$('tabs');tabs.className='tabs v43-dock v44-dock';tabs.innerHTML=html}
function drawPlayer(cv){
 if(!cv||!S)return;let x=cv.getContext('2d'),w=cv.width,h=cv.height,seed=0;for(let c of S.name)seed=(seed*33+c.charCodeAt(0))|0;let r=n=>Math.abs(Math.sin(seed+n)*9999)%1;
 x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#263445');g.addColorStop(1,'#120d0b');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle='#d8b188';x.beginPath();x.arc(w*.5,h*.29,w*.15,0,7);x.fill();x.fillStyle=r(2)>.5?'#2a211d':'#d7c0a0';x.beginPath();x.arc(w*.5,h*.23,w*.16,Math.PI,0);x.fill();
 x.fillStyle='#17110e';x.fillRect(w*.44,h*.29,3,3);x.fillRect(w*.55,h*.29,3,3);x.strokeStyle='#844637';x.beginPath();x.moveTo(w*.44,h*.37);x.quadraticCurveTo(w*.5,h*.4,w*.56,h*.37);x.stroke();
 x.fillStyle='#efe5d1';x.beginPath();x.moveTo(w*.23,h);x.lineTo(w*.34,h*.5);x.lineTo(w*.66,h*.5);x.lineTo(w*.77,h);x.fill();x.strokeStyle='#9b3738';x.lineWidth=8;x.beginPath();x.moveTo(w*.36,h*.52);x.lineTo(w*.62,h);x.stroke();
 if(S.v45?.equipment.Head){x.strokeStyle='#f0cd78';x.lineWidth=4;x.beginPath();x.arc(w*.5,h*.18,w*.17,Math.PI*1.05,Math.PI*1.95);x.stroke()}
 if(S.v45?.equipment.Body){x.fillStyle='#a98a57aa';x.fillRect(w*.36,h*.57,w*.28,h*.24)}
 if(S.v45?.equipment.Hand){x.fillStyle='#e8d49b';x.fillRect(w*.69,h*.61,8,h*.26)}
 if(S.v45?.equipment.Ring){x.strokeStyle='#74dfe8';x.lineWidth=3;x.beginPath();x.arc(w*.31,h*.72,5,0,7);x.stroke()}
 if(S.v45?.equipment.Relic){x.fillStyle='#8cf0ff';x.beginPath();x.arc(w*.5,h*.46,6+Math.sin(performance.now()/400)*2,0,7);x.fill()}
}
function characterView(){
 ensureRpg();let slots=['Head','Body','Hand','Ring','Relic'];let traits=V45_TRAITS.map(t=>`<div class="v45-trait ${hasTrait(t.id)?'':'achievement locked'}"><b>${hasTrait(t.id)?'Unlocked':'Locked'}: ${t.name}</b><div class="small">${t.desc}</div></div>`).join('');

window.buyItem=function(id){ensureRpg();let it=itemById(id);if(!it)return;if(S.v45.owned.includes(id))return equipItem(id);if(!spendExact(0,it.cost,0))return;S.v45.owned.push(id);journal(`Purchased ${it.name}.`);equipItem(id)}

window.v3Operation=function(i,type){if(typeof ensure==='function')ensure();ensureRpg();let f=S.v3?.fronts?.[i];if(!f)return toast('That front is unavailable.');let money=type==='supply'?240:0;if(!spendExact(2,money,0))return;if(type==='recon'){let ok=check('learning',13);f.enemy=Math.max(0,f.enemy-(ok?8:2));S.influence+=ok?5:0;if(typeof chronicle==='function')chronicle(`${f.name}: intelligence teams expose enemy deployments.`)}if(type==='supply'){f.roman=Math.min(100,f.roman+12+Math.floor(S.strategy/3));f.supply=clamp((f.supply||50)+8,0,100);if(typeof chronicle==='function')chronicle(`${f.name}: fresh supplies reach the frontier.`)}if(type==='attack'){let chance=50+(f.roman-f.enemy)+S.strategy*2+(S.v3.doctrine==='The Iron Limes'?12:0);if(roll(100)<chance){f.enemy=Math.max(0,f.enemy-18-roll(15));f.roman=Math.max(8,f.roman-roll(7));S.influence+=15;S.v3.legacy+=3;if(f.enemy<=5){S.v3.warsWon++;f.enemy=24+roll(25);S.money+=700;S.favor+=8}}else{f.roman=Math.max(5,f.roman-10-roll(12));S.popularity-=3;S.world.stability-=2}}render()}

 G.rings.forEach(r=>{r.r+=dt*.00055;r.a-=dt*.0007;ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle=p[1];ctx.lineWidth=2*G.dpr;ctx.beginPath();ctx.arc(r.x*w,r.y*h,r.r*Math.min(w,h),0,Math.PI*2);ctx.stroke()});
 G.rings=G.rings.filter(r=>r.a>0);
 ctx.restore();
}
function draw(now){
 if(!G.ctx||!fit())return;
 const ctx=G.ctx,w=G.w,h=G.h,p=palette(),dt=Math.min(48,now-(G.last||now));G.last=now;G.t=now/1000;
 ctx.clearRect(0,0,w,h);
 let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'rgba(9,18,29,.82)');sky.addColorStop(.46,'rgba(6,10,17,.10)');sky.addColorStop(1,'rgba(1,3,5,.82)');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 ctx.save();ctx.globalCompositeOperation='lighter';let glow=ctx.createRadialGradient(w*(.18+G.mouse[0]*.18),h*.12,0,w*(.18+G.mouse[0]*.18),h*.12,w*.62);glow.addColorStop(0,p[0]+'45');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);let red=ctx.createRadialGradient(w*.78,h*.24,0,w*.78,h*.24,w*.48);red.addColorStop(0,p[2]+'30');red.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=red;ctx.fillRect(0,0,w,h);ctx.restore();
 drawSkyline(ctx,w,h,p);drawGrid(ctx,w,h,p);drawParticles(ctx,w,h,p,dt);drawRings(ctx,w,h,p,dt);
 ctx.save();ctx.globalAlpha=.28;ctx.strokeStyle=p[1];ctx.lineWidth=1.3*G.dpr;for(let i=0;i<7;i++){let y=h*(.22+i*.052)+Math.sin(G.t+i)*5*G.dpr;ctx.beginPath();ctx.moveTo(w*.08,y);ctx.bezierCurveTo(w*.32,y-h*.09,w*.66,y+h*.09,w*.92,y);ctx.stroke()}ctx.restore();
}
function frame(now){if(!G.ready)return;draw(now||performance.now());requestAnimationFrame(frame)}
function updateScene(name){G.scene=name||safeScene();if(G.ready){seed();pulse(.5,.58)}}
function enhance(){
 const on=desktop();document.body.classList.toggle('desktop-nextgen',on);if(on)init();
 if(typeof S!=='undefined'&&S)S.version='5.0.3';
 const sub=document.querySelector('.subtitle');if(sub)sub.textContent='Version 5 • RPG Overhaul';
 const title=document.querySelector('.title');if(title)title.textContent='IMPERIUM AETERNUM V';
 document.querySelectorAll('.v44-map,.v44-chamber,.v44-war-map,.v45-portrait').forEach(el=>{el.dataset.v47='1'});
}
const prevScene=window.setGraphicScene;window.setGraphicScene=function(name){if(prevScene)prevScene(name);updateScene(name);requestAnimationFrame(enhance)};
const prevTab=window.tab;window.tab=function(name){prevTab(name);updateScene(name);requestAnimationFrame(enhance)};
const prevRender=window.render;window.render=function(){let out=prevRender();requestAnimationFrame(enhance);return out};
function boot(){enhance();updateScene(safeScene())}
addEventListener('DOMContentLoaded',boot);if(document.readyState!=='loading')setTimeout(boot,0);
})();
</script>

<script id="v48-dynamic-gameplay">
(()=>{
'use strict';
const V48_TABS=[
 ['Capital','🏛','Capital'],['Situation','◈','Situation'],['Intrigue','🕶','Intrigue'],['Character','👤','Character'],['Senate','🗳️','Senate'],['Imperial Council','👑','Council'],['Provinces','🗺️','Map'],['Campaign','📣','Campaign'],['War Room','⚔️','War'],['Military','🛡','Military'],['Diplomacy','🤝','Diplomacy'],['Missions','✦','Missions'],['Estate','🏡','Estate'],['Research','⚙️','Research'],['People','👥','People'],['Legacy','🏅','Legacy'],['Journal','📖','Journal'],['Chronicle','📜','Chronicle']
];
const CRISES=[
 {id:'grain',title:'Grain Algorithm Failure',domain:'welfare',targets:['Aegyptus','Africa','Syria'],stat:'unrest',text:'Automated grain routing is starving dense districts while warehouses remain full.'},
 {id:'frontier',title:'Frontier Command Fracture',domain:'military',targets:['Germania','Dacia','Armenia'],stat:'military',text:'Competing commanders are hiding losses and hoarding drone reserves.'},
 {id:'currency',title:'Provincial Currency Panic',domain:'economy',targets:['Hispania','Gallia','Britannia'],stat:'economy',text:'Local banks are freezing credit after rumors of an imperial tax seizure.'},
 {id:'cult',title:'Unauthorized Oracle Cult',domain:'faith',targets:['Graecia','Italia','Arabia'],stat:'loyalty',text:'A machine-augur movement is pulling citizens away from official temples.'},
 {id:'data',title:'Civic Data Plague',domain:'science',targets:['Italia','Graecia','Aegyptus'],stat:'stability',text:'Identity ledgers are producing false debts, duplicate citizens and illegal arrests.'},
 {id:'succession',title:'Succession Rumor Cascade',domain:'palace',targets:['Italia','Syria','Mauretania'],stat:'loyalty',text:'Encrypted palace gossip is being traded like currency across the senatorial class.'}
];
const RIVAL_NAMES=['Lucius Aurelian','Vibia Scaevola','Gaius Lentulus','Junia Sabina','Decimus Corvinus','Aelia Drusilla','Tiberius Naso','Marcia Falco'];
const SCHEMES=['funding opposition media','buying provincial governors','burying Senate evidence','feeding rumors to the palace','hoarding military contracts','sponsoring street agitators'];
const PROJECTS={
 aqueduct:{name:'Quantum Aqueduct',cost:420,stat:'economy',desc:'Raises economy and lowers unrest through infrastructure.'},
 tribunal:{name:'Circuit Tribunal',cost:340,stat:'loyalty',desc:'Improves loyalty and reduces corruption pressure.'},
 limes:{name:'Drone Limes',cost:520,stat:'military',desc:'Improves military readiness and slows frontier crises.'},
 academy:{name:'Provincial Academy',cost:460,stat:'learning',desc:'Improves economy and creates research momentum.'}
};
const AMBITIONS=[
 {id:'stabilizer',name:'Stabilizer of the Imperium',desc:'Resolve 3 crises and keep average unrest below 35.',progress:s=>Math.min(100,Math.round((s.v48.resolved/3)*70+(avgProvince('unrest')<35?30:0))),done:s=>s.v48.resolved>=3&&avgProvince('unrest')<35,reward:s=>{s.influence+=55;s.maxEnergy+=1;s.energy=s.maxEnergy}},
 {id:'architect',name:'Provincial Architect',desc:'Complete 4 province projects and raise average loyalty to 55.',progress:s=>Math.min(100,Math.round((s.v48.completedProjects/4)*70+(avgProvince('loyalty')>=55?30:0))),done:s=>s.v48.completedProjects>=4&&avgProvince('loyalty')>=55,reward:s=>{s.money+=900;s.provinceSupport+=18}},
 {id:'spymaster',name:'Master of Intrigue',desc:'Turn or neutralize 3 rival schemes.',progress:s=>Math.min(100,Math.round((s.v48.rivalsHandled/3)*100)),done:s=>s.v48.rivalsHandled>=3,reward:s=>{s.influence+=45;s.scandal=Math.max(0,s.scandal-5);s.v48.intel+=25}},
 {id:'reformer',name:'Constitutional Reformer',desc:'Pass 5 laws while corruption is below 42.',progress:s=>Math.min(100,Math.round((s.billsPassed/5)*70+(s.corruption<42?30:0))),done:s=>s.billsPassed>=5&&s.corruption<42,reward:s=>{s.factions.Populists=clamp(s.factions.Populists+12,0,100);s.factions.Technocrats=clamp(s.factions.Technocrats+12,0,100);s.influence+=35}},
 {id:'war',name:'War Statesman',desc:'Raise military to 72 and defeat 8 enemies or win 2 wars.',progress:s=>Math.min(100,Math.round((s.world.military/72)*55+Math.min(45,Math.max(s.enemiesDefeated/8,(s.v3?.warsWon||0)/2)*45))),done:s=>s.world.military>=72&&(s.enemiesDefeated>=8||(s.v3?.warsWon||0)>=2),reward:s=>{s.favor+=22;s.world.military=clamp(s.world.military+8,0,100);s.strategy+=1}}
];
function pay(c){
 ensure48();let miss=[];
 if((S.energy||0)<(c.energy||0))miss.push(`${c.energy} energy`);
 if((S.money||0)<(c.money||0))miss.push(`${c.money} denarii`);
 if((S.influence||0)<(c.influence||0))miss.push(`${c.influence} influence`);
 if((S.favor||0)<(c.favor||0))miss.push(`${c.favor} imperial favor`);
 if((S.v48.intel||0)<(c.intel||0))miss.push(`${c.intel} intelligence`);
 if(miss.length){toast(`Need ${miss.join(', ')}.`);return false}
 S.energy-=c.energy||0;S.money-=c.money||0;S.influence-=c.influence||0;S.favor-=c.favor||0;S.v48.intel-=c.intel||0;return true;
}
function cost(c){let a=[];if(c.energy)a.push(`${c.energy} EN`);if(c.money)a.push(`${c.money} D`);if(c.influence)a.push(`${c.influence} INF`);if(c.favor)a.push(`${c.favor} FAV`);if(c.intel)a.push(`${c.intel} INT`);return a.length?`<span class="v46-cost">${a.join(' • ')}</span>`:''}
function pct(n){return clamp(Math.round(n),0,100)}
function choose(a){return a[Math.floor(Math.random()*a.length)]}
function ensure48(){
 if(typeof S==='undefined'||!S)return;
 S.version='5.0.3';
 S.v48=S.v48||{crises:[],rivals:[],directive:'balanced',resolved:0,failed:0,intel:10,cohesion:50,lastTick:S.day,history:[],provinceProjects:{},completedProjects:0,rivalsHandled:0,ambition:null,completedAmbitions:[],campaignIntel:null,marketShield:0,researchMomentum:0};
 if(!Array.isArray(S.v48.crises))S.v48.crises=[];
 if(!Array.isArray(S.v48.rivals))S.v48.rivals=[];
 if(!S.v48.rivals.length)makeRivals();
 if(!S.v48.directive)S.v48.directive='balanced';
 provinces.forEach(n=>{if(!S.v48.provinceProjects[n])S.v48.provinceProjects[n]=null});
 if(!S.v48.crises.length)spawnCrisis();
 clamp48();
}
function clamp48(){
 if(!S?.v48)return;
 S.v48.intel=clamp(Math.round(S.v48.intel||0),0,100);S.v48.cohesion=clamp(Math.round(S.v48.cohesion||0),0,100);
 ['money','influence','favor','popularity','scandal','corruption','provinceSupport'].forEach(k=>S[k]=Math.max(0,Math.round(S[k]||0)));
 Object.keys(S.world||{}).forEach(k=>S.world[k]=clamp(Math.round(S.world[k]||0),0,1000));
 Object.values(S.provinces||{}).forEach(p=>['loyalty','economy','unrest','military'].forEach(k=>p[k]=clamp(Math.round(p[k]||0),0,100)));
 Object.keys(S.factions||{}).forEach(k=>S.factions[k]=clamp(Math.round(S.factions[k]||0),0,100));
}
function makeRivals(){
 let factions=Object.keys(S.factions||{}),names=RIVAL_NAMES.slice().sort(()=>Math.random()-.5);
 S.v48.rivals=names.slice(0,4).map((name,i)=>({name,faction:factions[i%factions.length]||'Traditionalists',scheme:SCHEMES[i%SCHEMES.length],progress:18+roll(24),threat:3+roll(5),relation:-20+roll(35),leverage:roll(14),status:'active'}));
}
function spawnCrisis(){
 if(!S?.v48||S.v48.crises.length>=3)return;
 let used=new Set(S.v48.crises.map(c=>c.id)),pool=CRISES.filter(c=>!used.has(c.id));if(!pool.length)pool=CRISES;
 let t=choose(pool),target=choose(t.targets),key=`${t.id}-${S.day}-${roll(999)}`;
 S.v48.crises.push({key,id:t.id,title:t.title,domain:t.domain,target,stat:t.stat,text:t.text,clock:6+roll(7),heat:20+roll(28),progress:0,severity:1+roll(3)});
 addLog(`<span class="gold">New imperial crisis:</span> ${t.title} in ${target}.`);
}
function directiveText(){
 return {balanced:'No empire-wide posture is overriding local judgment.',relief:'Daily treasury spending lowers unrest but slows income.',security:'Military posture improves control but reduces popularity.',markets:'Market liberalization raises revenue and corruption pressure.',courts:'Anti-corruption courts reduce corruption but consume influence.'}[S.v48.directive]||'';
}
function applyDirective(){
 let d=S.v48.directive;
 if(d==='relief'){S.money=Math.max(0,S.money-55);Object.values(S.provinces).forEach(p=>p.unrest-=1);S.popularity+=1}
 if(d==='security'){S.world.military+=1;S.favor+=1;S.popularity=Math.max(0,S.popularity-1);Object.values(S.provinces).forEach(p=>p.unrest=Math.max(0,p.unrest-1))}
 if(d==='markets'){S.money+=45+roll(55);S.world.economy+=1;S.corruption+=Math.random()<.55?1:0}
 if(d==='courts'){S.influence=Math.max(0,S.influence-1);S.corruption=Math.max(0,S.corruption-1);if(Math.random()<.18)S.scandal+=1}
}
function tick48(){
 if(!S?.v48||S.v48.lastTick===S.day)return;
 let days=clamp(S.day-S.v48.lastTick,1,14);S.v48.lastTick=S.day;
 for(let i=0;i<days;i++)tickOne48();
 clamp48();checkAmbition();
}
function tickOne48(){
 applyDirective();
 if(S.v48.crises.length<2&&Math.random()<.36)spawnCrisis();
 S.v48.crises.slice().forEach(c=>{
  c.clock--;c.heat=clamp(c.heat+roll(7)-3-c.progress/40,0,100);
  let p=S.provinces[c.target];if(p&&c.heat>55){p.unrest+=1;if(c.stat==='economy')p.economy-=1;if(c.stat==='military')p.military-=1;if(c.stat==='loyalty')p.loyalty-=1}
  if(c.clock<=0)failCrisis(c.key);
 });
 S.v48.rivals.forEach(r=>{
  if(r.status!=='active')return;
  r.progress+=Math.max(1,Math.round(r.threat/2))+roll(3)+(r.relation<-15?1:0);
  if(r.progress>=100)fireScheme(r);
 });
 Object.entries(S.v48.provinceProjects).forEach(([n,p])=>{
  if(!p)return;let prov=S.provinces[n],boost=5+Math.floor((prov.economy+prov.loyalty)/45)+(S.v48.researchMomentum>0?2:0);p.progress+=boost;p.days++;
  if(p.progress>=100)completeProject(n);
 });
 if(S.v48.marketShield>0)S.v48.marketShield--;
 if(S.v48.researchMomentum>0)S.v48.researchMomentum--;
}
function fireScheme(r){
 r.progress=18+roll(18);r.threat=clamp(r.threat+1,1,10);
 let f=S.factions[r.faction];if(f!=null)S.factions[r.faction]=clamp(f-4-roll(4),0,100);
 S.scandal+=1;S.influence=Math.max(0,S.influence-2);
 let n=choose(provinces),p=S.provinces[n];if(p)p.unrest+=2;
 addLog(`<span class="bad-text">${r.name}'s scheme lands:</span> ${r.scheme}.`);
}
function resolveCrisis(key){
 let i=S.v48.crises.findIndex(c=>c.key===key);if(i<0)return;let c=S.v48.crises.splice(i,1)[0],p=S.provinces[c.target];
 S.v48.resolved++;S.v48.history.unshift({day:S.day,text:`Resolved ${c.title} in ${c.target}`});S.v48.history=S.v48.history.slice(0,20);
 if(p){p.loyalty+=4;p.unrest-=6;if(c.stat==='economy')p.economy+=4;if(c.stat==='military')p.military+=4}
 S.influence+=8+c.severity*3;S.popularity+=2;S.v48.cohesion+=3;gainXP(25+c.severity*8);
 addLog(`<span class="good-text">${c.title} is resolved in ${c.target}.</span>`);
}
function failCrisis(key){
 let i=S.v48.crises.findIndex(c=>c.key===key);if(i<0)return;let c=S.v48.crises.splice(i,1)[0],p=S.provinces[c.target];
 S.v48.failed++;S.v48.history.unshift({day:S.day,text:`Failed ${c.title} in ${c.target}`});S.v48.history=S.v48.history.slice(0,20);
 if(p){p.unrest+=10+c.severity*2;p.loyalty-=5;if(c.stat==='economy')p.economy-=8;if(c.stat==='military')p.military-=8}
 S.world.stability-=4+c.severity;S.scandal+=2;S.v48.cohesion-=6;
 addLog(`<span class="bad-text">${c.title} boils over in ${c.target}.</span>`);
}
function checkRoll(stat,diff){return typeof check==='function'?check(stat,diff):roll(12)+(S[stat]||0)>=diff}
window.v48CrisisAction=function(key,type){
 ensure48();let c=S.v48.crises.find(x=>x.key===key);if(!c)return toast('That crisis has already moved on.');
 let ok=false,gain=0;
 if(type==='relief'){if(!pay({energy:1,money:220}))return;gain=16+roll(14);S.popularity+=1}
 if(type==='negotiate'){if(!pay({energy:2,influence:6}))return;ok=checkRoll('charisma',12+c.severity);gain=ok?22+roll(14):7+roll(7);S.v48.intel+=ok?4:1}
 if(type==='deploy'){if(!pay({energy:1,favor:4}))return;ok=checkRoll('strategy',12+c.severity);gain=ok?20+roll(15):7+roll(8);S.favor+=ok?1:0;S.scandal+=ok?0:1}
 if(type==='investigate'){if(!pay({energy:1,intel:8}))return;ok=checkRoll('learning',11+c.severity);gain=ok?24+roll(14):8;S.corruption=Math.max(0,S.corruption-(ok?1:0))}
 c.progress=clamp(c.progress+gain,0,100);c.heat=clamp(c.heat-Math.round(gain/2),0,100);addLog(`Crisis action advances ${c.title}: +${gain} control.`);
 if(c.progress>=100)resolveCrisis(key);render();
};
window.v48SetDirective=function(id){ensure48();S.v48.directive=id;addLog(`Imperial directive set: ${id}.`);render()};
window.v48Scan=function(){ensure48();if(!pay({energy:1}))return;S.v48.intel=clamp(S.v48.intel+8+roll(6),0,100);if(S.v48.crises.length<2)spawnCrisis();addLog('The risk council updates the imperial threat ledger.');render()};
window.v48RivalAction=function(i,type){
 ensure48();let r=S.v48.rivals[i];if(!r)return;let ok=false;
 if(type==='monitor'){if(!pay({energy:1}))return;ok=checkRoll('learning',11+r.threat);r.leverage+=ok?8:4;r.progress=Math.max(0,r.progress-(ok?14:6));S.v48.intel+=ok?4:1}
 if(type==='deal'){if(!pay({money:160,influence:4}))return;r.relation+=12;r.threat=clamp(r.threat-1,1,10);r.progress=Math.max(0,r.progress-8)}
 if(type==='expose'){if(!pay({energy:2,intel:12}))return;ok=checkRoll('rhetoric',12+r.threat);if(ok){r.progress=0;r.threat=clamp(r.threat-2,1,10);r.leverage=0;S.influence+=6;if(!r.handled){S.v48.rivalsHandled++;r.handled=true}}else{S.scandal+=4;r.relation-=12}}
 if(type==='turn'){if(!pay({influence:12}))return;ok=(r.leverage+S.charisma+roll(12))>26;if(ok){r.status='turned';r.progress=0;r.threat=1;S.factions[r.faction]=clamp(S.factions[r.faction]+8,0,100);if(!r.handled){S.v48.rivalsHandled++;r.handled=true}addLog(`${r.name} becomes an uneasy ally.`)}else{r.relation-=10;r.threat=clamp(r.threat+1,1,10);S.scandal+=1}}
 if(r.status==='active')addLog(`Intrigue order against ${r.name}: ${type}.`);
 render();
};
window.v48ChooseAmbition=function(id){ensure48();if(S.v48.ambition)return toast('Complete or abandon the current ambition first.');if(S.v48.completedAmbitions.includes(id))return toast('That ambition is already complete.');S.v48.ambition=id;addLog(`New personal ambition: ${AMBITIONS.find(a=>a.id===id)?.name||id}.`);render()};
window.v48AbandonAmbition=function(){ensure48();if(!S.v48.ambition)return;S.scandal+=1;S.v48.ambition=null;addLog('A public ambition is quietly abandoned.');render()};
function checkAmbition(){
 let a=AMBITIONS.find(x=>x.id===S.v48.ambition);if(!a||!a.done(S))return;
 a.reward(S);S.v48.completedAmbitions.push(a.id);S.v48.ambition=null;addLog(`<span class="good-text">Ambition complete:</span> ${a.name}.`);toast(`Ambition complete: ${a.name}`);

 if(S.v5){S.v5.perks=uniq(S.v5.perks);S.v5.completedQuests=uniq(S.v5.completedQuests);S.v5.items=Array.isArray(S.v5.items)?S.v5.items:[];S.v5.quests=Array.isArray(S.v5.quests)?S.v5.quests:[];S.v5.wounds=Array.isArray(S.v5.wounds)?S.v5.wounds:[];S.v5.reputation=S.v5.reputation||{Merciful:0,Ruthless:0,Reformer:0,Traditional:0};Object.keys(S.v5.reputation).forEach(k=>S.v5.reputation[k]=clamp(Math.round(num(S.v5.reputation[k])),-100,100));S.v5.perkPoints=Math.max(0,Math.round(num(S.v5.perkPoints)));S.v5.renown=Math.max(0,Math.round(num(S.v5.renown)));S.v5.companionRoles=S.v5.companionRoles||{};S.v5.explored=S.v5.explored||{};S.v5.quests.forEach(q=>{if(!['offered','active','complete','abandoned'].includes(q.status))q.status='offered';if(!q.reward)q.reward={money:200,influence:8,xp:35,renown:10}});S.v5.quests=S.v5.quests.filter(q=>q&&q.id).slice(-14);S.v5.wounds=S.v5.wounds.filter(w=>w&&Number(w.days)>0)}
