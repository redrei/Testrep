['Address the Forum','speech()'],['Study in the Archives','train(\'learning\')'],['Train with Praetorians','train(\'strength\')'],['Host a Salon','salon()'],['Investigate Corruption','investigate()'],['Patrol the Subura','fight()'],['Visit the Palace','palace()'],['Temple Consultation','temple()']].map(x=>`<button class="btn" onclick="${x[1]}">${x[0]}</button>`).join('')}</div><h3 style="margin-top:14px">World Condition</h3>${statRows([['Treasury',S.world.treasury],['Economy',S.world.economy],['Stability',S.world.stability],['Military',S.world.military]])}`}
function viewSenate(){let available=bills.filter(b=>!S.passed.includes(b.name));return `<h2>Imperial Senate</h2><p class="small">Coalitions shift daily. A bill needs influence, faction support and a persuasive floor strategy.</p><div class="cards">${available.slice(0,6).map((b,i)=>`<div class="card"><b>${b.name}</b><div class="small">${b.text}</div><div class="small">Cost ${b.cost} influence • Difficulty ${b.diff} • ${b.bloc}</div><button class="btn primary" style="width:100%;margin-top:8px" onclick="propose('${jsq(b.name)}')">Propose Bill</button></div>`).join('')||'<p>All major statutes have been considered.</p>'}</div><h3 style="margin-top:14px">Senate Maneuvers</h3><div class="actions"><button class="btn" onclick="lobby()">Lobby a Faction</button><button class="btn" onclick="whipVotes()">Whip Votes</button><button class="btn" onclick="exposeRival()">Expose a Rival</button><button class="btn" onclick="committee()">Committee Work</button></div>`}

function renderLog(){$('log').innerHTML=S.log.slice().reverse().map(x=>`<div class="log-entry">${x}</div>`).join('')}
function addLog(x){S.log.push(`<span class="small">Day ${S.day}</span> — ${x}`);if(S.log.length>150)S.log.shift()}
function spend(e=1){if(S.energy<e){toast('Not enough energy.');return false}S.energy-=e;return true}function gainXP(n){S.xp+=n;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=Math.floor(S.xpNext*1.32);S.maxHp+=10;S.maxEnergy++;S.hp=S.maxHp;S.energy=S.maxEnergy;S.influence+=8;addLog(`<span class="good-text">Level ${S.level} reached.</span>`);modal(`<h2>Level ${S.level}</h2><p>Choose an attribute to increase.</p><div class="choices">${['strength','endurance','charisma','rhetoric','strategy','learning'].map(x=>`<button class="choice" onclick="raise('${x}')">${cap(x)}</button>`).join('')}</div>`)}}
function raise(x){S[x]++;closeModal();render()}function check(stat,diff){let bonus=S.companions.filter(c=>c.stat===stat).reduce((a,c)=>a+c.bonus,0);return roll(12)+S[stat]+bonus>=diff}
function speech(){if(!spend(2))return;let ok=check('rhetoric',11);S.popularity+=ok?8:-2;S.influence+=ok?6:1;gainXP(ok?25:10);addLog(ok?'Your Forum speech becomes the day’s defining broadcast.':'Hecklers and a faulty sound system blunt your speech.');render()}
function train(stat){if(!spend(2))return;let cost=80;if(S.money<cost)return toast('You need 80 denarii.');S.money-=cost;if(Math.random()<.55)S[stat]++;gainXP(18);addLog(`You spend the afternoon training ${stat}.`);render()}
function salon(){if(!spend(2)||S.money<180)return toast('Requires 2 energy and 180 denarii.');S.money-=180;S.influence+=10;Object.keys(S.factions).forEach(k=>S.factions[k]+=roll(3));addLog('A carefully seated dinner produces several useful alliances.');render()}
function investigate(){if(!spend(2))return;let ok=check('learning',12);if(ok){S.corruption=clamp(S.corruption-5,0,100);S.influence+=7;gainXP(28);addLog('You obtain verified contracts linking officials to shell companies.')}else{S.scandal+=2;addLog('Your inquiry leaks before the evidence is secure.')}render()}
function fight(){if(!spend(2))return;startCombat(pick(['Subura Enforcer','Corporate Saboteur','Extremist Cell','Rogue Praetorian']),75+S.level*15,8+S.level*2)}
function palace(){if(!spend(2))return;let ok=check('charisma',13);S.favor+=ok?9:-2;S.influence+=ok?5:0;addLog(ok?'The Emperor grants a private audience and remembers your proposal.':'You remain outside the inner chamber while rivals pass freely.');render()}
function temple(){if(!spend(1)||S.money<60)return toast('Requires 1 energy and 60 denarii.');S.money-=60;S.piety+=5;S.hp=clamp(S.hp+20,0,S.maxHp);addLog('The augurs offer ambiguous comfort and excellent intelligence.');render()}
function propose(name){let b=bills.find(x=>x.name===name);if(!b||S.influence<b.cost)return toast('Insufficient influence.');if(!spend(2))return;S.influence-=b.cost;let support=S.factions[b.bloc]/12+S.rhetoric+S.charisma/2+roll(12);let passed=support>=b.diff+8;if(passed){S.passed.push(b.name);S.billsPassed++;S.factions[b.bloc]=clamp(S.factions[b.bloc]+10,0,100);applyEffects(b.effects);S.influence+=10;gainXP(45+b.diff*2);addLog(`<span class="good-text">${b.name} passes the Senate.</span>`)}else{S.factions[b.bloc]=clamp(S.factions[b.bloc]-3,0,100);S.popularity-=2;addLog(`<span class="bad-text">${b.name} fails after a bitter division.</span>`)}render()}
function applyEffects(e){Object.entries(e).forEach(([k,v])=>{if(k==='treasury'||k==='economy'||k==='stability'||k==='military')S.world[k]+=v;else if(k==='provinceLoyalty')provinces.forEach(n=>S.provinces[n].loyalty=clamp(S.provinces[n].loyalty+v,0,100));else S[k]=(S[k]||0)+v})}
function lobby(){if(!spend(1)||S.money<100)return toast('Requires 1 energy and 100 denarii.');let keys=Object.keys(S.factions);modal(`<h2>Lobby a Faction</h2><div class="choices">${keys.map(k=>`<button class="choice" onclick="doLobby('${k}')">${factionData[k].icon} ${k}<br><small>${factionData[k].ideal}</small></button>`).join('')}</div>`)}function doLobby(k){S.money-=100;S.factions[k]=clamp(S.factions[k]+7+roll(5),0,100);S.influence+=3;closeModal();addLog(`${k} leaders accept your assurances.`);render()}
function whipVotes(){if(!spend(2))return;let ok=check('strategy',13);S.influence+=ok?12:2;S.scandal+=ok?0:2;addLog(ok?'You map favors and absences with ruthless precision.':'Several promised votes evaporate overnight.');render()}
function exposeRival(){if(!spend(2))return;let n=pick(S.senators);let ok=check('learning',14);if(ok){n.power=Math.max(2,n.power-8);S.influence+=9;S.corruption-=2;addLog(`Evidence forces ${n.name} from a committee chair.`)}else{S.scandal+=5;S.influence-=3;addLog(`${n.name} turns your accusation into a scandal against you.`)}render()}
function committee(){if(!spend(1))return;S.influence+=4+roll(4);gainXP(15);addLog('Unglamorous committee work gives you mastery of the next agenda.');render()}
function province(n){let p=S.provinces[n];modal(`<h2>${n}</h2><p>${provinceFlavors[n]}</p>${statRows([['Governor',p.governor],['Loyalty',p.loyalty],['Unrest',p.unrest],['Economy',p.economy],['Military',p.military]])}<div class="choices"><button class="choice" onclick="travelProvince('${n}')">Travel and Meet Governor</button><button class="choice" onclick="investProvince('${n}','economy')">Invest 250 in Economy</button><button class="choice" onclick="investProvince('${n}','loyalty')">Fund Civic Program</button><button class="choice" onclick="investProvince('${n}','military')">Inspect Defenses</button><button class="choice" onclick="closeModal()">Close</button></div>`)}
function travelProvince(n){if(!spend(2)){closeModal();return}if(!S.visited.includes(n))S.visited.push(n);let p=S.provinces[n],ok=check('charisma',12+p.unrest/15);if(ok){p.loyalty+=6;S.provinceSupport+=4;S.influence+=5;addLog(`Your tour of ${n} produces cheering crowds and a governor’s endorsement.`)}else{p.unrest+=4;addLog(`Protests dominate your difficult visit to ${n}.`)}closeModal();render()}
function investProvince(n,type){if(S.money<250)return toast('You need 250 denarii.');S.money-=250;let p=S.provinces[n];if(type==='economy')p.economy+=7;if(type==='loyalty'){p.loyalty+=6;p.unrest-=3}if(type==='military')p.military+=7;closeModal();addLog(`Your household finances a ${type} initiative in ${n}.`);render()}
function campaignScore(){return clamp(Math.round((S.popularity*.45+S.influence*.12+avgFaction()*.25+S.provinceSupport*.15-S.scandal*.8)),1,95)}
function campaignAction(type){let costs={rally:[2,120],ads:[1,300],debate:[2,80],donors:[1,0]}[type];if(!spend(costs[0])||S.money<costs[1])return toast('Insufficient energy or money.');S.money-=costs[1];if(type==='rally'){S.popularity+=5+roll(5);S.provinceSupport+=2}if(type==='ads'){S.popularity+=4+roll(6);S.scandal+=Math.random()<.2?2:0}if(type==='debate'){let ok=check('rhetoric',14);S.popularity+=ok?9:-4;S.influence+=ok?6:0}if(type==='donors'){S.money+=150+roll(300);S.scandal+=roll(3)}addLog(`Your campaign conducts a ${type} operation.`);render()}
function buyBusiness(name){let b=businesses.find(x=>x.name===name);if(S.businesses.length>=S.businessSlots)return toast('No available business slot.');if(S.money<b.cost)return toast('Insufficient denarii.');S.money-=b.cost;S.businesses.push({...b});addLog(`Your household acquires ${b.name}.`);render()}
function sellBusiness(i){let b=S.businesses.splice(i,1)[0];S.money+=Math.floor(b.cost*.62);addLog(`${b.name} is sold to a rival consortium.`);render()}
function research(name){let t=techs.find(x=>x[0]===name);if(S.money<t[1])return toast('Insufficient denarii.');if(!spend(2))return;S.money-=t[1];S.research.push(name);if(t[2]==='economy')S.world.economy+=8;else if(t[2]==='military')S.world.military+=8;else if(t[2]==='stability')S.world.stability+=8;else if(t[2]==='health')S.maxHp+=25;else if(t[2]==='loyalty')provinces.forEach(n=>S.provinces[n].loyalty+=4);else if(t[2]==='story')S.flags.engineFound=true;else S[t[2]]++;gainXP(60);addLog(`${name} enters imperial service.`);render()}
function recruit(name){let c=companions.find(x=>x.name===name);if(!spend(1))return;let cost=150+S.companions.length*100;if(S.money<cost)return toast(`Recruitment requires ${cost} denarii.`);let ok=check('charisma',11+S.companions.length);if(ok){S.money-=cost;S.companions.push({...c});addLog(`${c.name} joins your household as ${c.role}.`)}else addLog(`${c.name} politely refuses your offer.`);render()}
function senatorMeeting(name){let n=S.senators.find(x=>x.name===name);if(!spend(1))return;modal(`<h2>${n.name}</h2><p>${n.faction} senator. Power ${n.power}. Relationship ${n.relation}.</p><div class="choices"><button class="choice" onclick="dealSenator('${jsq(name)}','favor')">Offer a Political Favor</button><button class="choice" onclick="dealSenator('${jsq(name)}','gift')">Send a 120 Denarii Gift</button><button class="choice" onclick="dealSenator('${jsq(name)}','threat')">Apply Pressure</button><button class="choice" onclick="closeModal()">Leave</button></div>`)}
function dealSenator(name,type){let n=S.senators.find(x=>x.name===name);if(type==='favor'){n.relation+=8;S.influence-=2}if(type==='gift'){if(S.money<120)return toast('Insufficient denarii.');S.money-=120;n.relation+=n.greed>50?12:5}if(type==='threat'){let ok=check('strategy',14);n.relation+=ok?-3:-12;S.influence+=ok?7:-3;S.scandal+=ok?1:4}closeModal();render()}
function startCombat(name,hp,dmg){S.combat={name,hp,maxHp:hp,dmg,guard:0};combatModal()}
function combatModal(){let c=S.combat;if(!c)return;modal(`<h2>Street Conflict</h2><div class="combat-grid"><div><div class="portrait">🦅</div><b>${esc(S.name)}</b><div>HP ${S.hp}/${S.maxHp}</div></div><div><div class="portrait">⚔️</div><b>${c.name}</b><div>HP ${c.hp}/${c.maxHp}</div></div></div><div class="choices" style="margin-top:12px"><button class="choice" onclick="combat('strike')">Gladius Strike</button><button class="choice" onclick="combat('speech')">Commanding Rebuke</button><button class="choice" onclick="combat('guard')">Guard</button><button class="choice" onclick="combat('drone')">Call Security Drone (75)</button></div>`)}
function combat(a){let c=S.combat,damage=0;if(a==='strike')damage=roll(8)+S.strength*2;if(a==='speech')damage=roll(6)+S.rhetoric*2;if(a==='guard')c.guard=8+S.endurance;if(a==='drone'){if(S.money<75)return toast('Need 75 denarii.');S.money-=75;damage=18+S.strategy*2}c.hp-=damage;if(c.hp<=0){S.enemiesDefeated++;S.money+=90+roll(110);S.influence+=4;gainXP(45);addLog(`<span class="good-text">${c.name} is defeated.</span>`);S.combat=null;closeModal();render();return}let hit=Math.max(1,c.dmg+roll(7)-c.guard-S.endurance);c.guard=0;S.hp-=hit;if(S.hp<=0){S.hp=Math.ceil(S.maxHp*.35);S.money=Math.max(0,S.money-150);S.scandal+=3;addLog('You awaken under guard in a private clinic.');S.combat=null;closeModal();endDay();return}combatModal()}
function endDay(){if(!S)return;let income=S.businesses.reduce((a,b)=>a+b.income,0);S.money+=income;S.day++;if(S.day%365===0)S.year++;S.energy=S.maxEnergy;S.hp=clamp(S.hp+15+S.endurance,0,S.maxHp);simulateWorld();if(S.day>=S.electionDay)runElection();if(S.day%7===0)weeklyEvent();if(S.day%10===0)generateSideQuests();checkOffice();addLog(`The day closes. Household income: ${income} denarii.`);render()}
function simulateWorld(){provinces.forEach(n=>{let p=S.provinces[n];p.economy=clamp(p.economy+roll(5)-3+Math.sign(S.world.economy-50),0,100);p.unrest=clamp(p.unrest+roll(5)-3+(p.loyalty<35?2:0),0,100);p.loyalty=clamp(p.loyalty+roll(3)-2-(p.unrest>60?2:0),0,100)});S.world.economy=clamp(S.world.economy+roll(5)-3,0,100);S.world.stability=clamp(S.world.stability+roll(5)-3-(avgProvince('unrest')>45?2:0),0,100);S.corruption=clamp(S.corruption+(Math.random()<.45?1:0)-(S.research.includes('Political Analytics')?1:0),0,100);S.senators.forEach(n=>{n.relation=clamp(n.relation+roll(3)-2,-50,100);if(Math.random()<.03)n.power=clamp(n.power+roll(7)-3,1,60)})}
function weeklyEvent(){let events=[
['A grain shortage strikes Aegyptus.',()=>{S.provinces.Aegyptus.unrest+=10;S.popularity-=3}],['A technology boom lifts provincial markets.',()=>{S.world.economy+=6;provinces.forEach(n=>S.provinces[n].economy+=2)}],['A Praetorian scandal reaches the news networks.',()=>{S.favor-=4;S.corruption+=3}],['Flooding damages the lower districts of Rome.',()=>{S.world.treasury-=80;S.popularity-=2}],['A successful frontier operation restores confidence.',()=>{S.world.military+=5;S.favor+=4}],['A constitutional protest fills the Forum.',()=>{S.world.stability-=5;S.popularity+=2}],['A foreign cyberattack disrupts the imperial grid.',()=>{S.world.stability-=6;S.money=Math.max(0,S.money-100)}],['An archaeological signal is detected beneath Vaticanus.',()=>{S.flags.engineRumor=true;S.learning+=1}]];let e=pick(events);e[1]();addLog(`<span class="gold">Imperial Event:</span> ${e[0]}`);if(S.world.stability<30&&!S.flags.civilCrisis){S.flags.civilCrisis=true;addLog('<span class="bad-text">The Empire enters a civil crisis.</span>')}}
function runElection(){let score=campaignScore(),win=roll(100)<=score;if(win){S.electionsWon++;S.influence+=40;S.popularity+=8;S.scandal=Math.max(0,S.scandal-4);addLog(`<span class="good-text">You win the election with ${score}% projected support.</span>`)}else{S.popularity-=5;S.influence-=8;addLog(`<span class="bad-text">You lose the election despite ${score}% projected support.</span>`)}S.electionDay=S.day+40+roll(20)}
function checkOffice(){if(S.office<7&&S.influence>=offices[S.office+1].req&&(S.office<3||S.electionsWon>=1)){S.office++;S.businessSlots++;S.maxEnergy++;S.favor+=8;addLog(`<span class="gold">You rise to the office of ${offices[S.office].name}.</span>`)}}
function checkStory(){if(!S||S.flags.victory)return;let q=story[S.storyIndex];if(q&&q.check(S)){q.reward(S);S.storyIndex++;addLog(`<span class="good-text">Chapter completed: ${q.title}.</span>`);if(S.storyIndex>=story.length){S.flags.victory=true;ending()}else toast('New story chapter unlocked')}}
function ending(){modal(`<h2>ROME WITHOUT END</h2><p>After ${S.day} days, ${esc(S.name)} has reshaped the Eternal Empire. Provinces, armies, markets and citizens now carry the consequences of every bargain.</p><p>Your final office: <b>${offices[S.office].name}</b>. Laws passed: ${S.billsPassed}. Elections won: ${S.electionsWon}.</p><button class="choice" onclick="closeModal()">Continue the Dynasty</button>`)}
function generateSideQuests(){const list=[['Bread and Bandwidth','Raise popularity by campaigning in the Forum.'],['A Governor’s Request','Visit and stabilize a province with high unrest.'],['The Missing Ledger','Investigate corruption in Nova Roma.'],['Industrial Patronage','Acquire or expand a business.'],['The Veteran’s Petition','Improve Imperialist faction support.'],['The Scholar’s Cipher','Complete a research project.']];S.sideQuests=Array.from({length:3},()=>{let q=pick(list);return{title:q[0],text:q[1],reward:120+roll(260)}})}
function avgProvince(k){return provinces.reduce((a,n)=>a+S.provinces[n][k],0)/provinces.length}function avgFaction(){return Object.values(S.factions).reduce((a,b)=>a+b,0)/6}
function showSystem(){modal(`<h2>System</h2><div class="choices"><button class="choice" onclick="saveGame();closeModal()">Save Game</button><button class="choice" onclick="loadGame()">Load Saved Game</button><button class="choice" onclick="exportSave()">Export Save Text</button><button class="choice" onclick="resetGame()">Start New Dynasty</button><button class="choice" onclick="closeModal()">Close</button></div>`)}
function saveGame(){localStorage.setItem('imperiumV2',JSON.stringify(S));toast('Game saved.')}function autoSave(){if(S)localStorage.setItem('imperiumV2',JSON.stringify(S))}function loadGame(){try{let x=JSON.parse(localStorage.getItem('imperiumV2'));if(!x)throw 0;S=x;$('creation').classList.remove('active');$('game').classList.add('active');closeModal();render();toast('Save loaded.')}catch(e){toast('No valid save found.')}}function resetGame(){if(confirm('Erase this dynasty and begin again?')){localStorage.removeItem('imperiumV2');location.reload()}}function exportSave(){let text=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal(`<h2>Export Save</h2><p class="small">Copy and store this text.</p><textarea style="width:100%;height:180px">${text}</textarea><button class="choice" onclick="closeModal()">Close</button>`)}
function modal(x){$('modalCard').innerHTML=x;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function toast(x){let t=$('toast');t.textContent=x;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}function jsq(x){return x.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
$('startBtn').addEventListener('click',start);$('continueBtn').addEventListener('click',loadGame);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});initOrigins();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).then(reg=>{if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready. Reopen the app to apply it.');});});}).catch(err=>console.warn('Service worker registration failed:',err)));}
</script>
<style>
.v253-banner{border:1px solid #8e714e;background:#1b2418;border-radius:10px;padding:9px 11px;margin-bottom:10px}.progress-ring{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:3px solid var(--gold);font-weight:bold}.risk-low{color:#9bd18f}.risk-med{color:#e0b867}.risk-high{color:#e99484}.mission{border-left:4px solid #416b8b}.achievement.locked{opacity:.5;filter:grayscale(1)}.decision{border-color:#a27d4e;background:#2a2116}.formation{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini-stat{text-align:center;background:#120d0a;border:1px solid var(--line);border-radius:9px;padding:8px}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 16px #e0b86755}}@media(max-width:520px){.mini-grid{grid-template-columns:1fr 1fr}.formation{grid-template-columns:1fr}.formation .btn{width:100%}}
</style>
<script>
/* Imperium Aeternum II v2.5.3 expansion layer */
const V253_MISSIONS=[
 {id:'grain',title:'The Grain Convoys',desc:'Secure Aegyptus and keep its unrest below 35.',type:'province',province:'Aegyptus',field:'unrest',max:35,reward:[420,18]},
 {id:'frontier',title:'Eyes on the Rhine',desc:'Raise Germania military readiness to 60.',type:'province',province:'Germania',field:'military',min:60,reward:[500,20]},
 {id:'clean',title:'Clean Hands Initiative',desc:'Reduce imperial corruption below 35.',type:'state',field:'corruption',max:35,reward:[600,25]},
 {id:'coalition',title:'A Broad Coalition',desc:'Bring four factions to 55 approval.',type:'factions',count:4,min:55,reward:[700,30]},
 {id:'fortune',title:'Household of Consequence',desc:'Own three enterprises and hold 3,000 denarii.',type:'wealth',reward:[800,25]},
 {id:'scholar',title:'The New Academy',desc:'Complete five research projects.',type:'research',count:5,reward:[550,22]},
 {id:'peace',title:'Pax Aeterna',desc:'Keep stability and average loyalty above 65.',type:'peace',reward:[900,35]},
 {id:'veterans',title:'The Veteran Vote',desc:'Maintain two cohorts and Imperialist support of 60.',type:'military',reward:[650,28]}
];
const V253_COHORTS=[
 {name:'I Praetoria Urbana',cost:700,upkeep:35,power:16,special:'Capital security'},
 {name:'XIV Gemina Drone Cohort',cost:1200,upkeep:60,power:28,special:'Frontier superiority'},
 {name:'Classis Mediterranea',cost:1650,upkeep:78,power:34,special:'Maritime logistics'},
 {name:'Legio Cybernetica',cost:2400,upkeep:110,power:48,special:'Cyberwarfare'}
];
const V253_ACHIEVEMENTS=[
 ['First Law','Pass your first Senate bill',s=>s.billsPassed>=1],['Cursus Honorum','Reach the office of Consul',s=>s.office>=3],['All Roads','Visit every province',s=>s.visited.length>=15],['Magnate','Earn 10,000 total denarii',s=>s.v253.totalEarned>=10000],['Peacemaker','Reach 75 imperial stability',s=>s.world.stability>=75],['Iron Senator','Defeat ten enemies',s=>s.enemiesDefeated>=10],['Coalition Builder','Reach 60 approval with every faction',s=>Object.values(s.factions).every(v=>v>=60)],['Aeternum','Discover the Engine',s=>s.flags.engineFound]
];
const V253_CRISIS=[
 {title:'The Danubian Blackout',text:'A synchronized cyberattack darkens Dacia and Germania. Hospitals request emergency grid priority.',choices:[
  ['Nationalize the grid',s=>{s.world.stability+=8;s.world.treasury-=180;s.factions.Merchants-=7;s.factions.Technocrats+=7},'Stability rises; merchants object.'],
  ['Hire private operators',s=>{s.money-=250;s.world.economy+=6;s.corruption+=4},'Fast, profitable—and opaque.'],
  ['Deploy military engineers',s=>{s.world.military+=5;s.favor+=5;s.provinces.Dacia.loyalty+=5},'The legions restore power.'] ]},
 {title:'The Alexandrian Bread Riots',text:'Automated grain exchanges fail during a heat wave. Crowds surround the prefecture.',choices:[
  ['Release strategic reserves',s=>{s.world.treasury-=160;s.popularity+=9;s.provinces.Aegyptus.unrest-=12},'Bread reaches the streets.'],
  ['Impose martial law',s=>{s.world.stability+=3;s.favor+=7;s.popularity-=8;s.provinces.Aegyptus.unrest-=7},'Order returns under armored patrols.'],
  ['Blame the governor',s=>{s.influence+=7;s.scandal+=4;s.provinces.Aegyptus.loyalty-=5},'The governor falls, but the queues remain.'] ]},
 {title:'The Emperor’s Illness',text:'The palace denies rumors, yet Praetorians seal the imperial medical wing.',choices:[
  ['Publicly affirm continuity',s=>{s.favor+=8;s.world.stability+=6;s.influence-=3},'The markets steady.'],
  ['Quietly build a succession bloc',s=>{s.influence+=18;s.scandal+=5;s.factions.Traditionalists+=4},'Names are exchanged behind closed doors.'],
  ['Demand a medical bulletin',s=>{s.popularity+=7;s.favor-=7;s.corruption-=3},'Citizens praise your nerve.'] ]},
 {title:'The Mauretanian Secession Vote',text:'A regional council schedules a nonbinding independence referendum.',choices:[
  ['Offer a new autonomy charter',s=>{s.provinces.Mauretania.loyalty+=14;s.factions.Provincials+=8;s.world.stability+=3},'The referendum becomes a negotiation.'],
  ['Declare the vote illegal',s=>{s.provinces.Mauretania.unrest+=15;s.favor+=5;s.world.stability-=5},'The council refuses to yield.'],
  ['Buy the media networks',s=>{s.money-=350;s.provinces.Mauretania.unrest-=6;s.corruption+=6},'Public enthusiasm mysteriously fades.'] ]},
 {title:'The Vestal Archive Leak',text:'Encrypted records suggest centuries of manipulated imperial elections.',choices:[
  ['Publish everything',s=>{s.popularity+=12;s.corruption-=10;s.world.stability-=9;s.flags.archivePublished=true},'The Empire wakes to a constitutional earthquake.'],
  ['Seal the archive',s=>{s.favor+=10;s.influence+=8;s.corruption+=5},'The truth returns underground.'],
  ['Use it against rivals',s=>{s.influence+=22;s.scandal+=8;s.senators.forEach(n=>n.power=Math.max(1,n.power-2))},'Half the Senate suddenly becomes cooperative.'] ]}
];
function ensure253(){
 if(!S)return;
 if(!S.v253)S.v253={version:'2.5.3',difficulty:'Normal',totalEarned:0,missions:[],completed:[],cohorts:[],operations:0,achievements:[],crisesResolved:0,legacy:0,lastCrisis:0,streak:0,decrees:[],notifications:[]};
 S.version='2.5.3';
 if(!Array.isArray(S.v253.missions)||!S.v253.missions.length)refreshMissions(false);
 S.companions.forEach(c=>{if(c.loyalty==null)c.loyalty=45;if(c.mood==null)c.mood='steady'});
}
function refreshMissions(logIt=true){if(!S.v253) return;let pool=V253_MISSIONS.filter(m=>!S.v253.completed.includes(m.id));S.v253.missions=[];while(pool.length&&S.v253.missions.length<3){let i=Math.floor(Math.random()*pool.length);S.v253.missions.push(pool.splice(i,1)[0].id)}if(logIt)addLog('New imperial contracts arrive at your office.');}
function missionDone(m){if(m.type==='province'){let v=S.provinces[m.province][m.field];return m.min!=null?v>=m.min:v<=m.max}if(m.type==='state'){let v=S[m.field];return m.min!=null?v>=m.min:v<=m.max}if(m.type==='factions')return Object.values(S.factions).filter(v=>v>=m.min).length>=m.count;if(m.type==='wealth')return S.businesses.length>=3&&S.money>=3000;if(m.type==='research')return S.research.length>=m.count;if(m.type==='peace')return S.world.stability>=65&&avgProvince('loyalty')>=65;if(m.type==='military')return S.v253.cohorts.length>=2&&S.factions.Imperialists>=60;return false}
function claimMission(id){let m=V253_MISSIONS.find(x=>x.id===id);if(!m||!missionDone(m))return toast('Contract requirements are not complete.');S.money+=m.reward[0];S.v253.totalEarned+=m.reward[0];S.influence+=m.reward[1];S.v253.completed.push(id);S.v253.missions=S.v253.missions.filter(x=>x!==id);gainXP(90);addLog(`<span class="good-text">Contract completed: ${m.title}.</span>`);refreshMissions(false);render()}
function viewMissions(){ensure253();return `<h2>Imperial Contracts</h2><div class="v253-banner"><b>Responsive assignments</b><div class="small">Contracts remain active until claimed and reward long-term policy choices.</div></div><div class="cards">${S.v253.missions.map(id=>{let m=V253_MISSIONS.find(x=>x.id===id),done=missionDone(m);return `<div class="card mission"><b>${m.title}</b><div class="small">${m.desc}</div><div class="small gold">Reward ${m.reward[0]} denarii • ${m.reward[1]} influence</div><button class="btn ${done?'good pulse':''}" style="width:100%;margin-top:8px" ${done?'':'disabled'} onclick="claimMission('${id}')">${done?'Claim Contract':'In Progress'}</button></div>`}).join('')}</div><button class="btn" style="margin-top:10px" onclick="rerollMissions()">Request New Docket (120)</button>`}
function rerollMissions(){if(S.money<120)return toast('You need 120 denarii.');S.money-=120;refreshMissions();render()}
function viewMilitary(){ensure253();let power=S.v253.cohorts.reduce((a,c)=>a+c.power,0);return `<h2>Military Command</h2><div class="mini-grid"><div class="mini-stat"><b>${power}</b><div class="small">Household power</div></div><div class="mini-stat"><b>${S.v253.cohorts.length}</b><div class="small">Cohorts</div></div><div class="mini-stat"><b>${S.v253.operations}</b><div class="small">Operations</div></div></div><h3 style="margin-top:14px">Forces</h3>${S.v253.cohorts.length?S.v253.cohorts.map((c,i)=>`<div class="card formation"><span><b>${c.name}</b><div class="small">Power ${c.power} • Upkeep ${c.upkeep}/day • ${c.special}</div></span><button class="btn" onclick="deployCohort(${i})">Deploy</button></div>`).join(''):'<p class="small">Your household commands no permanent formations.</p>'}<h3>Raise Formation</h3><div class="cards">${V253_COHORTS.map(c=>`<div class="card"><b>${c.name}</b><div class="small">${c.special}<br>Power ${c.power} • Cost ${c.cost} • Upkeep ${c.upkeep}</div><button class="btn blue" onclick="raiseCohort('${jsq(c.name)}')">Raise</button></div>`).join('')}</div>`}
function raiseCohort(name){let c=V253_COHORTS.find(x=>x.name===name);if(S.v253.cohorts.some(x=>x.name===name))return toast('That formation already serves you.');if(S.money<c.cost)return toast('Insufficient denarii.');S.money-=c.cost;S.v253.cohorts.push({...c,veterancy:0});S.favor+=5;addLog(`${c.name} takes the household oath.`);render()}
function deployCohort(i){let c=S.v253.cohorts[i];if(!spend(2))return;let targets=provinces.slice().sort((a,b)=>S.provinces[b].unrest-S.provinces[a].unrest);let n=targets[0],p=S.provinces[n],success=c.power+S.strategy*3+roll(35)>p.unrest+30;if(success){p.unrest=clamp(p.unrest-10,0,100);p.loyalty=clamp(p.loyalty+5,0,100);c.veterancy++;S.influence+=7;S.v253.operations++;addLog(`${c.name} restores order in ${n} without a prolonged battle.`)}else{c.power=Math.max(5,c.power-2);S.popularity-=3;S.v253.operations++;addLog(`<span class="bad-text">${c.name} suffers a public setback in ${n}.</span>`)}render()}
function viewLegacy(){ensure253();checkAchievements();return `<h2>Legacy & Records</h2><div class="mini-grid"><div class="mini-stat"><b>${S.v253.legacy}</b><div class="small">Legacy</div></div><div class="mini-stat"><b>${S.v253.achievements.length}/${V253_ACHIEVEMENTS.length}</b><div class="small">Achievements</div></div><div class="mini-stat"><b>${S.v253.crisesResolved}</b><div class="small">Crises resolved</div></div></div><h3 style="margin-top:14px">Difficulty</h3><div class="actions"><button class="btn ${S.v253.difficulty==='Story'?'primary':''}" onclick="setDifficulty('Story')">Story</button><button class="btn ${S.v253.difficulty==='Normal'?'primary':''}" onclick="setDifficulty('Normal')">Normal</button><button class="btn ${S.v253.difficulty==='Senatorial'?'primary':''}" onclick="setDifficulty('Senatorial')">Senatorial</button></div><h3>Achievements</h3><div class="cards">${V253_ACHIEVEMENTS.map(a=>{let on=S.v253.achievements.includes(a[0]);return `<div class="card achievement ${on?'':'locked'}"><b>${on?'🏅':'◯'} ${a[0]}</b><div class="small">${a[1]}</div></div>`}).join('')}</div><h3>Emergency Decrees</h3><div class="actions"><button class="btn" onclick="decree('amnesty')">Provincial Amnesty</button><button class="btn" onclick="decree('austerity')">Treasury Austerity</button><button class="btn" onclick="decree('festival')">Imperial Games</button><button class="btn" onclick="decree('purge')">Integrity Commission</button></div>`}
function setDifficulty(d){S.v253.difficulty=d;toast(`Difficulty set to ${d}.`);render()}
function decree(type){if(S.influence<35)return toast('A decree requires 35 influence.');S.influence-=35;if(type==='amnesty'){provinces.forEach(n=>{S.provinces[n].unrest-=4;S.provinces[n].loyalty+=2});S.favor-=4}if(type==='austerity'){S.world.treasury+=240;S.popularity-=7;S.world.economy-=3}if(type==='festival'){S.money-=300;S.popularity+=10;S.world.stability+=4}if(type==='purge'){S.corruption-=9;S.scandal+=3;S.factions.Traditionalists-=5}S.v253.decrees.push(type);addLog(`You issue an emergency decree: ${type}.`);render()}
function checkAchievements(){V253_ACHIEVEMENTS.forEach(a=>{if(!S.v253.achievements.includes(a[0])&&a[2](S)){S.v253.achievements.push(a[0]);S.v253.legacy+=10;S.influence+=5;toast(`Achievement: ${a[0]}`)}})}
function triggerCrisis(){ensure253();let c=pick(V253_CRISIS);S.v253.lastCrisis=S.day;modal(`<h2>${c.title}</h2><p>${c.text}</p><div class="choices">${c.choices.map((x,i)=>`<button class="choice decision" onclick="resolveCrisis(${V253_CRISIS.indexOf(c)},${i})"><b>${x[0]}</b><br><small>${x[2]}</small></button>`).join('')}</div>`)}
function resolveCrisis(ci,oi){let c=V253_CRISIS[ci],x=c.choices[oi];x[1](S);S.v253.crisesResolved++;S.v253.legacy+=2;closeModal();addLog(`<span class="gold">Crisis:</span> ${c.title} — ${x[0]}.`);render()}
function companionCouncil(){if(!S.companions.length)return toast('Recruit companions first.');let c=pick(S.companions);modal(`<h2>Counsel of ${c.name}</h2><p>${c.role}. Loyalty ${c.loyalty}.</p><div class="choices"><button class="choice" onclick="companionChoice('${jsq(c.name)}','trust')">Entrust a sensitive portfolio</button><button class="choice" onclick="companionChoice('${jsq(c.name)}','reward')">Grant a 180 denarii stipend</button><button class="choice" onclick="companionChoice('${jsq(c.name)}','challenge')">Challenge their advice</button></div>`)}
function companionChoice(name,type){let c=S.companions.find(x=>x.name===name);if(type==='trust'){c.loyalty+=8;S[c.stat]+=1;S.scandal+=Math.random()<.2?2:0}if(type==='reward'){if(S.money<180)return toast('Insufficient denarii.');S.money-=180;c.loyalty+=12}if(type==='challenge'){let ok=check('rhetoric',13);c.loyalty+=ok?3:-9;S.influence+=ok?5:0}c.loyalty=clamp(c.loyalty,0,100);closeModal();addLog(`${c.name}'s loyalty is now ${c.loyalty}.`);render()}
const oldRenderTabs=renderTabs,oldRenderView=renderView,oldRender=render,oldEndDay=endDay,oldSimulateWorld=simulateWorld,oldViewPeople=viewPeople,oldFresh=fresh,oldStart=start,oldLoadGame=loadGame;
fresh=function(){let x=oldFresh();x.v253={version:'2.5.3',difficulty:'Normal',totalEarned:0,missions:[],completed:[],cohorts:[],operations:0,achievements:[],crisesResolved:0,legacy:0,lastCrisis:0,streak:0,decrees:[],notifications:[]};return x};
start=function(){oldStart();ensure253();refreshMissions(false);render()};
loadGame=function(){try{let x=JSON.parse(localStorage.getItem('imperiumV2'));if(!x)throw 0;S=x;ensure253();$('creation').classList.remove('active');$('game').classList.add('active');closeModal();render();toast('Save migrated to v2.5.3.')}catch(e){toast('No valid save found.')}};
renderTabs=function(){const ts=['Capital','Senate','Provinces','Missions','Campaign','Military','Estate','Research','People','Legacy'];$('tabs').innerHTML=ts.map(t=>`<button class="tab ${t===currentTab?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};
renderView=function(){ensure253();const f={Capital:viewCapital,Senate:viewSenate,Provinces:viewProvinces,Missions:viewMissions,Campaign:viewCampaign,Military:viewMilitary,Estate:viewEstate,Research:viewResearch,People:viewPeople,Legacy:viewLegacy}[currentTab]||viewCapital;$('view').innerHTML=f()};

.v3-hero{position:relative;overflow:hidden;border:1px solid #b58a4f;border-radius:15px;padding:16px;margin-bottom:14px;background:radial-gradient(circle at 82% 20%,#4f3428,#18110e 60%);box-shadow:inset 0 0 35px #0008}.v3-hero:after{content:'III';position:absolute;right:16px;top:-18px;font:900 110px Georgia;color:#e5bd5d12}.v3-kicker{font-size:10px;letter-spacing:2px;color:#e2bb69;text-transform:uppercase}.v3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v3-card{border:1px solid #6f563a;background:linear-gradient(145deg,#211711,#110d0b);border-radius:12px;padding:11px;position:relative;overflow:hidden}.v3-card.danger{border-color:#9d403b}.v3-card.good{border-color:#52734e}.v3-card h3{margin:0 0 5px}.v3-meter{height:7px;background:#0c0907;border-radius:99px;overflow:hidden;margin:7px 0}.v3-meter i{display:block;height:100%;background:linear-gradient(90deg,#8e342f,#e0b868);border-radius:inherit}.v3-meter.cyan i{background:linear-gradient(90deg,#27627a,#78e0ed)}.v3-pill{display:inline-block;border:1px solid #735a3b;border-radius:99px;padding:3px 7px;margin:2px;font-size:10px;background:#19110d}.v3-timeline{border-left:2px solid #8e6a41;padding-left:12px}.v3-entry{position:relative;margin:0 0 12px}.v3-entry:before{content:'';position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:#dab45f;box-shadow:0 0 8px #dab45f77}.v3-command{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.v3-map{height:190px;border:1px solid #70583c;border-radius:12px;background:#091018;display:block;width:100%}.v3-ribbon{padding:7px 10px;border-left:4px solid #d3ac58;background:#291c12;margin:7px 0}.v3-threat{font-weight:bold;color:#ef9487}.v3-project{background:linear-gradient(90deg,#18231c,#17120e)}.v3-house{display:flex;gap:9px;align-items:center}.v3-sigil{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:2px solid #d0aa55;background:#261a14;font:700 19px Georgia}.v3-news{white-space:nowrap;overflow:hidden;border:1px solid #58452f;border-radius:9px;background:#100c09;margin-bottom:10px}.v3-news span{display:inline-block;padding:7px 0;animation:v3crawl 28s linear infinite}.v3-news b{margin:0 22px;color:#dab45f}@keyframes v3crawl{to{transform:translateX(-55%)}}@media(max-width:700px){.v3-grid,.v3-command{grid-template-columns:1fr}.v3-hero:after{font-size:76px}.v3-map{height:150px}}
</style>
<script>
/* IMPERIUM AETERNUM III — embedded systems expansion. No external assets. */
(function(){
'use strict';
const POWERS=[
 {name:'Atlantic Federation',icon:'◈',temper:'commercial'},
 {name:'Han Directorate',icon:'龍',temper:'strategic'},
 {name:'Solar Caliphates',icon:'☀',temper:'devout'},
 {name:'Nordic Compact',icon:'❄',temper:'republican'},
 {name:'Aztec Technate',icon:'◆',temper:'militant'}
];
const HOUSES=['Julii','Claudii','Cornelii','Flavii','Valerii','Aemilii','Fabii','Severi'];
const PROJECTS=[
 {id:'orbital',name:'Orbital Aquila Network',cost:4200,days:28,text:'An imperial constellation for communications and defense.',reward:s=>{s.world.military+=15;s.world.stability+=8;s.strategy+=1}},
 {id:'grain',name:'Mediterranean Climate Shield',cost:3500,days:24,text:'Weather control protecting the grain fleets.',reward:s=>{s.world.economy+=14;s.popularity+=10;Object.values(s.provinces).forEach(p=>p.unrest=Math.max(0,p.unrest-8))}},
 {id:'forum',name:'Forum of All Citizens',cost:2800,days:20,text:'A permanent digital assembly linking every province.',reward:s=>{s.influence+=100;s.factions.Populists+=12;s.factions.Provincials+=12}},
 {id:'engine',name:'Aeternum Containment Ring',cost:6000,days:40,text:'A machine beneath Rome that may outlive civilization.',reward:s=>{s.flags.engineFound=true;s.learning+=2;s.favor+=20}}
];
const DOCTRINES=[
 ['Pax Through Prosperity','economy','Trade income rises, military pressure weakens.'],
 ['The Iron Limes','military','Front operations improve, popularity grows slowly.'],
 ['Senatorial Supremacy','senate','Influence generation rises, imperial favor falls.'],
 ['Imperial Concord','palace','Favor and stability rise, corruption becomes harder to remove.']
];
function r(n){return Math.floor(Math.random()*n)}function pick3(a){return a[r(a.length)]}
function ensure(){if(typeof S==='undefined'||!S)return;S.version='3.0';S.v3=S.v3||{};let v=S.v3;
 if(!v.powers){v.powers={};POWERS.forEach((p,i)=>v.powers[p.name]={relation:35+r(31),tension:10+r(25),trade:8+r(18),intel:0,lastMove:'Observing Rome'});}
 if(!v.houses){v.houses=HOUSES.map((n,i)=>({name:n,power:22+r(38),loyalty:15+r(55),scheme:r(100),sigil:['III','⚡','☾','✦','V','♜','⚖','♛'][i]}));}
 if(!v.fronts)v.fronts=[{name:'Rhine Autonomous Zone',enemy:42,roman:38,status:'Cold frontier',turn:0},{name:'Eastern Orbital Corridor',enemy:31,roman:34,status:'Electronic skirmishes',turn:0}];
 if(!v.projects)v.projects=[];if(!v.completedProjects)v.completedProjects=[];if(!v.doctrine)v.doctrine='Pax Through Prosperity';if(!v.legacy)v.legacy=0;if(!v.chronicle)v.chronicle=[];if(!v.season)v.season=1;if(!v.news)v.news=['The Eternal Senate opens its new session.'];if(!v.diplomaticActions)v.diplomaticActions=0;if(!v.warsWon)v.warsWon=0;if(!v.lastSimDay)v.lastSimDay=S.day;
}
function chronicle(text,type=''){ensure();S.v3.chronicle.unshift({day:S.day,year:S.year,text,type});S.v3.chronicle=S.v3.chronicle.slice(0,60);S.v3.news.unshift(text);S.v3.news=S.v3.news.slice(0,8)}
function meter(v,cls=''){return `<div class="v3-meter ${cls}"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`}
function headlines(){ensure();return `<div class="v3-news"><span>${[...S.v3.news,...S.v3.news].map(x=>`<b>SPQR LIVE</b>${x}`).join('')}</span></div>`}
function renderWar(){ensure();return `<div class="v3-hero"><div class="v3-kicker">Strategic Command</div><h2>The Imperial War Room</h2><p class="small">Fronts evolve each day. Supply, intelligence and political legitimacy determine victory.</p></div>${headlines()}<canvas id="v3WarMap" class="v3-map"></canvas><div class="v3-grid" style="margin-top:10px">${S.v3.fronts.map((f,i)=>`<div class="v3-card ${f.enemy>f.roman+12?'danger':''}"><h3>${f.name}</h3><div class="small">${f.status}</div><div class="small">Roman readiness ${f.roman}</div>${meter(f.roman,'cyan')}<div class="small">Enemy pressure ${f.enemy}</div>${meter(f.enemy)}<div class="actions"><button class="btn" onclick="v3Operation(${i},'recon')">Recon</button><button class="btn" onclick="v3Operation(${i},'supply')">Supply</button><button class="btn primary" onclick="v3Operation(${i},'attack')">Operation</button></div></div>`).join('')}</div><h3>Grand Projects</h3><div class="v3-grid">${PROJECTS.map(p=>{let active=S.v3.projects.find(x=>x.id===p.id),done=S.v3.completedProjects.includes(p.id);return `<div class="v3-card v3-project"><b>${p.name}</b><div class="small">${p.text}</div>${active?meter(active.progress/active.days*100):''}<button class="btn" style="width:100%;margin-top:7px" ${done||active?'disabled':''} onclick="v3StartProject('${p.id}')">${done?'Completed':active?`${active.progress}/${active.days} days`:`Commission ${p.cost}`}</button></div>`}).join('')}</div>`}
function renderDiplomacy(){ensure();return `<div class="v3-hero"><div class="v3-kicker">Foreign Ministry</div><h2>The World Beyond Rome</h2><p class="small">Treaties create dependencies. Threats create coalitions. Every power remembers.</p></div>${headlines()}<div class="v3-grid">${POWERS.map(p=>{let d=S.v3.powers[p.name];return `<div class="v3-card ${d.tension>65?'danger':''}"><h3>${p.icon} ${p.name}</h3><div class="small">${p.temper} power • ${d.lastMove}</div><div class="small">Relations ${d.relation}</div>${meter(d.relation,'cyan')}<div class="small">Tension ${d.tension}</div>${meter(d.tension)}<span class="v3-pill">Trade +${d.trade}/day</span><span class="v3-pill">Intel ${d.intel}</span><div class="actions"><button class="btn" onclick="v3Diplomacy('${p.name}','summit')">Summit</button><button class="btn" onclick="v3Diplomacy('${p.name}','trade')">Trade Pact</button><button class="btn" onclick="v3Diplomacy('${p.name}','spy')">Intelligence</button></div></div>`}).join('')}</div><h3>State Doctrine</h3><div class="v3-grid">${DOCTRINES.map(d=>`<div class="v3-card ${S.v3.doctrine===d[0]?'good':''}"><b>${d[0]}</b><div class="small">${d[2]}</div><button class="btn" style="width:100%;margin-top:7px" ${S.v3.doctrine===d[0]?'disabled':''} onclick="v3Doctrine('${d[0]}')">${S.v3.doctrine===d[0]?'Active':'Adopt'}</button></div>`).join('')}</div>`}
function renderChronicle(){ensure();return `<div class="v3-hero"><div class="v3-kicker">Dynastic Record</div><h2>Chronicle of ${typeof esc==='function'?esc(S.name):S.name}</h2><p class="small">Legacy ${S.v3.legacy} • Wars won ${S.v3.warsWon} • Diplomatic actions ${S.v3.diplomaticActions}</p></div><h3>The Great Houses</h3><div class="v3-grid">${S.v3.houses.map((h,i)=>`<div class="v3-card"><div class="v3-house"><div class="v3-sigil">${h.sigil}</div><div><b>House ${h.name}</b><div class="small">Power ${h.power} • Loyalty ${h.loyalty}</div></div></div>${meter(h.loyalty,'cyan')}<button class="btn" style="width:100%" onclick="v3House(${i})">Hold Audience</button></div>`).join('')}</div><h3>Imperial Chronicle</h3><div class="v3-timeline">${S.v3.chronicle.length?S.v3.chronicle.map(e=>`<div class="v3-entry"><b>Day ${e.day}, ${e.year} A.U.C.</b><div class="small">${e.text}</div></div>`).join(''):'<div class="small">Your greatest acts remain unwritten.</div>'}</div>`}
window.v3Operation=function(i,type){ensure();let f=S.v3.fronts[i];if(!spend(2))return;if(type==='recon'){let ok=check('learning',13);f.enemy=Math.max(0,f.enemy-(ok?8:2));S.influence+=ok?5:0;chronicle(`${f.name}: intelligence teams expose enemy deployments.`)}if(type==='supply'){if(S.money<240)return toast('Need 240 denarii.');S.money-=240;f.roman=Math.min(100,f.roman+12+Math.floor(S.strategy/3));chronicle(`${f.name}: fresh supplies reach the frontier.`)}if(type==='attack'){let chance=50+(f.roman-f.enemy)+S.strategy*2+(S.v3.doctrine==='The Iron Limes'?12:0);if(r(100)<chance){f.enemy=Math.max(0,f.enemy-18-r(15));f.roman=Math.max(8,f.roman-r(7));S.influence+=15;S.v3.legacy+=3;chronicle(`Roman forces win a decisive operation at ${f.name}.`,'good');if(f.enemy<=5){S.v3.warsWon++;f.enemy=24+r(25);f.status='Roman strategic advantage';S.money+=700;S.favor+=8;chronicle(`${f.name} is secured for the Empire.`,'good')}}else{f.roman=Math.max(5,f.roman-10-r(12));S.popularity-=3;S.world.stability-=2;chronicle(`The operation at ${f.name} stalls with heavy political cost.`,'bad')}}render()}
window.v3Diplomacy=function(name,type){ensure();let d=S.v3.powers[name];if(!spend(2))return;S.v3.diplomaticActions++;if(type==='summit'){let ok=check('charisma',14);d.relation+=ok?12:3;d.tension-=ok?10:2;S.influence+=ok?7:0;chronicle(`${name} ${ok?'signs a joint declaration':'offers only ceremonial courtesies'}.`)}if(type==='trade'){if(S.money<180)return toast('Need 180 denarii.');S.money-=180;let ok=check('rhetoric',15);d.trade+=ok?6:2;d.relation+=ok?7:-2;chronicle(`A new commercial protocol is negotiated with ${name}.`)}if(type==='spy'){let ok=check('learning',15);d.intel+=ok?15:4;d.tension+=ok?2:9;S.scandal+=ok?0:3;chronicle(`Roman intelligence ${ok?'penetrates':'is exposed inside'} ${name}.`)}d.relation=clamp(d.relation,0,100);d.tension=clamp(d.tension,0,100);render()}
window.v3Doctrine=function(name){ensure();if(S.influence<25)return toast('Need 25 influence.');S.influence-=25;S.v3.doctrine=name;chronicle(`The government adopts the doctrine: ${name}.`);render()}
window.v3House=function(i){ensure();let h=S.v3.houses[i];modal(`<h2>House ${h.name}</h2><p>Power ${h.power}. Loyalty ${h.loyalty}. Scheme activity ${h.scheme}.</p><div class="choices"><button class="choice" onclick="v3HouseDeal(${i},'honor')">Grant a Public Honor</button><button class="choice" onclick="v3HouseDeal(${i},'marriage')">Negotiate a Dynastic Alliance</button><button class="choice" onclick="v3HouseDeal(${i},'audit')">Order a Financial Audit</button><button class="choice" onclick="closeModal()">Leave</button></div>`)}
window.v3HouseDeal=function(i,type){let h=S.v3.houses[i];if(type==='honor'){if(S.influence<12)return toast('Need 12 influence.');S.influence-=12;h.loyalty+=14;h.power+=2}if(type==='marriage'){if(S.money<500)return toast('Need 500 denarii.');S.money-=500;h.loyalty+=22;S.v3.legacy+=4}if(type==='audit'){let ok=check('learning',15);h.power-=ok?8:0;h.loyalty-=ok?12:20;S.corruption-=ok?4:0;S.scandal+=ok?1:5}h.loyalty=clamp(h.loyalty,0,100);closeModal();chronicle(`Your household concludes a tense audience with House ${h.name}.`);render()}
window.v3StartProject=function(id){ensure();let p=PROJECTS.find(x=>x.id===id);if(S.money<p.cost)return toast(`Need ${p.cost} denarii.`);S.money-=p.cost;S.v3.projects.push({id,progress:0,days:p.days});chronicle(`Construction begins on ${p.name}.`);render()}
function sim(){ensure();if(S.v3.lastSimDay===S.day)return;let delta=Math.max(1,S.day-S.v3.lastSimDay);S.v3.lastSimDay=S.day;S.v3.season=Math.floor((S.day%120)/30)+1;
 let trade=Object.values(S.v3.powers).reduce((a,d)=>a+d.trade,0);S.money+=trade*delta;
 Object.entries(S.v3.powers).forEach(([name,d])=>{d.tension=clamp(d.tension+r(7)-3,0,100);d.relation=clamp(d.relation+r(5)-2,0,100);if(Math.random()<.14){let moves=['conducts naval exercises','announces a technology embargo','requests a summit','opens a new trade corridor','accuses Rome of cyber espionage'];d.lastMove=pick3(moves);chronicle(`${name} ${d.lastMove}.`);if(d.tension>75){S.world.stability-=2;S.v3.fronts[1].enemy+=4}}});
 S.v3.fronts.forEach(f=>{f.enemy=clamp(f.enemy+r(7)-2,0,100);f.roman=clamp(f.roman-1+(S.v3.doctrine==='The Iron Limes'?2:0),0,100);f.turn++});
 S.v3.houses.forEach(h=>{h.scheme=clamp(h.scheme+r(8)-2,0,100);if(h.scheme>88&&Math.random()<.25){h.scheme=30;h.loyalty-=8;S.scandal+=3;chronicle(`House ${h.name} leaks a damaging dossier to the media.`,'bad')}});
 [...S.v3.projects].forEach(pr=>{pr.progress+=delta;let p=PROJECTS.find(x=>x.id===pr.id);if(pr.progress>=pr.days){p.reward(S);S.v3.completedProjects.push(pr.id);S.v3.projects=S.v3.projects.filter(x=>x.id!==pr.id);S.v3.legacy+=10;chronicle(`${p.name} is completed and dedicated to the Roman people.`,'good')}});
 if(S.v3.doctrine==='Pax Through Prosperity')S.world.economy=clamp(S.world.economy+1,0,100);if(S.v3.doctrine==='Senatorial Supremacy')S.influence+=2;if(S.v3.doctrine==='Imperial Concord'){S.favor+=1;S.world.stability=clamp(S.world.stability+1,0,100);S.corruption=clamp(S.corruption+1,0,100)}
}
function drawWar(){let c=document.getElementById('v3WarMap');if(!c)return;let d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#08131d');g.addColorStop(1,'#24130f');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#426578';x.globalAlpha=.35;for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,i*h/10);x.lineTo(w,i*h/10-30);x.stroke()}x.globalAlpha=1;S.v3.fronts.forEach((f,i)=>{let y=55+i*78;x.strokeStyle='#d1ab5a';x.lineWidth=3;x.beginPath();x.moveTo(55,y);x.bezierCurveTo(w*.35,y-35,w*.65,y+35,w-55,y);x.stroke();for(let j=0;j<8;j++){let px=55+j*(w-110)/7;x.fillStyle=j/7<f.roman/100?'#68d7e8':'#a7433d';x.beginPath();x.arc(px,y+Math.sin(j+i)*15,5,0,7);x.fill()}x.fillStyle='#e2c17c';x.font='12px Georgia';x.fillText(f.name,18,y-23)})}
function decorate(){if(currentTab==='War Room')requestAnimationFrame(drawWar)}
let oldTabs=window.renderTabs;window.renderTabs=function(){ensure();const ts=['Capital','Senate','Provinces','Campaign','War Room','Diplomacy','Estate','Research','People','Chronicle'];$('tabs').innerHTML=ts.map(t=>`<button class="tab ${t===currentTab?'active':''}" onclick="tab('${t}')">${t}</button>`).join('')};
let oldView=window.renderView;window.renderView=function(){ensure();if(currentTab==='War Room')$('view').innerHTML=renderWar();else if(currentTab==='Diplomacy')$('view').innerHTML=renderDiplomacy();else if(currentTab==='Chronicle')$('view').innerHTML=renderChronicle();else oldView();decorate()};
let oldRender=window.render;window.render=function(){ensure();oldRender()};
let oldEnd=window.endDay;window.endDay=function(){oldEnd();sim();autoSave();if(currentTab==='War Room'||currentTab==='Diplomacy'||currentTab==='Chronicle')render()};
let oldStart=window.start;window.start=function(){oldStart();ensure();chronicle(`${S.name} begins a new age of Roman history.`);render()};
let oldLoad=window.loadGame;window.loadGame=function(){oldLoad();setTimeout(()=>{ensure();render()},0)};
let oldScene=window.setGraphicScene;window.setGraphicScene=function(n){if(oldScene)oldScene(n==='War Room'?'Military':n==='Diplomacy'?'Provinces':n==='Chronicle'?'Legacy':n)};
function boot(){document.querySelector('.subtitle').textContent='A New Age of Empire • Version 3.0 — Grand Strategy RPG';document.title='Imperium Aeternum III';if(typeof S!=='undefined'&&S){ensure();render()}}
addEventListener('DOMContentLoaded',boot);if(document.readyState!=='loading')setTimeout(boot,0);
})();
</script>

<style>
/* V4 — Living Imperium */
:root{--v4-gold:#efc76b;--v4-cyan:#70dce9;--v4-red:#c85d51;--v4-ink:#090a0d}
body.v4{background:radial-gradient(circle at 50% -10%,#302117,#08090c 42%,#050608 100%)}
.v4-hero{position:relative;min-height:150px;overflow:hidden;border:1px solid #c79a50;border-radius:16px;padding:18px;background:linear-gradient(120deg,#111923e8,#28170fe8);box-shadow:0 18px 50px #0009,inset 0 0 50px #d5a85a0c;margin-bottom:12px}
.v4-hero:before{content:'IV';position:absolute;right:15px;top:-35px;font:900 140px Georgia;color:#f0c76a12}.v4-hero h2{margin:4px 0 7px;font-size:25px}.v4-kicker{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--v4-gold)}
.v4-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.v4-card{position:relative;overflow:hidden;border:1px solid #65513b;border-radius:13px;padding:12px;background:linear-gradient(145deg,#17191dee,#100d0bee);box-shadow:inset 0 1px #fff1}.v4-card:after{content:'';position:absolute;inset:auto -30% -70% 30%;height:120px;background:radial-gradient(circle,#e5b55c12,transparent 65%);pointer-events:none}.v4-card.alert{border-color:#a64c45}.v4-card.good{border-color:#517b66}.v4-card h3{margin:0 0 6px}.v4-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.v4-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #6c5941;border-radius:99px;padding:4px 8px;margin:3px 2px 0 0;background:#0e1115;font-size:10px}.v4-dot{width:7px;height:7px;border-radius:50%;background:var(--v4-cyan);box-shadow:0 0 8px currentColor}.v4-meter{height:8px;border-radius:99px;background:#07080a;overflow:hidden;margin:6px 0}.v4-meter span{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,#277991,#73e2ec);box-shadow:0 0 9px #54dbea66}.v4-meter.red span{background:linear-gradient(90deg,#8d302e,#e27663)}.v4-meter.gold span{background:linear-gradient(90deg,#856426,#f0c96c)}
.v4-council{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.v4-seat{padding:10px;border:1px solid #574835;border-radius:10px;background:#111216}.v4-seat b{display:block}.v4-phase{display:flex;gap:5px;margin:8px 0}.v4-phase i{height:7px;flex:1;border-radius:4px;background:#272018}.v4-phase i.done{background:#d9ad55;box-shadow:0 0 7px #d9ad5577}.v4-order{border-left:3px solid #d7a950;padding:8px 9px;background:#1b1511;margin:6px 0}.v4-mini-map{width:100%;height:215px;border:1px solid #68523a;border-radius:13px;background:#050a0e}.v4-live-stage{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;overflow:hidden}.v4-live-stage canvas{position:absolute;inset:0;width:100%;height:100%}.desktop-cinematic #artStage{min-height:330px}.v4-render-badge{position:absolute;top:9px;left:9px;z-index:8;padding:5px 8px;border:1px solid #69dbe477;border-radius:99px;background:#071015bb;color:#8cecf3;font-size:9px;letter-spacing:1.2px;backdrop-filter:blur(8px)}
.v4-treaty{border-left:3px solid #66cad5;padding-left:8px;margin-top:7px}.v4-stance{font-weight:700}.v4-stance.hostile{color:#ed8377}.v4-stance.allied{color:#84dfaa}.v4-senate-board{display:grid;grid-template-columns:1fr 1fr;gap:12px}.v4-agenda{border:1px solid #655039;border-radius:12px;padding:11px;background:#12100e}.v4-votes{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#090807;margin:8px 0}.v4-votes i:first-child{background:#64c48c}.v4-votes i:last-child{background:#bd584e}.v4-flash{animation:v4flash .55s ease}@keyframes v4flash{50%{filter:brightness(1.7)}}

<script>
/* IMPERIUM AETERNUM IV — Living Imperium. Everything rendered in code. */
(function(){
'use strict';
const V4_POLICIES=[
 {id:'citizen',name:'Universal Civic Service',text:'Provincial loyalty rises; business income falls slightly.',cost:35},
 {id:'market',name:'Imperial Free Ports',text:'Trade accelerates; corruption becomes harder to contain.',cost:30},
 {id:'legion',name:'Professional Legion Charter',text:'Front readiness and veteran retention improve.',cost:40},
 {id:'academy',name:'Academy of Statecraft',text:'Research and diplomatic intelligence improve.',cost:40}
];
const V4_COMMANDERS=['Aelia Varro','Marcus Drusus','Titus Solon','Livia Corvinus','Cassian Marcellus','Octavia Severina'];
const V4_AGENDAS=[
 ['Provincial Reconstruction Act','economy','Invest heavily in unstable provinces.'],
 ['Praetorian Accountability Act','law','Reduce corruption and palace influence.'],
 ['Frontier Mobilization Act','military','Fund cohorts and reinforce active fronts.'],
 ['Civic Network Act','technology','Expand the digital Forum throughout the Empire.'],
 ['Grain Security Act','welfare','Stabilize food prices and provincial unrest.']
];
const R=n=>Math.floor(Math.random()*n), clamp4=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
function ensure4(){if(typeof S==='undefined'||!S)return;S.version='4.0';S.v4=S.v4||{};let v=S.v4;
 if(!v.council)v.council=[{office:'Consular Chief',name:'Aurelia Tullia',loyalty:58,skill:62},{office:'Master of Offices',name:'Gaius Nerva',loyalty:45,skill:70},{office:'Marshal of Rome',name:'Valeria Aquila',loyalty:65,skill:74}];
 if(!v.policies)v.policies=[];if(!v.politicalCapital)v.politicalCapital=20;if(!v.reputation)v.reputation={Merciful:0,Ruthless:0,Reformer:0,Traditionalist:0};
 if(!v.agenda)v.agenda={...(()=>{let a=V4_AGENDAS[R(V4_AGENDAS.length)];return{title:a[0],type:a[1],text:a[2],support:35+R(31),opposition:25+R(35),days:5}})()};
 if(!v.lastAgendaDay)v.lastAgendaDay=S.day;if(!v.treaties)v.treaties={};if(!v.projectChoices)v.projectChoices={};if(!v.visualQuality)v.visualQuality='Cinematic';if(!v.lastTick)v.lastTick=S.day;
 if(S.v3&&S.v3.fronts)S.v3.fronts.forEach((f,i)=>{if(!f.supply)f.supply=45+R(26);if(!f.morale)f.morale=45+R(31);if(!f.commander)f.commander=V4_COMMANDERS[i%V4_COMMANDERS.length];if(!f.veterans)f.veterans=0});
 if(S.v3&&S.v3.powers)Object.keys(S.v3.powers).forEach(n=>{if(!v.treaties[n])v.treaties[n]={status:'No treaty',days:0,terms:[],trust:40+R(21)}});
}
function bar4(v,cls=''){return `<div class="v4-meter ${cls}"><span style="width:${clamp4(v)}%"></span></div>`}
function stance(d){if(d.relation>72&&d.tension<30)return['allied','Strategic Partner'];if(d.tension>70)return['hostile','Hostile'];if(d.relation<30)return['hostile','Cold'];return['','Unaligned']}
function hero4(k,t,p){return `<div class="v4-hero"><div class="v4-kicker">${k}</div><h2>${t}</h2><div class="small">${p}</div></div>`}
function councilView(){ensure4();let v=S.v4;return `${hero4('Palatine Council','The Machinery of Government','Ministers accumulate loyalty, competence and private ambition. Policies reshape the daily simulation.')}<div class="v4-council">${v.council.map((m,i)=>`<div class="v4-seat"><b>${m.name}</b><div class="small">${m.office}</div><div class="small">Loyalty ${m.loyalty}</div>${bar4(m.loyalty)}<div class="small">Competence ${m.skill}</div>${bar4(m.skill,'gold')}<button class="btn" style="width:100%" onclick="v4Minister(${i})">Private Audience</button></div>`).join('')}</div><h3>Active State Policies</h3><div class="v4-grid">${V4_POLICIES.map(p=>`<div class="v4-card ${v.policies.includes(p.id)?'good':''}"><h3>${p.name}</h3><div class="small">${p.text}</div><button class="btn" style="width:100%;margin-top:8px" ${v.policies.includes(p.id)?'disabled':''} onclick="v4Policy('${p.id}')">${v.policies.includes(p.id)?'Enacted':`Enact • ${p.cost} influence`}</button></div>`).join('')}</div><h3>Political Identity</h3><div class="v4-card">${Object.entries(v.reputation).map(([k,n])=>`<span class="v4-chip"><i class="v4-dot"></i>${k} ${n}</span>`).join('')}<p class="small">These traits are built by major decisions and influence ministers, houses and foreign powers.</p></div>`}
function senate4(){ensure4();let a=S.v4.agenda,total=Math.max(1,a.support+a.opposition),yes=Math.round(a.support/total*100);return `${hero4('Curia Live','Senate Agenda','The chamber now forms shifting coalitions around an evolving legislative agenda.')}<div class="v4-senate-board"><div class="v4-agenda"><div class="v4-kicker">Current motion • ${a.days} days remaining</div><h3>${a.title}</h3><p class="small">${a.text}</p><div class="v4-votes"><i style="width:${yes}%"></i><i style="width:${100-yes}%"></i></div><div class="v4-row"><span>Projected ${yes}% support</span><span>${a.support>a.opposition?'Likely passage':'At risk'}</span></div><div class="actions"><button class="btn" onclick="v4Lobby('support')">Build Coalition</button><button class="btn" onclick="v4Lobby('oppose')">Mobilize Opposition</button><button class="btn primary" onclick="v4ForceVote()">Force Vote</button></div></div><div class="v4-card"><h3>Coalition Leverage</h3><div class="small">Political capital ${S.v4.politicalCapital}</div>${bar4(S.v4.politicalCapital,'gold')}<div class="small">Great-house loyalty and faction support influence every vote. Failure can create scandals or empower rivals.</div>${(S.v3?.houses||[]).slice(0,4).map(h=>`<div class="v4-row small"><span>House ${h.name}</span><b>${h.loyalty}</b></div>`).join('')}</div></div>`}
function diplomacy4(){ensure4();return `${hero4('Ministry of External Affairs','Treaties & Rivalries','Agreements have terms, duration and trust. Foreign governments react to broken promises.')}<div class="v4-grid">${Object.entries(S.v3.powers).map(([n,d])=>{let t=S.v4.treaties[n],st=stance(d);return `<div class="v4-card ${st[0]==='hostile'?'alert':st[0]==='allied'?'good':''}"><div class="v4-row"><h3>${n}</h3><span class="v4-stance ${st[0]}">${st[1]}</span></div><div class="small">${d.lastMove}</div><div class="small">Relations ${d.relation}</div>${bar4(d.relation)}<div class="small">Tension ${d.tension}</div>${bar4(d.tension,'red')}<div class="v4-treaty"><b>${t.status}</b><div class="small">Trust ${t.trust}${t.days?` • ${t.days} days`:''}</div>${t.terms.map(x=>`<span class="v4-chip">${x}</span>`).join('')}</div><div class="actions"><button class="btn" onclick="v4Treaty('${n}','commerce')">Commerce</button><button class="btn" onclick="v4Treaty('${n}','defense')">Defense</button><button class="btn" onclick="v4Treaty('${n}','science')">Science</button></div></div>`}).join('')}</div>`}
function war4(){ensure4();return `${hero4('Strategic Command','The Living Fronts','Commanders, morale, supply and veterans now shape every military operation.')}<canvas id="v4WarMap" class="v4-mini-map"></canvas><div class="v4-grid" style="margin-top:10px">${S.v3.fronts.map((f,i)=>`<div class="v4-card ${f.enemy>f.roman+15?'alert':''}"><div class="v4-row"><h3>${f.name}</h3><span class="v4-chip">${f.commander}</span></div><div class="small">Readiness ${f.roman}</div>${bar4(f.roman)}<div class="small">Enemy pressure ${f.enemy}</div>${bar4(f.enemy,'red')}<div class="small">Supply ${f.supply}</div>${bar4(f.supply,'gold')}<div class="small">Morale ${f.morale} • Veterans ${f.veterans}</div><div class="actions"><button class="btn" onclick="v4Front(${i},'rotate')">Rotate Commander</button><button class="btn" onclick="v4Front(${i},'fortify')">Fortify</button><button class="btn primary" onclick="v4Front(${i},'offensive')">Grand Offensive</button></div></div>`).join('')}</div>`}
function projects4(base){ensure4();return base.replace('<h3>Grand Projects</h3>',`<h3>Grand Projects — Phased Construction</h3><div class="v4-order small">Projects can now trigger engineering, labor and political decisions as they pass 25%, 50% and 75% completion.</div>`).replace(/<div class="v3-card v3-project">/g,'<div class="v3-card v3-project v4-project">')}
window.v4Minister=function(i){ensure4();let m=S.v4.council[i];modal(`<h2>${m.name}</h2><p>${m.office}. Loyalty ${m.loyalty}; competence ${m.skill}.</p><div class="choices"><button class="choice" onclick="v4MinisterDeal(${i},'trust')">Entrust a Sensitive Portfolio</button><button class="choice" onclick="v4MinisterDeal(${i},'reward')">Grant an Estate</button><button class="choice" onclick="v4MinisterDeal(${i},'dismiss')">Dismiss from Office</button><button class="choice" onclick="closeModal()">Leave</button></div>`)};
window.v4MinisterDeal=function(i,a){let m=S.v4.council[i];if(a==='trust'){m.loyalty+=8;m.skill+=3;S.scandal+=2}if(a==='reward'){if(S.money<450)return toast('Need 450 denarii.');S.money-=450;m.loyalty+=16;S.corruption+=2}if(a==='dismiss'){m.loyalty=0;m.name=V4_COMMANDERS[R(V4_COMMANDERS.length)];m.skill=42+R(36);m.loyalty=30+R(31);S.v4.politicalCapital-=5}m.loyalty=clamp4(m.loyalty);m.skill=clamp4(m.skill);closeModal();render()};
window.v4Policy=function(id){ensure4();let p=V4_POLICIES.find(x=>x.id===id);if(S.influence<p.cost)return toast(`Need ${p.cost} influence.`);S.influence-=p.cost;S.v4.policies.push(id);S.v4.reputation.Reformer+=3;if(typeof chronicle==='function')chronicle(`${p.name} enters imperial law.`);render()};
window.v4Lobby=function(side){ensure4();if(!spend(2))return;let a=S.v4.agenda,boost=5+Math.floor(S.rhetoric/2)+R(6);if(side==='support'){a.support+=boost;S.v4.politicalCapital+=2}else{a.opposition+=boost;S.v4.reputation.Traditionalist+=1}render()};
window.v4ForceVote=function(){ensure4();let a=S.v4.agenda,house=(S.v3?.houses||[]).reduce((q,h)=>q+h.loyalty,0)/Math.max(1,(S.v3?.houses||[]).length),chance=50+(a.support-a.opposition)/2+(house-50)/4+S.influence/20;let pass=R(100)<chance;if(pass){S.influence+=22;S.popularity+=4;S.v4.politicalCapital+=8;S.billsPassed++;S.v4.reputation.Reformer+=2;if(a.type==='military')S.v3.fronts.forEach(f=>{f.supply+=8;f.roman+=5});if(a.type==='economy')S.world.economy+=6;if(a.type==='welfare')Object.values(S.provinces).forEach(p=>p.unrest=Math.max(0,p.unrest-3));if(typeof chronicle==='function')chronicle(`${a.title} passes the Senate.`)}else{S.scandal+=4;S.influence=Math.max(0,S.influence-8);S.v4.politicalCapital-=5;if(typeof chronicle==='function')chronicle(`${a.title} is defeated in the chamber.`)}newAgenda();render()};
function newAgenda(){let x=V4_AGENDAS[R(V4_AGENDAS.length)];S.v4.agenda={title:x[0],type:x[1],text:x[2],support:30+R(31),opposition:28+R(33),days:5};S.v4.lastAgendaDay=S.day}
window.v4Treaty=function(n,type){ensure4();let d=S.v3.powers[n],t=S.v4.treaties[n];if(!spend(2))return;let diff=14+(d.tension/10)-(t.trust/20),stat=type==='science'?'learning':type==='defense'?'strategy':'rhetoric',ok=check(stat,Math.round(diff));if(ok){let map={commerce:['Commercial Compact',['Tariff corridor','Market access'],18],defense:['Mutual Defense Protocol',['Shared intelligence','Crisis consultation'],15],science:['Scientific Concord',['Research exchange','Academic visas'],16]},q=map[type];t.status=q[0];t.terms=q[1];t.days=30;t.trust+=8;d.relation+=10;d.tension-=7;d.trade+=type==='commerce'?8:2;d.intel+=type==='science'?10:3;S.v4.politicalCapital+=3;if(typeof chronicle==='function')chronicle(`${n} signs the ${q[0]}.`)}else{t.trust-=8;d.tension+=8;S.scandal+=2;toast('Negotiations collapse.')}t.trust=clamp4(t.trust);d.relation=clamp4(d.relation);d.tension=clamp4(d.tension);render()};
window.v4Front=function(i,a){ensure4();let f=S.v3.fronts[i];if(a==='rotate'){if(S.influence<8)return toast('Need 8 influence.');S.influence-=8;f.commander=V4_COMMANDERS[R(V4_COMMANDERS.length)];f.morale+=5}if(a==='fortify'){if(S.money<350)return toast('Need 350 denarii.');S.money-=350;f.supply+=15;f.roman+=8;f.morale+=4}if(a==='offensive'){if(!spend(3))return;let chance=45+(f.roman-f.enemy)+(f.supply-50)/3+(f.morale-50)/3+f.veterans*2+S.strategy*2;if(R(100)<chance){f.enemy-=18+R(18);f.roman-=3+R(8);f.supply-=10;f.morale+=8;f.veterans++;S.influence+=18;S.v4.reputation.Ruthless+=2;if(typeof chronicle==='function')chronicle(`${f.commander} breaks the enemy line at ${f.name}.`)}else{f.roman-=10+R(12);f.supply-=14;f.morale-=12;S.popularity-=4;if(typeof chronicle==='function')chronicle(`The grand offensive at ${f.name} fails.`)}}['roman','enemy','supply','morale'].forEach(k=>f[k]=clamp4(f[k]));render()};
function tick4(){ensure4();if(S.v4.lastTick===S.day)return;let d=Math.max(1,S.day-S.v4.lastTick);S.v4.lastTick=S.day;S.v4.agenda.days-=d;if(S.v4.agenda.days<=0)v4ForceVote();S.v4.council.forEach(m=>{m.loyalty=clamp4(m.loyalty+R(5)-2);if(m.loyalty<20&&Math.random()<.12){S.scandal+=3;if(typeof chronicle==='function')chronicle(`${m.name} obstructs the government from within.`)}});Object.entries(S.v4.treaties).forEach(([n,t])=>{if(t.days>0){t.days-=d;t.trust=clamp4(t.trust+(R(3)-1));if(t.days<=0){t.status='Treaty expired';t.terms=[]}}});S.v3.fronts.forEach(f=>{f.supply=clamp4(f.supply-1+(S.v4.policies.includes('legion')?2:0));f.morale=clamp4(f.morale+(f.supply>50?1:-2));f.roman=clamp4(f.roman+(f.morale>65?1:0))});if(S.v4.policies.includes('citizen'))Object.values(S.provinces).forEach(p=>{p.loyalty=clamp4(p.loyalty+1);p.unrest=clamp4(p.unrest-1)});if(S.v4.policies.includes('market')){S.money+=Math.round(Object.values(S.v3.powers).reduce((q,x)=>q+x.trade,0)*.2);S.corruption+=1}if(S.v4.policies.includes('academy')){S.learning+=Math.random()<.08?1:0;Object.values(S.v3.powers).forEach(x=>x.intel+=1)}}
function drawStrategic(){let c=document.getElementById('v4WarMap');if(!c||!S?.v3)return;let d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let g=x.createRadialGradient(w*.5,h*.4,10,w*.5,h*.4,w*.7);g.addColorStop(0,'#183142');g.addColorStop(.55,'#09141b');g.addColorStop(1,'#050609');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#4e849255';for(let i=0;i<18;i++){x.beginPath();x.moveTo(i*w/18,0);x.lineTo((i-3)*w/18,h);x.stroke()}let time=performance.now()/700;S.v3.fronts.forEach((f,i)=>{let y=65+i*95,split=w*(.2+.6*f.roman/(f.roman+f.enemy));x.fillStyle='#69deeb22';x.fillRect(0,y-23,split,46);x.fillStyle='#d5554e22';x.fillRect(split,y-23,w-split,46);x.strokeStyle='#e8bd61';x.lineWidth=2;x.beginPath();for(let j=0;j<=20;j++){let px=j*w/20,py=y+Math.sin(j*.8+time+i)*8;x.lineTo(px,py)}x.stroke();for(let j=0;j<9;j++){let roman=j<Math.round(f.roman/12),px=(roman?35:split+25)+j*24,py=y+Math.sin(time+j)*12;x.fillStyle=roman?'#77e9f3':'#e06b5c';x.beginPath();x.arc(Math.min(w-18,px),py,4+(j%2),0,7);x.fill()}x.fillStyle='#f0d28c';x.font='12px Georgia';x.fillText(`${f.name} • ${f.commander}`,14,y-31)});}
/* Code-only cinematic environment overlay */
const LIVE={canvas:null,ctx:null,scene:'Capital',actors:[],raf:0,last:0};
function liveInit(){let stage=document.getElementById('artStage');if(!stage||document.getElementById('v4Live'))return;let wrap=document.createElement('div');wrap.id='v4Live';wrap.className='v4-live-stage';let c=document.createElement('canvas');wrap.appendChild(c);stage.appendChild(wrap);let badge=document.createElement('div');badge.className='v4-render-badge';badge.textContent='V4 PROCEDURAL WORLD';stage.appendChild(badge);LIVE.canvas=c;LIVE.ctx=c.getContext('2d');setLiveActors();requestAnimationFrame(liveFrame)}
function setLiveActors(){let counts={Senate:8,Campaign:12,'War Room':6,Diplomacy:5,People:9,Capital:7,Provinces:4,Research:4,Estate:4,Chronicle:3};let n=counts[LIVE.scene]||5;LIVE.actors=Array.from({length:n},(_,i)=>({x:(i+1)/(n+1),z:.15+Math.random()*.8,phase:Math.random()*6.28,role:i%4,dir:i%2?1:-1}))}
function liveFrame(t){if(!LIVE.canvas)return;let c=LIVE.canvas,r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(c.width!==r.width*d||c.height!==r.height*d){c.width=r.width*d;c.height=r.height*d}let x=LIVE.ctx,w=r.width,h=r.height;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);drawWorld(x,w,h,t);LIVE.raf=requestAnimationFrame(liveFrame)}
function drawWorld(x,w,h,t){let scene=LIVE.scene,time=t/1000;x.save();x.globalAlpha=.42;
 // parallax architecture
 for(let layer=0;layer<3;layer++){let base=h*(.34+layer*.18),speed=(layer+1)*3,off=(time*speed)%(w/5);x.fillStyle=[ '#0b1720','#10161a','#171514'][layer];for(let i=-2;i<8;i++){let bx=i*w/5-off,hw=45+((i*37+layer*19)%65+65)%65,hh=35+((i*53+layer*11)%90+90)%90;x.fillRect(bx,base-hh,hw,hh);if(layer>0){x.fillStyle='#d9ad4d22';for(let yy=base-hh+10;yy<base-7;yy+=14)for(let xx=bx+9;xx<bx+hw-5;xx+=16)x.fillRect(xx,yy,4,5);x.fillStyle=[ '#0b1720','#10161a','#171514'][layer]}}}
 // scene ornaments
 if(scene==='Senate'){x.strokeStyle='#d1aa5b55';x.lineWidth=5;for(let i=0;i<7;i++){x.beginPath();x.arc(w/2,h*.78,70+i*24,Math.PI,2*Math.PI);x.stroke()}}
 if(scene==='Research'){x.strokeStyle='#66ddec77';x.lineWidth=2;for(let i=0;i<4;i++){x.beginPath();x.ellipse(w*.68,h*.36,45+i*15,16+i*6,time*(i%2?1:-1),0,7);x.stroke()}}
 if(scene==='War Room'){x.strokeStyle='#d6544d66';for(let i=0;i<8;i++){x.beginPath();x.moveTo(w*.15,h*.2+i*9);x.lineTo(w*.85,h*.75-i*5);x.stroke()}}
 // animated people with shadows, cloth and faces
